<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-label="汇总的静默黑洞：明细消失后汇总路由仍吸引流量，命中 Null0 丢弃且不产生 ICMP">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}.ar2{stroke:#c0392b;stroke-width:1.8;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}.ar2{stroke:#f87171}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#c0392b"/></marker></defs>
<rect class="bg" width="900" height="424"/>
<text class="h" x="24" y="26">汇总的代价：明细丢了，汇总还在 —— 静默黑洞的三步（5.4.1 节）</text>

<rect class="b2" x="24" y="44" width="264" height="186" rx="8"/>
<text class="t" x="40" y="68">① 正常态</text>
<rect class="b" x="44" y="82" width="66" height="34" rx="6"/><text class="s" x="54" y="104">核心</text>
<rect class="b" x="132" y="82" width="70" height="34" rx="6"/><text class="s" x="140" y="104">ABR-2</text>
<rect class="b" x="224" y="82" width="52" height="34" rx="6"/><text class="s" x="232" y="104">PE-9</text>
<path class="ar" d="M110 99 L132 99" marker-end="url(#a)"/>
<path class="ar" d="M202 99 L224 99" marker-end="url(#a)"/>
<text class="s" x="40" y="142">核心看到 fdbb:bb00::/40</text>
<text class="s" x="40" y="162">ABR-2 有 fc00:0:9::/48 明细</text>
<text class="g" x="40" y="186">报文按明细送达 PE-9</text>
<text class="s" x="40" y="210">Null0 在，但不被用到</text>

<rect class="b3" x="318" y="44" width="264" height="186" rx="8"/>
<text class="t" x="334" y="68">② 明细消失</text>
<rect class="b" x="338" y="82" width="66" height="34" rx="6"/><text class="s" x="348" y="104">核心</text>
<rect class="b3" x="426" y="82" width="70" height="34" rx="6"/><text class="s" x="434" y="104">ABR-2</text>
<rect class="b4" x="518" y="82" width="52" height="34" rx="6"/><text class="s" x="526" y="104">PE-9</text>
<path class="ar" d="M404 99 L426 99" marker-end="url(#a)"/>
<path class="ar2" d="M496 99 L500 99" stroke-dasharray="3 3"/>
<text class="s" x="334" y="142">PE-9 所在区域断开</text>
<text class="s" x="334" y="162">fc00:0:9::/48 撤销</text>
<text class="o" x="334" y="186">但 /40 本身仍被通告</text>
<text class="o" x="334" y="210">（只要还有别的分量在）</text>

<rect class="b4" x="612" y="44" width="264" height="186" rx="8"/>
<text class="t" x="628" y="68">③ 报文照常发来</text>
<rect class="b" x="632" y="82" width="66" height="34" rx="6"/><text class="s" x="642" y="104">核心</text>
<rect class="b4" x="720" y="82" width="70" height="34" rx="6"/><text class="s" x="728" y="104">ABR-2</text>
<rect class="b4" x="812" y="82" width="52" height="34" rx="6"/><text class="s" x="818" y="96">Null0</text><text class="s" x="818" y="112">丢弃</text>
<path class="ar" d="M698 99 L720 99" marker-end="url(#a)"/>
<path class="ar2" d="M790 99 L812 99" marker-end="url(#ar)"/>
<text class="s" x="628" y="142">没有更明细 → 命中 Null0</text>
<text class="r" x="628" y="166">丢弃，且不产生 ICMP</text>
<text class="s" x="628" y="190">报文在骨干外沿就消失</text>
<text class="r" x="628" y="214">没有任何一层报错</text>

<rect class="b" x="24" y="248" width="426" height="96" rx="8"/>
<text class="t" x="42" y="272">业务侧看到的现象</text>
<text class="s" x="42" y="296">ping 客户地址超时；traceroute 停在 ABR-2</text>
<text class="s" x="42" y="318">同区域其他目的正常，只有 peering 到断点的那几条不通</text>
<text class="s" x="42" y="338">换一台 ABR 走可能就通了 —— 这会把矛头指向“负载均衡”</text>

<rect class="b" x="470" y="248" width="406" height="96" rx="8"/>
<text class="t" x="488" y="272">运维侧看到的现象</text>
<text class="s" x="488" y="296">核心路由表里 /40 一直在，一切“正常”</text>
<text class="s" x="488" y="318">ABR-2 上 show route /40 仍是 via Null0</text>
<text class="r" x="488" y="338">真正要看的：明细条数有没有在减少</text>

<rect class="b3" x="24" y="356" width="852" height="56" rx="8"/>
<text class="t" x="42" y="380">判据：via Null0 存在是预期的；via Null0 存在 + 明细一批一批消失，才是黑洞正在形成。</text>
<text class="s" x="42" y="400">根治手段在第 8 章 UPA：明细消失时由汇总点主动通告“该前缀不可达”，而不是靠上游永远相信 /40。</text>
</svg>
