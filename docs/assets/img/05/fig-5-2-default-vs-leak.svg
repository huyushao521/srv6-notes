<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-label="只靠 ATT 默认路由与泄露 L2 明细两种做法的路径对比">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}.ad{stroke:#0b6bcb;stroke-width:2;fill:none;stroke-dasharray:6 4}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}
.ar{stroke:#5a6472}.ad{stroke:#58a6ff}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#0b6bcb"/></marker></defs>
<rect class="bg" width="900" height="436"/>
<text class="h" x="24" y="26">同一个目的、两条路径：ATT 默认路由 vs 泄露 L2 明细（5.1 / 5.2 节）</text>

<rect class="b4" x="24" y="42" width="416" height="250" rx="8"/>
<text class="t" x="42" y="66">① 只靠 ATT 默认路由（现状）</text>
<rect class="b" x="60" y="84" width="140" height="42" rx="7"/><text class="t" x="74" y="110">PE-1（L1-only）</text>
<rect class="b" x="60" y="162" width="140" height="42" rx="7"/><text class="t" x="74" y="188">ABR-2（最近）</text>
<rect class="b" x="266" y="162" width="140" height="42" rx="7"/><text class="s" x="280" y="188">ABR-6（最优）</text>
<rect class="b" x="150" y="240" width="140" height="42" rx="7"/><text class="t" x="164" y="266">PE-7</text>
<path class="ar" d="M130 126 L130 162" marker-end="url(#a)"/><text class="m" x="136" y="148">::/0</text>
<path class="ar" d="M130 204 L130 222 L220 222 L220 240" marker-end="url(#a)"/>
<path class="ad" d="M200 105 L336 105 L336 162" marker-end="url(#ab)"/>
<text class="r" x="212" y="100">默认路由看不见它</text>
<text class="r" x="352" y="140">✗</text>
<text class="s" x="42" y="216">出口 = 最近 ABR → 绕行整个骨干</text>
<text class="r" x="42" y="278">路由表 1 条 · 算法属性丢失 · 次优</text>

<rect class="b2" x="460" y="42" width="416" height="250" rx="8"/>
<text class="t" x="478" y="66">② 把 L2 明细泄露进 L1（5.2 节）</text>
<rect class="b" x="496" y="84" width="140" height="42" rx="7"/><text class="t" x="510" y="110">PE-1（L1-only）</text>
<rect class="b" x="496" y="162" width="140" height="42" rx="7"/><text class="s" x="510" y="188">ABR-2（次优）</text>
<rect class="b2" x="702" y="162" width="140" height="42" rx="7"/><text class="t" x="716" y="188">ABR-6（最优）</text>
<rect class="b" x="586" y="240" width="140" height="42" rx="7"/><text class="t" x="600" y="266">PE-7</text>
<path class="ar" d="M566 126 L566 162" marker-end="url(#a)"/><text class="m" x="572" y="148">明细</text>
<path class="ar" d="M636 126 L636 162 L772 162"/>
<path class="ar" d="M772 204 L772 222 L656 222 L656 240" marker-end="url(#a)"/>
<text class="g" x="644" y="120">按前缀选出口</text>
<text class="r" x="500" y="216">✗ 不被选中</text>
<text class="g" x="478" y="278">路由表 N 条 · 算法保留 · 出口最优</text>

<rect class="b3" x="24" y="308" width="852" height="104" rx="8"/>
<text class="t" x="42" y="332">代价与边界：明细泄露 = 正确性 + 算法能力，代价是规模；聚合泄露 = 按区域选出口，不按目的地选出口</text>
<text class="s" x="42" y="356">泄露只放 locator 聚合，绝不放客户前缀 —— 客户可达性属于 BGP。IGP 是全量泛洪 + SPF，BGP 抖动会被放大成全网 SPF。</text>
<text class="r" x="42" y="382">一句话：默认路由让 SRv6 “能通”，泄露让 SRv6 “通得对”，汇总让“通得对”还能扩到 19,000 台节点。</text>
</svg>
