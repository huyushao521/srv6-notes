<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-label="双 ABR 同时汇总时，单边明细丢失导致 ECMP 下的半丢包，三方观测都显示正常">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.7;fill:none}.ag{stroke:#2f855a;stroke-width:1.9;fill:none}.ar2{stroke:#c0392b;stroke-width:1.9;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}.ag{stroke:#68d391}.ar2{stroke:#f87171}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#2f855a"/></marker>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#c0392b"/></marker></defs>
<rect class="bg" width="900" height="424"/>
<text class="h" x="24" y="26">双 ABR 同时汇总：两个 /40 等价，但只有一边有明细（5.4.3 节）</text>

<rect class="b1" x="32" y="86" width="130" height="112" rx="8"/>
<text class="t" x="66" y="132">核心</text>
<text class="s" x="46" y="156">两条 /40 等价</text>
<rect class="b2" x="280" y="62" width="200" height="66" rx="8"/>
<text class="t" x="296" y="86">ABR-2　/40</text>
<text class="g" x="296" y="108">明细完整</text>
<rect class="b4" x="280" y="176" width="200" height="66" rx="8"/>
<text class="t" x="296" y="200">ABR-6　/40</text>
<text class="r" x="296" y="222">明细已丢（区域断）</text>
<rect class="b2" x="560" y="62" width="140" height="66" rx="8"/>
<text class="t" x="576" y="86">送达 PE-9</text>
<text class="s" x="576" y="108">业务正常</text>
<rect class="b4" x="560" y="176" width="140" height="66" rx="8"/>
<text class="t" x="576" y="200">Null0</text>
<text class="r" x="576" y="222">丢弃，无 ICMP</text>

<path class="ag" d="M162 118 L280 96" marker-end="url(#ag)"/>
<path class="ar2" d="M162 166 L280 208" marker-end="url(#ar)"/>
<text class="m" x="170" y="176">ECMP</text>
<text class="s" x="170" y="196">约 50% / 50%</text>
<path class="ag" d="M480 96 L560 96" marker-end="url(#ag)"/>
<path class="ar2" d="M480 208 L560 208" marker-end="url(#ar)"/>

<text class="s" x="720" y="96">同一份明细，</text>
<text class="s" x="720" y="116">两台 ABR 上</text>
<text class="s" x="720" y="136">数量不一致</text>
<text class="r" x="720" y="160">→ 一台隐形黑洞</text>

<rect class="b" x="24" y="266" width="852" height="140" rx="8"/>
<text class="t" x="42" y="290">三方各自看都正常</text>
<text class="s" x="96" y="316">视角</text><text class="s" x="320" y="316">看到的事实</text><text class="s" x="700" y="316">结论</text>
<text class="t" x="96" y="342">核心</text><text class="s" x="320" y="342">两条 /40 等价，走 ECMP</text><text class="g" x="700" y="342">一切正常</text>
<text class="t" x="96" y="366">ABR-6</text><text class="s" x="320" y="366">/40 在、Null0 在</text><text class="g" x="700" y="366">一切正常</text>
<text class="t" x="96" y="390">业务</text><text class="s" x="320" y="390">约 50% 丢包，时通时不通</text><text class="r" x="700" y="390">网络有问题</text>

<rect class="b3" x="24" y="418" width="0" height="0"/>
</svg>
