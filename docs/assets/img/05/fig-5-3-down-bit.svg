<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" role="img" aria-label="down bit 的传播与回灌即丢弃：L2 到 L1 泄露置 X=1，带 X 位从 L1 回到 L2 必须忽略">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}.ad{stroke:#c0392b;stroke-width:2;fill:none;stroke-dasharray:6 4}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}.ad{stroke:#f87171}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#c0392b"/></marker></defs>
<rect class="bg" width="900" height="476"/>
<text class="h" x="24" y="26">down bit 怎么防环：合法的向下泄露 vs 必须丢弃的向上回灌（5.2.1 节）</text>

<rect class="b1" x="40" y="46" width="560" height="104" rx="8"/>
<text class="t" x="58" y="70">L2 骨干</text>
<text class="s" x="132" y="70">全网 locator 明细都在这里</text>
<rect class="b" x="72" y="96" width="180" height="44" rx="7"/><text class="t" x="86" y="115">ABR-2</text><text class="m" x="86" y="132">有 fc00:0:7::/48</text>
<rect class="b" x="360" y="96" width="180" height="44" rx="7"/><text class="t" x="374" y="115">ABR-4</text><text class="m" x="374" y="132">收到回灌 → 忽略</text>

<rect class="b" x="40" y="196" width="560" height="124" rx="8"/>
<text class="s" x="58" y="218">Area 49.0001（Level-1）</text>
<rect class="b2" x="72" y="232" width="230" height="66" rx="7"/>
<text class="t" x="86" y="254">PE-1　学到 fc00:0:7::/48</text>
<text class="m" x="86" y="274">Prefix Attribute Flags: X:1</text>
<text class="s" x="86" y="291">→ 可用，且按前缀选 ABR</text>

<path class="ar" d="M162 148 L162 196" marker-end="url(#a)"/>
<text class="g" x="176" y="176">① 泄露 L2→L1：置 down 位 X=1</text>

<path class="ad" d="M302 240 L332 240 L332 168 L450 168 L450 142" marker-end="url(#ar)"/>
<text class="r" x="342" y="192">② 有人 redistribute 回 L2：X 仍为 1</text>
<text class="r" x="462" y="150">③ 规则：忽略</text>
<text class="s" x="462" y="168">否则 L2↔L1↔L2 三跳环</text>

<rect class="b" x="624" y="46" width="252" height="80" rx="8"/>
<text class="t" x="640" y="70">① 向下泄露：置 X=1</text>
<text class="s" x="640" y="92">L2 → L1，唯一合法的泄露</text>
<text class="s" x="640" y="110">方向；L1 节点据此选最优 ABR</text>

<rect class="b" x="624" y="136" width="252" height="80" rx="8"/>
<text class="t" x="640" y="160">② 向上通告：不置 X</text>
<text class="s" x="640" y="182">L1 → L2，表达“本区 locator</text>
<text class="s" x="640" y="200">由此可达”，骨干需要这份信息</text>

<rect class="b4" x="624" y="226" width="252" height="94" rx="8"/>
<text class="t" x="640" y="250">③ 带 X 从 L1 回 L2：丢弃</text>
<text class="s" x="640" y="272">带 down 位的前缀不允许向上</text>
<text class="s" x="640" y="290">传播，这是 IS-IS 隐式防环规则</text>
<text class="r" x="640" y="310">实例间重分发没有这层保护</text>

<rect class="b3" x="40" y="336" width="836" height="118" rx="8"/>
<text class="t" x="58" y="360">两个方向都要配：只配 L2→L1，区内能出去但别的区域回不来；只配 L1→L2，骨干有明细但区内仍靠默认路由出门。</text>
<text class="s" x="58" y="384">X 位在 RFC 5305 的 IPv6 扩展可达性 TLV 里 —— show isis database verbose level-1 看到 X:1，就是“这条是泄露来的”。</text>
<text class="s" x="58" y="408">泄露范围永远收窄到 locator：prefix-set fdbb:bb00::/32 le 48。写成 le 64 就把客户前缀拉进 IGP 了。</text>
<text class="r" x="58" y="436">5.3 节的实例间重分发没有 up/down 保护 —— 防环只能靠“只放 locator + 两个方向共用一个 prefix-set”。</text>
</svg>
