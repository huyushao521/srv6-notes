<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" width="900" height="442" role="img" aria-label="MTU 预算：CE 侧 1500 加 40 字节外层需要核心 1540，加 SRH 后建议 1580 到 1600">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 11.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ok{fill:#d6ecdd;stroke:#2f855a;stroke-width:1.2}.bad{fill:#f0a8a8;stroke:#c0392b;stroke-width:1.2}
.bar{fill:#cfe0f4;stroke:#0b6bcb;stroke-width:1.2}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ok{fill:#15301f;stroke:#68d391}.bad{fill:#4a1d1d;stroke:#f87171}.bar{fill:#16304d;stroke:#58a6ff}}
</style>
<rect class="bg" width="900" height="442"/>
<text class="h" x="20" y="26">6.8 MTU：40 字节一层一层加上去，最后落在核心链路 MTU 上（原书 Figure 6.5 重绘）</text>

<text class="t" x="20" y="58">预算阶梯</text>
<rect class="bar" x="130" y="70" width="200" height="26" rx="4"/>
<text class="m" x="338" y="88">1500　CE 侧接口 MTU</text>
<rect class="bar" x="130" y="108" width="280" height="26" rx="4"/>
<text class="m" x="418" y="126">1540　＋40 B 外层 IPv6 头（L3VPN 最小需求）</text>
<rect class="bar" x="130" y="146" width="328" height="26" rx="4"/>
<text class="m" x="466" y="164">1564　＋SRH 8 B ＋1 段 16 B（TI-LFA 场景）</text>
<rect class="bar" x="130" y="184" width="360" height="26" rx="4"/>
<text class="m" x="498" y="202">1580　＋2 段 → 建议核心统一 ≥ 1600</text>

<rect class="b" x="590" y="62" width="290" height="152" rx="8"/>
<text class="t" x="606" y="86">现网三种做法</text>
<text class="s" x="606" y="110">① 核心直接上 9000（jumbo）</text>
<text class="s" x="606" y="130">　 一劳永逸，但要全链路统一</text>
<text class="s" x="606" y="152">② 核心 1580–1600</text>
<text class="s" x="606" y="172">　 覆盖 L3VPN + 少量 SRH</text>
<text class="s" x="606" y="194">③ 保持 1500 + PE 上 MSS 钳制</text>
<text class="r" x="606" y="210">　 依赖 PMTUD 不可靠</text>

<text class="t" x="20" y="244">例 6.6 的二分法：在 1400 与 1472 之间找实际可用 MTU</text>
<path d="M40 268 L860 268" stroke="#9aa4b2" stroke-width="1.4" fill="none"/>
<rect class="ok" x="60" y="252" width="380" height="14" rx="3"/>
<text class="s" x="60" y="290">1400 通</text>
<rect class="bad" x="560" y="252" width="300" height="14" rx="3"/>
<text class="s" x="700" y="290">1472 全丢</text>
<text class="m" x="440" y="246">临界</text>
<text class="m" x="300" y="312">1448 &lt; 1500 ✓</text>
<text class="m" x="620" y="312">1472 + 8 + 40 = 1520 &gt; 1500 ✗</text>

<rect class="b4" x="20" y="326" width="420" height="94" rx="8"/>
<text class="t" x="36" y="350">为什么会"ping 通、传文件卡死"</text>
<text class="s" x="36" y="372">IPv6 路由器不在中间分片，超 MTU 直接丢</text>
<text class="s" x="36" y="392">ICMPv6 Packet Too Big 常被安全策略过滤</text>
<text class="r" x="36" y="410">→ 发送方永远不知道原因，路由侧 show 也看不出来</text>

<rect class="b3" x="460" y="326" width="420" height="94" rx="8"/>
<text class="t" x="476" y="350">MTU 为什么会漏</text>
<text class="s" x="476" y="372">按"光纤 / 微波"人工分类改 MTU，必漏微波段</text>
<text class="s" x="476" y="392">跨运营商互联、带外管理网段常被遗忘</text>
<text class="o" x="476" y="410">→ 应按拓扑自动发现，迁移前用 size 1472 全量探测</text>
</svg>
