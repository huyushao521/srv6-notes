<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-label="SID 空间实算：/48 locator 之后有 80 bit 可作 uSID 容器，function 空间为每 16 bit 位 65,536 个">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 11.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.seg1{fill:#cfe0f4;stroke:#0b6bcb;stroke-width:1.2}.seg2{fill:#f6d9b8;stroke:#b7791f;stroke-width:1.2}
.seg3{fill:#d6ecdd;stroke:#2f855a;stroke-width:1.2}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.seg1{fill:#16304d;stroke:#58a6ff}.seg2{fill:#3d2c12;stroke:#ecc94b}.seg3{fill:#15301f;stroke:#68d391}.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="436"/>
<text class="h" x="20" y="26">6.3.1 的实算：一条 128 bit 地址被切成 locator + node + 5 个 uSID 容器</text>

<rect class="seg1" x="40" y="56" width="300" height="46" rx="4"/>
<text class="m" x="52" y="76">locator 48 bit</text><text class="s" x="52" y="94">BGP 通告、IGP 聚合的单位</text>
<rect class="seg2" x="340" y="56" width="100" height="46" rx="4"/>
<text class="m" x="350" y="76">node 16</text><text class="s" x="350" y="94">每 PE 唯一</text>
<rect class="seg3" x="440" y="56" width="400" height="46" rx="4"/>
<text class="m" x="452" y="76">uSID 容器 80 bit = 5 × 16 bit</text>
<text class="s" x="452" y="94">一条报文最多串 5 条微指令（超出就要 SRH）</text>

<path class="ar" d="M340 108 L340 124" marker-end="url(#a)"/>
<text class="s" x="330" y="140">/48 内最后 16 bit 由 pfx-16 声明为 node</text>
<path class="ar" d="M500 108 L500 124" marker-end="url(#a)"/>
<text class="s" x="470" y="140">容器深度（横向）与 function 空间（纵向）是两件事</text>

<rect class="b1" x="20" y="156" width="420" height="96" rx="8"/>
<text class="t" x="36" y="180">① 容器深度：一条报文能装几条指令</text>
<text class="s" x="36" y="202">由 128 bit 包头决定，/48 下约 5 个位置</text>
<text class="s" x="36" y="222">决定段列表长度、是否必须压 SRH</text>
<text class="o" x="36" y="242">影响：转发性能与封装开销</text>

<rect class="b2" x="460" y="156" width="420" height="96" rx="8"/>
<text class="t" x="476" y="180">② function 空间：一个 locator 能分多少 SID</text>
<text class="s" x="476" y="202">每个 16 bit 位有 65,536 个值，与报文长度无关</text>
<text class="s" x="476" y="222">决定 VRF / 接入电路能有多少个</text>
<text class="g" x="476" y="242">影响：locator 规划与是否要转置</text>

<rect class="b" x="20" y="266" width="860" height="92" rx="8"/>
<text class="t" x="36" y="290">按每个 VRF 一个 uDT46 算（正文实算）</text>
<text class="m" x="36" y="312">单台 PE：4,000 VRF &lt; 65,536 → 一个 /48 绰绰有余</text>
<text class="m" x="36" y="334">全网：300 PE × 65,536 ≈ 1,967 万 SID 空间</text>
<text class="r" x="36" y="354">per-CE 才是真消耗：20,000 条接入电路 = 一个 /48 的三分之一 → 6.6 转置的动机</text>

<rect class="b3" x="20" y="372" width="860" height="58" rx="8"/>
<text class="t" x="36" y="396">工程判据：先看①还是先看②，决定了完全不同的方案 —— 容器不够要减指令（简化业务编程），function 不够要扩 locator 或上转置。</text>
<text class="s" x="36" y="418">把两个"容量"混起来谈，是 SID 规划阶段最常见的错误来源。</text>
</svg>
