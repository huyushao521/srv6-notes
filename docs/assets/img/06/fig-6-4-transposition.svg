<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-label="转置把 SID 拆成可路由的 locator+function 与本地可变的 argument，用于省 SID 空间与互通">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 11.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.s1{fill:#cfe0f4;stroke:#0b6bcb;stroke-width:1.2}.s2{fill:#d6ecdd;stroke:#2f855a;stroke-width:1.2}.s3{fill:#f6d9b8;stroke:#b7791f;stroke-width:1.2}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.s1{fill:#16304d;stroke:#58a6ff}.s2{fill:#15301f;stroke:#68d391}.s3{fill:#3d2c12;stroke:#ecc94b}.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="436"/>
<text class="h" x="20" y="26">6.6 转置：通告的部分固定，可变的部分编码业务实例（原书 Figure 6.4 重绘）</text>

<rect class="s1" x="40" y="46" width="300" height="52" rx="4"/>
<text class="m" x="54" y="68">Locator（32–48 bit）</text><text class="s" x="54" y="88">IGP 里可路由</text>
<rect class="s2" x="340" y="46" width="140" height="52" rx="4"/>
<text class="m" x="352" y="68">Function 16</text><text class="s" x="352" y="88">行为码</text>
<rect class="s3" x="480" y="46" width="380" height="52" rx="4"/>
<text class="m" x="492" y="68">Argument（16–48 bit）</text><text class="s" x="492" y="88">本地编码：VRF ID / 接入电路 / VPN label</text>

<rect class="b1" x="40" y="104" width="820" height="26" rx="4"/>
<text class="s" x="52" y="122">↑ BGP Prefix-SID 里通告的就是这一段（Locator + Function），对端原样拷进 DA</text>

<path class="ar" d="M340 136 L340 152" marker-end="url(#a)"/>
<path class="ar" d="M560 136 L560 152" marker-end="url(#a)"/>

<rect class="b2" x="20" y="160" width="420" height="96" rx="8"/>
<text class="t" x="36" y="184">用途一：省 SID 空间</text>
<text class="s" x="36" y="206">一台 PE 几万条接入电路，只通告一个 SID</text>
<text class="s" x="36" y="226">电路编号编进 argument，而不是每条一个 SID</text>
<text class="m" x="36" y="246">20,000 AC → 1 Prefix-SID + 20,000 argument</text>

<rect class="b3" x="460" y="160" width="420" height="96" rx="8"/>
<text class="t" x="476" y="184">用途二：MPLS ↔ SRv6 互通</text>
<text class="s" x="476" y="206">argument 里装由 VPN 标签推导出的值</text>
<text class="s" x="476" y="226">网关双向翻译，不需逐前缀状态</text>
<text class="g" x="476" y="246">→ 几千个 VRF 只需一张映射规则，不是几万条表项</text>

<rect class="b4" x="20" y="268" width="420" height="92" rx="8"/>
<text class="t" x="36" y="292">代价一：静默丢弃</text>
<text class="s" x="36" y="314">argument 不对 → 报文被丢，且通常不产生 ICMP</text>
<text class="s" x="36" y="334">两侧解释必须完全一致，包括位宽与字节序</text>
<text class="r" x="36" y="352">排障难度高于普通 SID：ping 通、业务不通</text>

<rect class="b" x="460" y="268" width="420" height="92" rx="8"/>
<text class="t" x="476" y="292">代价二：结构必须协商</text>
<text class="s" x="476" y="314">SID Structure 要通告且被理解（图 6-2）</text>
<text class="s" x="476" y="334">一旦改布局，全网接收方都要跟着改</text>
<text class="o" x="476" y="352">所以只在 SID 空间真成瓶颈时才用</text>

<rect class="b" x="20" y="372" width="860" height="56" rx="8"/>
<text class="t" x="36" y="396">选型顺序（正文表）：先扩 locator（/48 → /44 或 /40）→ 再退到 per-VRF → 最后才转置。前两者几乎无副作用，转置是"最后一招"。</text>
<text class="s" x="36" y="416">例外是互通网关：那里转置不是省空间，而是唯一能避免逐前缀状态的机制。</text>
</svg>
