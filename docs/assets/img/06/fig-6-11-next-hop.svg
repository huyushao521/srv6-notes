<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="VPNv4 的下一跳必须是 IPv6：下一跳为 IPv4 时入口 PE 拿到 Prefix-SID 也无法构造外层头">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 11.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.7;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#c0392b"/></marker></defs>
<rect class="bg" width="900" height="430"/>
<text class="h" x="20" y="26">6.4.1 现网第一号坑：拿到 SID 不等于能用它 —— 下一跳必须是 IPv6（RFC 8950）</text>

<rect class="b2" x="20" y="44" width="420" height="216" rx="8"/>
<text class="t" x="36" y="68">正确：IPv6 会话 + IPv6 下一跳</text>
<text class="m" x="36" y="94">Next-Hop = 2001:db8::2</text>
<text class="m" x="36" y="114">Prefix-SID = …:e001::  DT46</text>
<rect class="b" x="36" y="128" width="388" height="46" rx="6"/>
<text class="s" x="48" y="146">入口能构造外层头：DA = 远端 SID</text>
<text class="s" x="48" y="164">外层 sa 用本机 uN，NH = 4（内层 IPv4）</text>
<text class="g" x="36" y="196">→ 封装成立，报文按 locator 转发</text>
<text class="s" x="36" y="218">show bgp vpnv4 unicast → Next-Hop 是 IPv6</text>
<text class="s" x="36" y="240">这是迁移的第一步，不是最后一步</text>

<rect class="b4" x="460" y="44" width="420" height="216" rx="8"/>
<text class="t" x="476" y="68">错误：IPv4 会话 / IPv4 下一跳</text>
<text class="m" x="476" y="94">Next-Hop = 192.0.2.2</text>
<text class="m" x="476" y="114">Prefix-SID = …:e001::  DT46（照样有）</text>
<rect class="b" x="476" y="128" width="388" height="46" rx="6"/>
<text class="s" x="488" y="146">外层目的地址必须是一个 IPv6 地址</text>
<text class="s" x="488" y="164">但 IPv4 下一跳给不出可用的外层 SA/DA</text>
<text class="r" x="476" y="196">→ 路由不装，或回退到 MPLS 封装</text>
<text class="s" x="476" y="218">表现为"路由在、SID 在、业务不通"</text>
<text class="s" x="476" y="240">最容易被误判成 locator 不可达（第 5 章）</text>

<text class="t" x="20" y="288">四种现网表现与检查点</text>
<rect class="b" x="20" y="298" width="860" height="76" rx="8"/>
<text class="m" x="36" y="320">show bgp vpnv4 unicast &lt;prefix&gt;　→ 看 Next-Hop 是否 IPv6</text>
<text class="m" x="36" y="340">show bgp neighbor &lt;ip&gt;　　　　→ 看会话 AFI（是不是 IPv4-only）</text>
<text class="m" x="36" y="360">show cef vrf &lt;vrf&gt; &lt;prefix&gt; detail　→ 看最终封装类型</text>

<rect class="b3" x="20" y="384" width="860" height="40" rx="8"/>
<text class="s" x="36" y="410">迁移顺序：先把会话升级到 IPv6（或启用 RFC 8950 的 IPv6 next-hop 能力），再配 locator 与 alloc mode —— 顺序反了，会得到"部分站点不通且现象随机"。</text>
</svg>
