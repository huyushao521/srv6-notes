<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-label="300 台 PE 从 MPLS L3VPN 迁移到 SRv6 的三个阶段：共存、按区域切流、切默认与清退">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 11.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:2;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="452"/>
<text class="h" x="20" y="26">案例 A：300 台 PE / 4,000 VRF 的三阶段迁移 —— 每阶段都能停住、都能回退</text>

<path class="ar" d="M40 60 L860 60" marker-end="url(#a)"/>

<rect class="b1" x="20" y="76" width="280" height="212" rx="8"/>
<text class="t" x="36" y="100">阶段一：共存</text>
<text class="s" x="36" y="122">① 升级版本，统一定 SID block</text>
<text class="s" x="36" y="144">② 配 locator，先不设 alloc mode</text>
<text class="s" x="36" y="166">③ BGP 会话升到 IPv6（RFC 8950）</text>
<text class="s" x="36" y="188">④ 核心 MTU 1500 → 1600</text>
<text class="s" x="36" y="210">⑤ 结果：SRv6 看得见但不用</text>
<text class="r" x="36" y="234">验收：无 IPv4 next-hop</text>
<text class="r" x="36" y="254">　　　全 PE locator 可 ping</text>
<text class="s" x="36" y="276">此时业务路径完全没变</text>

<rect class="b3" x="310" y="76" width="280" height="212" rx="8"/>
<text class="t" x="326" y="100">阶段二：按区域切流</text>
<text class="s" x="326" y="122">⑥ 选一个区域（约 40 台 PE）</text>
<text class="s" x="326" y="144">⑦ 该区 VRF 开 per-vrf 分配</text>
<text class="s" x="326" y="166">⑧ 同路由同时带标签与 Prefix-SID</text>
<text class="s" x="326" y="188">⑨ 策略：区内 SRv6，跨区 MPLS</text>
<text class="o" x="326" y="210">⑩ 观察一周：命中计数 / CPU</text>
<text class="o" x="326" y="230">　　　MTU 告警 / 故障切换</text>
<text class="r" x="326" y="254">可回退的关键：双封装信息共存</text>
<text class="s" x="326" y="276">出问题只需改策略，不动配置</text>

<rect class="b2" x="600" y="76" width="280" height="212" rx="8"/>
<text class="t" x="616" y="100">阶段三：切默认与清退</text>
<text class="s" x="616" y="122">⑪ 全网"优先 SRv6"设为默认</text>
<text class="s" x="616" y="144">⑫ 拆互通网关</text>
<text class="s" x="616" y="166">⑬ 关 LDP / BGP 3107</text>
<text class="s" x="616" y="188">⑭ 移除 MPLS 标签池</text>
<text class="g" x="616" y="212">⑮ 保留一个月回退窗口</text>
<text class="s" x="616" y="232">　　　配置备份 + 标签池预留</text>
<text class="r" x="616" y="256">验收：show mpls ldp neighbor 为空</text>
<text class="s" x="616" y="276">拔纤验证 TI-LFA + BGP PIC</text>

<rect class="b4" x="20" y="300" width="420" height="98" rx="8"/>
<text class="t" x="36" y="324">三个必踩的坑</text>
<text class="s" x="36" y="346">① IPv4 下一跳残留 → 部分站点不通且随机</text>
<text class="s" x="36" y="366">② MTU 漏微波/跨运营商段 → 某些站点大包不通</text>
<text class="s" x="36" y="386">③ 新建 VRF 忘开 alloc mode → 有路由没有 SID</text>

<rect class="b" x="460" y="300" width="420" height="98" rx="8"/>
<text class="t" x="476" y="324">对应的三个巡检</text>
<text class="m" x="476" y="346">无 IPv4 next-hop 的 VPN 路由</text>
<text class="m" x="476" y="366">全 PE ping size 1472 通过</text>
<text class="m" x="476" y="386">VRF 数 == uDT46 SID 数（每日比对）</text>

<rect class="b3" x="20" y="410" width="860" height="34" rx="8"/>
<text class="s" x="36" y="432">迁移顺序不能反：版本与 locator → IPv6 会话 → MTU → 分配模式。任何一步提前，后面都会出现"部分站点不通且现象随机"。</text>
</svg>
