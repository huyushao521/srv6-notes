<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" width="900" height="442" role="img" aria-label="BGP Prefix-SID 属性结构：type 40 属性内含 SRv6 L3 Service TLV，再内含 SID Information Sub-TLV 与 SID Structure">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 11.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}}
</style>
<rect class="bg" width="900" height="442"/>
<text class="h" x="20" y="26">6.4：SID 是怎么被搬过来的 —— 一条 VPN 路由里装了什么（原书 Figure 6.2 重绘）</text>

<rect class="b1" x="20" y="44" width="386" height="196" rx="8"/>
<text class="t" x="36" y="68">MP-BGP VPNv4 Update（PE-2 → PE-1）</text>
<text class="s" x="36" y="96">NLRI</text>
<text class="m" x="96" y="96">RD 65000:100 + 10.1.2.0/24</text>
<text class="s" x="36" y="120">RT</text>
<text class="m" x="96" y="120">65000:100（扩展团体）</text>
<text class="s" x="36" y="144">Next-Hop</text>
<text class="m" x="96" y="144">2001:db8::2</text>
<text class="r" x="36" y="164">↑ 必须是 IPv6，否则封装出不来（6.4.1）</text>
<text class="s" x="36" y="190">Prefix-SID 属性</text>
<text class="m" x="36" y="210">type 40 → 见右侧嵌套结构</text>
<text class="s" x="36" y="230">（MPLS 时代这里是 Label 字段）</text>

<rect class="b3" x="430" y="44" width="440" height="196" rx="8"/>
<text class="s" x="442" y="62">Prefix-SID Attribute（type 40）</text>
<rect class="b3" x="450" y="70" width="400" height="156" rx="6"/>
<text class="s" x="462" y="88">SRv6 L3 Service TLV（type 5）</text>
<rect class="b2" x="466" y="96" width="368" height="118" rx="6"/>
<text class="s" x="478" y="114">SRv6 SID Information Sub-TLV（type 1，可多个）</text>
<text class="m" x="478" y="136">SID      = fdbb:bb00:0002:e001::</text>
<text class="m" x="478" y="156">Behavior = 0x0014（End.DT46）</text>
<rect class="b1" x="478" y="166" width="344" height="40" rx="5"/>
<text class="s" x="488" y="182">SID Structure Sub-Sub-TLV（type 1）</text>
<text class="m" x="488" y="200">Locator 48 · Function 16 · Argument 0</text>

<rect class="b2" x="20" y="254" width="420" height="88" rx="8"/>
<text class="t" x="36" y="278">为什么这三个字段必须一起传</text>
<text class="s" x="36" y="300">只有 SID，接收方不知道这是 VRF 还是接口</text>
<text class="s" x="36" y="320">只有 SID + Behavior，遇到非默认布局无法解析</text>
<text class="g" x="36" y="336">→ Structure 让接收方理解"任意切分方案"的 SID</text>

<rect class="b4" x="460" y="254" width="420" height="88" rx="8"/>
<text class="t" x="476" y="278">漏掉任何一个的表现</text>
<text class="s" x="476" y="300">无 Prefix-SID → 入口 PE 无法封装（6.9 第 3 步）</text>
<text class="s" x="476" y="320">Behavior 写成 DT4 而 VRF 是双栈 → IPv6 侧查表失败</text>
<text class="r" x="476" y="336">Structure 与实际分配不符 → 转置场景静默丢包</text>

<rect class="b" x="20" y="354" width="860" height="76" rx="8"/>
<text class="t" x="36" y="378">这四行就是排障的核心证据链（例 6.3）：有路由、有 RT、有 IPv6 下一跳、有 Prefix-SID —— 缺任何一项，SRv6 封装就出不来。</text>
<text class="s" x="36" y="400">注意 Prefix-SID 只走 BGP：P 路由器不会收到这条属性，也就永远不知道 VRF 与业务的存在，这是 BGP-free core 更严格的那一版。</text>
<text class="s" x="36" y="420">Type 40 与 TLV 编号来自 RFC 9252；MPLS 的 Label 字段与它是"同一个位置、不同内容"，所以迁移时 RR 与策略基本不用改。</text>
</svg>
