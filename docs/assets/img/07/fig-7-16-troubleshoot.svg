<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="二层故障按缺少哪类 EVPN 路由分支定位：Type 3 缺失、Type 2 在但 MAC 学不到、Type 1 缺失、DF 选举异常、大帧被丢，五种现象各有对应检查命令">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="470"/>
<text class="h" x="20" y="26">7.7 排障：先判断"缺哪一类路由"，再看具体命令</text>

<rect class="b1" x="20" y="42" width="240" height="36" rx="8"/>
<text class="t" x="36" y="66">现象：E-Line / E-LAN 不通</text>

<path class="ar" d="M130 78 L130 92 M130 92 L130 372 M130 92 L660 92"/>
<path class="ar" d="M130 118 L152 118 M130 118"/>
<path class="ar" d="M130 178 L152 178"/>
<path class="ar" d="M130 238 L152 238"/>
<path class="ar" d="M130 298 L152 298"/>
<path class="ar" d="M130 358 L152 358"/>

<rect class="b4" x="154" y="98" width="726" height="44" rx="8"/>
<text class="t" x="170" y="118">① Type 3（IMET）缺失</text>
<text class="s" x="170" y="136">广播与未知单播全不通，MAC 也学不到 → 查 EVPN 邻居 up？EVI 下配了 srv6？</text>

<rect class="b3" x="154" y="158" width="726" height="44" rx="8"/>
<text class="t" x="170" y="178">② Type 2 有、但 MAC 学不到</text>
<text class="s" x="170" y="196">全部绕行泛洪、时通时不通 → 查 SID 是否分配、下一跳是否 IPv6（同 6.4.1）</text>

<rect class="b3" x="154" y="218" width="726" height="44" rx="8"/>
<text class="t" x="170" y="238">③ Type 1 缺失（多归场景）</text>
<text class="s" x="170" y="256">无别名、无备份，一台 PE 故障即断 → 查 ESI 是否一致、ES 是否 Ready</text>

<rect class="b4" x="154" y="278" width="726" height="44" rx="8"/>
<text class="t" x="170" y="298">④ DF 选举异常</text>
<text class="s" x="170" y="316">广播不通，或广播重复（两台都转发）→ 查 show evpn ethernet-segment ... detail</text>

<rect class="b3" x="154" y="338" width="726" height="44" rx="8"/>
<text class="t" x="170" y="358">⑤ 大帧被丢</text>
<text class="s" x="170" y="376">小包通、大包不通 → 查 ping 大包 + show interface MTU（7.6）</text>

<rect class="b" x="20" y="398" width="860" height="60" rx="8"/>
<text class="t" x="36" y="422">五条分支的共同前提：先把三类路由看全</text>
<text class="m" x="36" y="444">show evpn evi 100 detail　／　show bgp l2vpn evpn summary　／　show segment-routing srv6 sid all</text>
</svg>
