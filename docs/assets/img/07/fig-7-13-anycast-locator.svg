<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 408" width="900" height="408" role="img" aria-label="anycast SID 的前缀不属于任何一台 PE 的本机 locator，必须由两台 PE 同时通告该 /48，才在 IGP 里形成两条等价路径">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="408"/>
<text class="h" x="20" y="26">7.4 看清前缀：anycast SID 的 /48 不是任何一台 PE 的本机 locator</text>

<rect class="b" x="20" y="44" width="470" height="146" rx="8"/>
<text class="m" x="36" y="68">show segment-routing srv6 sid all</text>
<text class="s" x="36" y="92">SID　　　　　　　　　　　Behavior　Context</text>
<text class="m" x="36" y="114">fdbb:bb00:0001:e000::　　uN　　　'default'</text>
<text class="m" x="36" y="134">fdbb:bb00:0001:e100::　　uDT2U　'EVI 100'</text>
<text class="m" x="36" y="154">fdbb:bb00:0001:e101::　　uDT2M　'EVI 100'（Arg=BD）</text>
<text class="m" x="36" y="174">fdbb:bb00:0001:e200::　　uDX2　'XC ELine-100'</text>

<rect class="b3" x="20" y="200" width="470" height="34" rx="6"/>
<text class="m" x="36" y="222">fdbb:bb00:0100:e100::　　uDX2　'ES 0011.0203...'</text>
<text class="s" x="20" y="256">↑ 前缀是 0100，不是本机的 0001 —— 这是 anycast SID</text>
<text class="r" x="20" y="278">它属于"这个 ES"，不属于"这台 PE"</text>

<rect class="b1" x="510" y="44" width="370" height="120" rx="10"/>
<text class="t" x="526" y="68">PE-1 通告</text>
<text class="m" x="526" y="92">locator fdbb:bb00:0001::/48</text>
<text class="m" x="526" y="114">+ fdbb:bb00:0100::/48（anycast）</text>
<text class="s" x="526" y="140">两条前缀都进 IGP（IS-IS / OSPF）</text>

<rect class="b1" x="510" y="176" width="370" height="120" rx="10"/>
<text class="t" x="526" y="200">PE-3 通告</text>
<text class="m" x="526" y="224">locator fdbb:bb00:0003::/48</text>
<text class="m" x="526" y="246">+ fdbb:bb00:0100::/48（同一条）</text>
<text class="s" x="526" y="272">与 PE-1 通告的前缀完全相同</text>

<rect class="b2" x="510" y="306" width="370" height="34" rx="6"/>
<text class="g" x="526" y="328">→ 前缀表里出现两个 next-hop，ECMP 成立</text>

<rect class="b" x="20" y="314" width="470" height="60" rx="8"/>
<text class="t" x="36" y="338">自检：只有一台 PE 通告会怎样</text>
<text class="s" x="36" y="360">anycast 前缀只有一条路径 → 没有分担，且那台 PE 挂掉即黑洞</text>
</svg>
