<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" width="900" height="412" role="img" aria-label="三种 SID 分配模式：per-evi 每 EVI 一对 uDT2U/uDT2M，per-AC 每条接入电路一条 uDX2，per-ES 每个多归网段一条 anycast SID">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="412"/>
<text class="h" x="20" y="26">7.4 三种分配模式：SID 的数量由"业务实例粒度"决定</text>

<rect class="b2" x="20" y="44" width="280" height="176" rx="10"/>
<text class="t" x="36" y="68">per-evi（EVI 下配置）</text>
<text class="m" x="36" y="94">alloc mode per-evi</text>
<text class="s" x="36" y="118">每 EVI 分配一对：</text>
<text class="m" x="36" y="140">uDT2U（单播/泛洪入向）</text>
<text class="m" x="36" y="162">uDT2M（复制，Arg=BD）</text>
<text class="o" x="36" y="190">消耗 = EVI 数量</text>
<text class="s" x="36" y="210">适用：E-LAN、多归</text>

<rect class="b3" x="312" y="44" width="280" height="176" rx="10"/>
<text class="t" x="328" y="68">per-AC（xconnect 下显式绑）</text>
<text class="m" x="328" y="94">sid ... behavior uDX2</text>
<text class="s" x="328" y="118">每条 AC 一条，SID 直接指向</text>
<text class="s" x="328" y="138">那条电路，转发不查表</text>
<text class="s" x="328" y="162">没有 MAC 学习，没有 BD</text>
<text class="r" x="328" y="190">消耗 = AC 数量（可能数十万）</text>
<text class="s" x="328" y="210">适用：海量点对点 E-Line / VPWS</text>

<rect class="b1" x="604" y="44" width="276" height="176" rx="10"/>
<text class="t" x="620" y="68">per-ES（可选）</text>
<text class="m" x="620" y="94">anycast SID（多台 PE 共用）</text>
<text class="s" x="620" y="118">同一 ES 的所有 PE 配同一个</text>
<text class="s" x="620" y="138">SID，形成 IGP 等价路径</text>
<text class="s" x="620" y="162">配合 DF 处理泛洪</text>
<text class="o" x="620" y="190">消耗 = ES 数量</text>
<text class="s" x="620" y="210">适用：全活多归单播分担</text>

<path class="ar" d="M160 220 L160 246 L450 246 L450 262" marker-end="url(#a)"/>
<path class="ar" d="M450 220 L450 262" marker-end="url(#a)"/>
<path class="ar" d="M742 220 L742 246 L450 246" marker-end="url(#a)"/>

<rect class="b" x="150" y="264" width="600" height="52" rx="8"/>
<text class="t" x="166" y="288">选型口诀：先看"业务实例是一条电路还是一组电路"</text>
<text class="s" x="166" y="308">一条电路 → per-AC（DX2）；一组电路共享一个广播域 → per-evi（DT2U/DT2M）；多台 PE 同接一段 → per-ES（anycast）</text>

<rect class="b1" x="20" y="330" width="860" height="34" rx="8"/>
<text class="m" x="36" y="352">show segment-routing srv6 sid all　→　Context 列直接暴露模式：'EVI 100' / 'XC ELine-100' / 'ES 0011.0203...'</text>

<rect class="b3" x="20" y="372" width="860" height="34" rx="8"/>
<text class="s" x="36" y="394">混用是常态：一台 PE 可以同时 per-evi（E-LAN）＋ per-AC（E-Line）＋ per-ES（多归），三者共用同一个 locator</text>
</svg>
