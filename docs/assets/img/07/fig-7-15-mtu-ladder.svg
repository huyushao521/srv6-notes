<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" role="img" aria-label="二层 MTU 预算阶梯：1518 字节标准以太帧，加 802.1Q 与 QinQ 各 4 字节，再加 40 字节 SRv6 外层 IPv6 头，QinQ 场景需要 1566 字节，核心建议 1600 或 9100">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="428"/>
<text class="h" x="20" y="26">7.6 二层 MTU：帧本身就胖，再加 40 字节就更胖</text>

<rect class="b" x="20" y="44" width="420" height="40" rx="6"/>
<text class="m" x="36" y="70">CE 侧标准以太帧（14 头 + 4 FCS + 1500）</text>
<text class="m" x="700" y="70">1518 B</text>

<rect class="b" x="20" y="94" width="420" height="40" rx="6"/>
<text class="m" x="36" y="120">+ 802.1Q VLAN Tag</text>
<text class="m" x="700" y="120">1522 B</text>

<rect class="b3" x="20" y="144" width="420" height="40" rx="6"/>
<text class="m" x="36" y="170">+ QinQ 第二层 Tag（城域常见）</text>
<text class="m" x="700" y="170">1526 B</text>

<rect class="b4" x="20" y="194" width="420" height="40" rx="6"/>
<text class="m" x="36" y="220">+ SRv6 外层 IPv6 头（40 B）</text>
<text class="m" x="700" y="220">1566 B</text>

<path class="ar" d="M240 84 L240 92" marker-end="url(#a)"/>
<path class="ar" d="M240 134 L240 142" marker-end="url(#a)"/>
<path class="ar" d="M240 184 L240 192" marker-end="url(#a)"/>
<text class="o" x="250" y="92">+4</text>
<text class="o" x="250" y="142">+4</text>
<text class="r" x="250" y="192">+40</text>

<rect class="b4" x="20" y="248" width="860" height="46" rx="8"/>
<text class="t" x="36" y="270">核心链路 MTU 需求的结论</text>
<text class="m" x="36" y="290">QinQ 场景 ≥ 1566 B　　单 Tag 场景 ≥ 1562 B　　城域 / DC 核心建议统一 1600 或 9000（jumbo）</text>

<rect class="b" x="20" y="304" width="420" height="106" rx="8"/>
<text class="t" x="36" y="328">三种现网做法</text>
<text class="s" x="36" y="350">① 核心统一 9000（最省心，存储复制必须）</text>
<text class="s" x="36" y="370">② 核心 1600（够 QinQ + SRv6，不浪费缓冲）</text>
<text class="s" x="36" y="390">③ 保持 1500（只适合单 Tag 且帧小的业务）</text>

<rect class="b3" x="460" y="304" width="420" height="106" rx="8"/>
<text class="t" x="476" y="328">割接前的验证手法</text>
<text class="m" x="476" y="350">ping &lt;对端 SID&gt; size &lt;最大帧长&gt; df-bit</text>
<text class="s" x="476" y="372">从 1500 往上二分，找到第一处不通的跳跃点</text>
<text class="r" x="476" y="394">注意：小包全通不代表链路 OK（案例 C）</text>
</svg>
