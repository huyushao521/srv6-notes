<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 434" width="900" height="434" role="img" aria-label="案例 A 的零丢包迁移三阶段：先只建控制面验证 Type 4 与 Type 1，再把新 PE 作为备份路径逐条分流，最后全量切换并保留回退窗口">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="434"/>
<text class="h" x="20" y="26">案例 A：零丢包割接的三阶段，每一步只改一件事</text>

<rect class="b1" x="20" y="44" width="270" height="196" rx="10"/>
<text class="t" x="36" y="68">阶段一：只建控制面</text>
<text class="s" x="36" y="92">① EVPN 邻居先只通告 Type 4 / 1</text>
<text class="s" x="36" y="112">② 建 EVI / BD，配 per-AC 的 uDX2</text>
<text class="s" x="36" y="132">③ 大帧探测 size 9000 通过</text>
<text class="s" x="36" y="156">验证点：</text>
<text class="m" x="36" y="176">show segment-routing srv6 sid all</text>
<text class="m" x="36" y="196">Type 1 是否带 SID</text>
<text class="g" x="36" y="222">此时业务仍走旧 VXLAN，零风险</text>

<rect class="b3" x="306" y="44" width="270" height="196" rx="10"/>
<text class="t" x="322" y="68">阶段二：分流</text>
<text class="s" x="322" y="92">④ 旧网关把新 PE 配成备份路径</text>
<text class="s" x="322" y="112">⑤ 先切一条非关键 E-Line</text>
<text class="s" x="322" y="132">⑥ 观察 Type 2 的 MAC 学习</text>
<text class="s" x="322" y="152">⑦ 逐条切换，每条观察 24 小时</text>
<text class="s" x="322" y="176">重点看：</text>
<text class="m" x="322" y="196">MAC 是否抖动</text>
<text class="m" x="322" y="216">是否出现双份广播</text>
<text class="o" x="322" y="238">两条路径并存期是最危险的窗口</text>

<rect class="b2" x="592" y="44" width="288" height="196" rx="10"/>
<text class="t" x="608" y="68">阶段三：收口</text>
<text class="s" x="608" y="92">⑧ 全量切换</text>
<text class="s" x="608" y="112">⑨ 关闭 VXLAN 网关，移除旧 VTEP</text>
<text class="s" x="608" y="132">⑩ 保留回退窗口一个月</text>
<text class="s" x="608" y="156">回退判据：</text>
<text class="m" x="608" y="176">同一业务 MAC 抖动</text>
<text class="m" x="608" y="196">大帧探测失败</text>
<text class="g" x="608" y="222">窗口内旧 VTEP 只配不转，随时可回</text>

<path class="ar" d="M292 142 L304 142" marker-end="url(#a)"/>
<path class="ar" d="M578 142 L590 142" marker-end="url(#a)"/>

<rect class="b4" x="20" y="256" width="860" height="80" rx="8"/>
<text class="t" x="36" y="280">三个坑（与原文一致）</text>
<text class="s" x="36" y="302">MAC 抖动 → Type 1 别名 + 分割 Horizon，或缩短老化　｜　广播风暴 → 查 DF 是否唯一</text>
<text class="s" x="36" y="324">大帧被丢 → 提升 Underlay MTU（案例 C）　｜　多归利用率不均 → 用 anycast SID 而不是单播 SID</text>

<rect class="b1" x="20" y="350" width="860" height="60" rx="8"/>
<text class="t" x="36" y="374">为什么这个顺序能保证零丢包</text>
<text class="s" x="36" y="396">每一步都只改一个变量：先让"新路径存在但不用"，再让"新路径可用但非首选"，最后"新路径成为首选"</text>
</svg>
