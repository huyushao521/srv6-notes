<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-label="案例 B 根因：两台 PE 的 ESI 末位一个字节不同，被识别为两个不同网段，各自独立选举 DF，结果两台都是 DF，广播帧被复制成两份">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="424"/>
<text class="h" x="20" y="26">案例 B 根因：ESI 末位差一个字节，两台 PE 各自选出了自己的 DF</text>

<rect class="b1" x="20" y="44" width="410" height="86" rx="10"/>
<text class="t" x="36" y="68">PE-1 配置的 ESI</text>
<text class="m" x="36" y="94">identifier type 0 00.11.02.03.04.05.06.07.08</text>
<text class="s" x="36" y="116">ES 0011.0203.0405.0607.0808</text>

<rect class="b4" x="470" y="44" width="410" height="86" rx="10"/>
<text class="t" x="486" y="68">PE-3 配置的 ESI</text>
<text class="m" x="486" y="94">identifier type 0 00.11.02.03.04.05.06.07.09</text>
<text class="r" x="486" y="116">ES 0011.0203.0405.0607.0809　↑ 末位不同</text>

<path class="ar" d="M225 130 L225 154" marker-end="url(#a)"/>
<path class="ar" d="M675 130 L675 154" marker-end="url(#a)"/>

<rect class="b3" x="20" y="156" width="410" height="76" rx="8"/>
<text class="t" x="36" y="180">Type 4 认为：这里是 ES-A</text>
<text class="s" x="36" y="202">只有 PE-1 参与 → 唯一候选 → PE-1 = DF</text>
<text class="m" x="36" y="222">DF Election：候选集 {PE-1}</text>

<rect class="b3" x="470" y="156" width="410" height="76" rx="8"/>
<text class="t" x="486" y="180">Type 4 认为：这里是 ES-B</text>
<text class="s" x="486" y="202">只有 PE-3 参与 → 唯一候选 → PE-3 = DF</text>
<text class="m" x="486" y="222">DF Election：候选集 {PE-3}</text>

<path class="ar" d="M225 232 L225 256" marker-end="url(#a)"/>
<path class="ar" d="M675 232 L675 256" marker-end="url(#a)"/>

<rect class="b4" x="20" y="258" width="860" height="66" rx="8"/>
<text class="t" x="36" y="282">于是两台 PE 都认为"自己负责泛洪"</text>
<text class="s" x="36" y="304">同一个广播帧在 CE-SW1 上收到两份 → 接入交换机 CPU 周期性飙到 90%（600 个小区同时放大）</text>

<rect class="b2" x="20" y="336" width="420" height="76" rx="8"/>
<text class="t" x="36" y="360">修复：统一 ESI（模板化下发）</text>
<text class="m" x="36" y="384">identifier type 0 00.11.02.03.04.05.06.07.08</text>
<text class="s" x="36" y="404">手工敲 8 字节十六进制必然出错，要由系统生成</text>

<rect class="b1" x="460" y="336" width="420" height="76" rx="8"/>
<text class="t" x="476" y="360">巡检项（上线必查）</text>
<text class="s" x="476" y="384">同一 EVI / VLAN 全网 DF 数量 = 1</text>
<text class="r" x="476" y="404">广播重复是配置错误，不是性能问题，别用限速掩盖</text>
</svg>
