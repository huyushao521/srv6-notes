<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="四类流量的规则矩阵：已知单播用 per-EVI SID、未知单播用 uDT2U、广播与组播用 uDT2M 且不能用 ECMP 必须靠 DF 去重">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<rect class="bg" width="900" height="400"/>
<text class="h" x="20" y="26">7.3.1 两条互不相干的规则：单播看 anycast，泛洪看 DF</text>

<text class="s" x="36" y="66">流量类型</text>
<text class="s" x="216" y="66">用哪个 SID</text>
<text class="s" x="470" y="66">能否 ECMP</text>
<text class="s" x="596" y="66">要 DF 吗</text>
<text class="s" x="700" y="66">去重靠什么</text>
<path class="ar" d="M20 76 L880 76" opacity="0.5"/>

<rect class="b1" x="20" y="88" width="860" height="56" rx="8"/>
<text class="t" x="36" y="112">已知单播</text>
<text class="s" x="36" y="132">MAC 命中</text>
<text class="m" x="216" y="120">远端 PE 的 per-EVI SID</text>
<text class="s" x="470" y="120">看该 SID 是否 anycast</text>
<text class="s" x="596" y="120">否</text>
<text class="s" x="700" y="120">单份报文，本身不重复</text>

<rect class="b" x="20" y="152" width="860" height="56" rx="8"/>
<text class="t" x="36" y="176">未知单播</text>
<text class="s" x="36" y="196">MAC 未命中</text>
<text class="m" x="216" y="184">uDT2U</text>
<text class="s" x="470" y="184">可以</text>
<text class="s" x="596" y="184">否（但要泛洪）</text>
<text class="s" x="700" y="184">靠 MAC 尽快学会收敛</text>

<rect class="b4" x="20" y="216" width="860" height="56" rx="8"/>
<text class="t" x="36" y="240">广播</text>
<text class="s" x="36" y="260">FF:FF:FF:FF:FF:FF</text>
<text class="m" x="216" y="248">uDT2M（Arg = BD）</text>
<text class="r" x="470" y="248">不可以</text>
<text class="r" x="596" y="248">必须</text>
<text class="r" x="700" y="248">DF 选举</text>

<rect class="b4" x="20" y="280" width="860" height="56" rx="8"/>
<text class="t" x="36" y="304">组播</text>
<text class="s" x="36" y="324">01:00:5E:xx 等</text>
<text class="m" x="216" y="312">uDT2M（Arg = BD）</text>
<text class="r" x="470" y="312">不可以</text>
<text class="r" x="596" y="312">必须</text>
<text class="r" x="700" y="312">DF 选举</text>

<rect class="b1" x="20" y="348" width="860" height="44" rx="8"/>
<text class="s" x="36" y="368">记忆法：能"命中表项"的可以 ECMP；凡是"要复制给多人"的，必须先保证只有一个人复制 ——</text>
<text class="s" x="36" y="386">这就是为什么同一台 PE 上要同时有 uDT2U（单播泛洪）与 uDT2M（复制），两者不能互换</text>
</svg>
