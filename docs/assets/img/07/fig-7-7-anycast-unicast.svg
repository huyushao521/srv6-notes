<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="anycast SID 的单播效果：PE-1 与 PE-3 同时通告同一 SID，IGP 形成两条等价路径，逐流哈希分担且无需 EVPN 信令">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
.f1{stroke:#0b6bcb;stroke-width:2;fill:none}.f2{stroke:#2f855a;stroke-width:2;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}.f1{stroke:#58a6ff}.f2{stroke:#68d391}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="m1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#0b6bcb"/></marker>
<marker id="m2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#2f855a"/></marker></defs>
<rect class="bg" width="900" height="420"/>
<text class="h" x="20" y="26">7.3 单播：一个 anycast SID 让 IGP 自己做等价分担</text>

<rect class="b1" x="24" y="150" width="128" height="56" rx="8"/>
<text class="t" x="52" y="176">PE-2</text>
<text class="s" x="42" y="196">DC-2 出口</text>

<rect class="b" x="216" y="96" width="120" height="42" rx="8"/>
<text class="t" x="252" y="122">P-1</text>
<rect class="b" x="216" y="218" width="120" height="42" rx="8"/>
<text class="t" x="252" y="244">P-2</text>

<rect class="b2" x="404" y="60" width="150" height="56" rx="8"/>
<text class="t" x="424" y="86">PE-1</text>
<text class="s" x="424" y="106">通告 anycast SID</text>
<rect class="b2" x="404" y="250" width="150" height="56" rx="8"/>
<text class="t" x="424" y="276">PE-3</text>
<text class="s" x="424" y="296">通告同一 anycast SID</text>

<rect class="b3" x="620" y="130" width="150" height="50" rx="8"/>
<text class="t" x="656" y="152">CE-SW1</text>
<text class="s" x="634" y="170">同一 ES，两条 AC</text>
<rect class="b4" x="620" y="196" width="150" height="50" rx="8"/>
<text class="t" x="652" y="218">同一 ES</text>
<text class="s" x="630" y="236">两条 AC 都可达</text>

<path class="f1" d="M152 168 L212 124" marker-end="url(#m1)"/>
<path class="f1" d="M336 118 L400 96" marker-end="url(#m1)"/>
<path class="f1" d="M554 96 L616 140" marker-end="url(#m1)"/>
<text class="m" x="120" y="140">DA=anycast</text>

<path class="f2" d="M152 190 L212 230" marker-end="url(#m2)"/>
<path class="f2" d="M336 238 L400 268" marker-end="url(#m2)"/>
<path class="f2" d="M554 278 L616 228" marker-end="url(#m2)"/>
<text class="m" x="120" y="222">另一条流</text>

<text class="s" x="196" y="330">两条路径在 IGP 里完全等价（metric 相同），转发面按五元组哈希选一条</text>
<text class="g" x="196" y="352">结果：逐流分担，且没有任何 EVPN 逐流信令</text>

<rect class="b1" x="20" y="366" width="860" height="42" rx="8"/>
<text class="m" x="36" y="392">判据：show route fdbb:bb00:0100:e100::/128 detail → 应看到 PE-1、PE-3 两个 next-hop，且都可用</text>
</svg>
