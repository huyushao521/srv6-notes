<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" role="img" aria-label="Type 2 路由的 SRv6 编码：MP_REACH_NLRI 内 Label 置零，Next-Hop 为 IPv6，Prefix-SID 属性里的 SRv6 L2 Service TLV 携带 SID、行为与 SID Structure">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="456"/>
<text class="h" x="20" y="26">7.2 Type 2 的 SRv6 编码：标签位留着但置 0，SID 换到属性里</text>

<rect class="b1" x="20" y="40" width="500" height="40" rx="8"/>
<text class="m" x="36" y="66">MP_REACH_NLRI（AFI=25 / SAFI=70，EVPN）</text>

<rect class="b" x="20" y="88" width="500" height="150" rx="8"/>
<text class="t" x="36" y="110">NLRI 本体（Type 2）</text>
<text class="m" x="36" y="132">RD ／ ESI ／ Ethernet Tag</text>
<text class="m" x="36" y="154">MAC Address Length + MAC</text>
<text class="m" x="36" y="176">IP Address Length + IP（可选）</text>
<text class="m" x="36" y="198">Label（20 bit）＝ 0 ← 保留但不再携带业务</text>
<text class="r" x="36" y="222">老实现若仍按标签解析，会认为"标签无效"而丢弃路由</text>

<rect class="b" x="20" y="246" width="500" height="40" rx="8"/>
<text class="m" x="36" y="272">Next-Hop Length + IPv6 Next-Hop（RFC 8950）</text>

<rect class="b1" x="20" y="294" width="500" height="40" rx="8"/>
<text class="m" x="36" y="320">Path Attributes → Prefix-SID Attribute（可选传递）</text>

<path class="ar" d="M520 314 L560 314" marker-end="url(#a)"/>

<rect class="b2" x="562" y="126" width="318" height="212" rx="10"/>
<text class="t" x="578" y="150">SRv6 L2 Service TLV（type 6）</text>
<rect class="b" x="578" y="160" width="286" height="52" rx="6"/>
<text class="s" x="590" y="180">Sub-TLV：SID Information</text>
<text class="m" x="590" y="200">fdbb:bb00:0002:e100::</text>
<rect class="b" x="578" y="220" width="286" height="34" rx="6"/>
<text class="m" x="590" y="242">Behavior = End.DT2U / End.DX2</text>
<rect class="b" x="578" y="262" width="286" height="34" rx="6"/>
<text class="m" x="590" y="284">SID Structure：L=48 F=16 A=0</text>
<text class="s" x="578" y="318">一个 TLV 同时说清三件事：用哪个 SID、</text>
<text class="s" x="578" y="334">进来做什么动作、地址里哪几位是 locator</text>

<rect class="b3" x="20" y="346" width="860" height="46" rx="8"/>
<text class="t" x="36" y="368">和三层唯一的差别：TLV 类型不同（L3 Service TLV vs L2 Service TLV）</text>
<text class="s" x="36" y="386">所以同一台 PE 可以同时跑三层与二层业务，用同一套 locator、同一套 BGP 邻居</text>

<rect class="b4" x="20" y="398" width="860" height="46" rx="8"/>
<text class="t" x="36" y="420">常见误会：Label=0 不等于"没配业务"</text>
<text class="s" x="36" y="438">判据是 SID 有没有出现，不是标签是不是 0（show evpn evi 100 detail 看 Remote Peers 下的 SID/Behavior）</text>
</svg>
