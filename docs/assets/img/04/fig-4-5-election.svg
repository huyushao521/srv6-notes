<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" width="900" height="448" role="img" aria-label="Flex-Algo 定义选举流程：先取 Priority 最大，并列再看 System-ID，最后判断本机是否支持该定义">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b{fill:#1b2029;stroke:#39414f}.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}
.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="448"/>
<text class="h" x="24" y="26">定义的选择流程：域内所有节点必须选出同一份（RFC 9350 §5.3）</text>

<rect class="b" x="140" y="44" width="400" height="44" rx="8"/>
<text class="s" x="156" y="71">收集本区内该算法的全部定义通告（含本地生成）</text>
<path class="ar" d="M340 88 L340 106" marker-end="url(#a)"/>

<rect class="b1" x="140" y="108" width="400" height="44" rx="8"/>
<text class="t" x="156" y="135">取 Priority 最大的一组</text>
<path class="ar" d="M340 152 L340 170" marker-end="url(#a)"/>

<rect class="b1" x="140" y="172" width="400" height="44" rx="8"/>
<text class="t" x="156" y="199">仍有并列？→ System-ID / Router-ID 最大者</text>
<path class="ar" d="M340 216 L340 234" marker-end="url(#a)"/>

<rect class="b3" x="140" y="236" width="400" height="44" rx="8"/>
<text class="t" x="156" y="263">本机支持该定义？（计算类型 / 度量 / 约束）</text>
<path class="ar" d="M340 280 L340 298" marker-end="url(#a)"/>

<rect class="b2" x="140" y="300" width="400" height="56" rx="8"/>
<text class="t" x="156" y="324">参与：SR-Algorithm 带上算法号</text>
<text class="s" x="156" y="344">算该算法的 SPF 树 · 收发该算法的前缀段与邻接段</text>

<path class="ar" d="M548 130 L620 130" marker-end="url(#a)"/>
<text class="r" x="632" y="126">通告集合为空</text>
<text class="r" x="632" y="144">→ 撤回参与，算法失效</text>

<path class="ar" d="M548 258 L620 258" marker-end="url(#a)"/>
<text class="r" x="632" y="254">任一项不支持</text>
<text class="r" x="632" y="272">→ 撤回算法号</text>

<rect class="b" x="24" y="376" width="852" height="56" rx="8"/>
<text class="s" x="40" y="400">工程要点：每个区域至少两台通告（一台重启算法就整体失效）；Priority 显式指定权威，内容靠模板统一</text>
<text class="s" x="40" y="422">排障顺序：先看参与者名单（show isis database verbose 里的 SR Algorithm），再看定义内容</text>
</svg>
