<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img" aria-label="参与与 locator 通告的四种组合：只有同时参与并通告 locator 才可用">
<style>
.bg{fill:#fff}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.g{fill:#2f855a;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b2{fill:#14291d;stroke:#68d391}.b3{fill:#2a2113;stroke:#ecc94b}
.b{fill:#1b2029;stroke:#39414f}.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.g{fill:#68d391}.o{fill:#ecc94b}.r{fill:#f87171}}
</style>
<rect class="bg" width="900" height="372"/>
<text class="h" x="24" y="26">参与 × locator：只有“既参与又通告”才有意义</text>

<rect class="b2" x="24" y="44" width="414" height="118" rx="8"/>
<text class="t" x="40" y="70">参与 ✅　通告该算法 locator ✅</text>
<text class="g" x="40" y="96">正常（本书假设的配置）</text>
<text class="s" x="40" y="120">可当中转、可作终点、可被 TI-LFA 修复</text>
<text class="s" x="40" y="142">uN + 每条“连到参与者”的接口上的 uA</text>

<rect class="b3" x="462" y="44" width="414" height="118" rx="8"/>
<text class="t" x="478" y="70">参与 ✅　通告该算法 locator ❌</text>
<text class="o" x="478" y="96">无意义：算法里的“死胡同”</text>
<text class="s" x="478" y="120">不能当该算法任何 SR 路径的中转或终点</text>
<text class="s" x="478" y="142">TE 路径、TI-LFA 备份路径都用不上它</text>

<rect class="b3" x="24" y="178" width="414" height="118" rx="8"/>
<text class="t" x="40" y="204">参与 ❌　通告该算法 locator ✅</text>
<text class="r" x="40" y="230">不可达：泛洪了也没人能算出路径</text>
<text class="s" x="40" y="254">不参与 = 被排除在该算法拓扑之外</text>
<text class="s" x="40" y="276">域内任何节点都不会为它装转发表项</text>

<rect class="b" x="462" y="178" width="414" height="118" rx="8"/>
<text class="t" x="478" y="204">参与 ❌　通告该算法 locator ❌</text>
<text class="s" x="478" y="230">完全没有该算法</text>
<text class="s" x="478" y="254">只能走 Algo(0)，与 Flex-Algo 无关</text>
<text class="s" x="478" y="276">常见于只做 Algo(0) 的边缘设备</text>

<rect class="b" x="24" y="312" width="852" height="48" rx="8"/>
<text class="s" x="40" y="336">一条因果链：算法绑 locator → 拓扑按参与者剪枝 → 只有 Topo(K) 里可达的 locator 才装表</text>
<text class="s" x="40" y="354">所以“locator 配了但不通”九成是参与没配，而不是路由策略问题</text>
</svg>
