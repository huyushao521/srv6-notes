<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" width="900" height="506" role="img" aria-label="节点 5 到节点 2 的主备路径：Algo(0) 主走 R3 备份为 LFA 经 R4，Flex-Algo(129) 主走 R4 备份为 TI-LFA 经 R6 并用 alg 129 的 P/Q 段">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b{fill:#1b2029;stroke:#39414f}.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.o{fill:#ecc94b}}
</style>
<rect class="bg" width="900" height="506"/>
<text class="h" x="24" y="26">同一个目的地、两条算法、两条主路径、两条备份路径</text>

<rect class="b1" x="24" y="44" width="852" height="152" rx="8"/>
<text class="t" x="40" y="70">① 到 Algo(0) locator　fc00:0:2::/48</text>
<text class="m" x="40" y="100">主：5 ──10── 3 ──10── 2　　　　　　代价 20</text>
<text class="m" x="40" y="126">备：5 ──10── 4 ──20── 2　　　　　　代价 30</text>
<text class="s" x="40" y="152">备份类型 LFA：邻居 R4 自己就有到 2 的最短路，不需要补段列表，首跳 R4</text>
<text class="s" x="40" y="176">show isis ipv6 fast-reroute fc00:0:2::/48</text>

<rect class="b2" x="24" y="212" width="852" height="192" rx="8"/>
<text class="t" x="40" y="238">② 到 Flex-Algo(129) locator　fc00:2:2::/48（定义排除 RED 链路 5-3）</text>
<text class="m" x="40" y="268">主：5 ──10── 4 ──20── 2　　　　　　代价 30（主路径就必须绕开 RED）</text>
<text class="m" x="40" y="294">备：5 ──10── 6 ──10── 1 ──40── 2　　代价 120，TI-LFA (link)，首跳 R6</text>
<text class="s" x="40" y="320">修复列表里的段必须全是 alg 129 的（换算法即换语义，换语义即走错树）：</text>
<text class="m" x="40" y="346">P 节点 R1：fc00:2:1:: uN      Q 节点 R1→R2：fc00:2:1:e000:: uA</text>
<text class="o" x="40" y="372">show isis ipv6 fast-reroute flex-algo 129 fc00:2:2::/48　（不加 flex-algo 查的是 Algo(0)）</text>

<rect class="b3" x="24" y="420" width="852" height="72" rx="8"/>
<text class="t" x="40" y="444">最反直觉的一点</text>
<text class="s" x="40" y="468">129 的主路径（经 R4）正好是 Algo(0) 的备份路径；两条算法各算各的，互不复用 —— 因为约束不同</text>
<text class="s" x="40" y="486">备份路径也要最小化本算法的度量、满足全部约束、排除非参与节点，否则故障后体验断崖</text>
</svg>
