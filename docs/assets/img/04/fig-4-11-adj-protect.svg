<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-label="受保护的 Flex-Algo 邻接段：每个接口的邻接段都有一个带 P 标记的对偶，供 TI-LFA 修复使用">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b{fill:#1b2029;stroke:#39414f}.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.o{fill:#ecc94b}.g{fill:#68d391}}
</style>
<rect class="bg" width="900" height="424"/>
<text class="h" x="24" y="26">邻接段成对出现：带 P 的那个是给 TI-LFA 用的</text>

<rect class="b1" x="24" y="44" width="852" height="62" rx="8"/>
<text class="m" x="40" y="70">fc00:0:5:e000::   uA   [Gi0/0/0/1, Link-Local]:0:P</text>
<text class="m" x="40" y="94">fc00:0:5:e001::   uA   [Gi0/0/0/1, Link-Local]:0</text>

<rect class="b1" x="24" y="114" width="852" height="62" rx="8"/>
<text class="m" x="40" y="140">fc00:0:5:e002::   uA   [Gi0/0/0/2, Link-Local]:0:P</text>
<text class="m" x="40" y="164">fc00:0:5:e003::   uA   [Gi0/0/0/2, Link-Local]:0</text>

<rect class="b1" x="24" y="184" width="852" height="62" rx="8"/>
<text class="m" x="40" y="210">fc00:0:5:e004::   uA   [Gi0/0/0/0, Link-Local]:0:P</text>
<text class="m" x="40" y="234">fc00:0:5:e005::   uA   [Gi0/0/0/0, Link-Local]:0</text>

<rect class="b3" x="24" y="262" width="420" height="146" rx="8"/>
<text class="t" x="40" y="286">带 P 的那份给谁用</text>
<text class="s" x="40" y="310">PLR 计算修复路径时，用一个“受保护”的</text>
<text class="s" x="40" y="330">邻接段把报文钉到备份邻居上</text>
<text class="s" x="40" y="354">P = protected：该段自身也有备份，</text>
<text class="s" x="40" y="374">避免“主备共用同一个出口”导致二次故障</text>
<text class="o" x="40" y="398">关掉某算法的 TI-LFA → 该算法的 P 段消失</text>

<rect class="b" x="456" y="262" width="420" height="146" rx="8"/>
<text class="t" x="472" y="286">为什么必须“每算法一个 uA”</text>
<text class="s" x="472" y="310">同一物理接口在 alg 0 / 128 / 129 下</text>
<text class="s" x="472" y="330">各得一个邻接段，各自带 Alg 字段</text>
<text class="s" x="472" y="354">修复列表引用错算法的那一个，</text>
<text class="s" x="472" y="374">报文就会走上另一棵树</text>
<text class="g" x="472" y="398">这是 SR-MPLS 的标签块做不到的</text>
</svg>
