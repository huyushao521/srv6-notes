<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Global 段与 Local 段的配合">
<style>
.bg{fill:#fff}.b{fill:#f7f9fc;stroke:#cbd3de}.bk{fill:#eaf3ff;stroke:#0b6bcb;stroke-width:1.6}
.g{fill:#f2f4f7;stroke:#cbd3de;stroke-dasharray:4 3}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 13.5px Consolas,monospace}.mk{fill:#0b6bcb;font:600 13.5px Consolas,monospace}
.o{fill:#0b6bcb;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.l{stroke:#9aa4b2;stroke-width:1.5;fill:none}.lk{stroke:#0b6bcb;stroke-width:2;fill:none}.d{stroke:#9aa4b2;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b{fill:#1b2029;stroke:#39414f}.bk{fill:#16283d;stroke:#58a6ff}.g{fill:#171c24;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.mk,.o{fill:#58a6ff}.l{stroke:#5a6472}.lk{stroke:#58a6ff}.d{stroke:#5a6472}}
</style>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#0b6bcb"/></marker>
</defs>
<rect class="bg" width="900" height="400"/>
<text class="s" x="40" y="30">SID list（按遍历顺序）</text>
<rect class="bk" x="40" y="40" width="310" height="54" rx="4"/>
<text class="mk" x="58" y="64">fc00:0:1::</text><text class="s" x="58" y="84">全局段 · uN（Prefix-SID）</text>
<rect class="b" x="358" y="40" width="310" height="54" rx="4"/>
<text class="m" x="376" y="64">fc00:0:1:e001::</text><text class="s" x="376" y="84">本地段 · uA（End.X）</text>
<text class="s" x="686" y="64">先送到"能执行指令的人"</text>
<text class="s" x="686" y="84">再从"那个人指定的接口"出去</text>

<rect class="b" x="60" y="170" width="120" height="56" rx="6"/>
<text class="t" x="120" y="203" text-anchor="middle">源</text>
<rect class="bk" x="400" y="120" width="120" height="56" rx="6"/>
<text class="t" x="460" y="145" text-anchor="middle">节点 1</text><text class="s" x="460" y="164" text-anchor="middle">End + End.X</text>
<rect class="b" x="720" y="170" width="120" height="56" rx="6"/>
<text class="t" x="780" y="203" text-anchor="middle">节点 2</text>
<rect class="g" x="400" y="286" width="120" height="48" rx="6"/>
<text class="t" x="460" y="316" text-anchor="middle">节点 3</text>

<path class="lk" d="M180 188 L394 152" marker-end="url(#ab)"/>
<circle cx="250" cy="163" r="12" fill="#0b6bcb"/><text x="250" y="168" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1</text>
<path class="lk" d="M520 164 L716 188" marker-end="url(#ab)"/>
<circle cx="620" cy="168" r="12" fill="#0b6bcb"/><text x="620" y="173" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">2</text>
<path class="d" d="M150 226 L396 300" marker-end="url(#a)"/>
<path class="d" d="M520 310 L714 222" marker-end="url(#a)"/>
<circle cx="300" cy="274" r="12" fill="#9aa4b2"/><text x="300" y="279" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3</text>

<text class="s" x="40" y="292">若 SID list 里只写"去节点 2"</text>
<text class="s" x="40" y="312">报文可能走 源 → 3 → 2 的等价路径</text>
<text class="s" x="640" y="370">只有节点 1 才把报文从它自己的 Eth2 送出去</text>
<text class="s" x="40" y="370">① 全局段：域内所有节点都懂；② 本地段：只有产生者懂其本地语义</text>
</svg>
