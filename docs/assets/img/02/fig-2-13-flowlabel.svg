<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 344" width="900" height="344" role="img" aria-label="Flow Label 作为预计算熵，核心不做深度检测">
<style>
.bg{fill:#fff}.b{fill:#f7f9fc;stroke:#cbd3de}.k{fill:#eaf3ff;stroke:#0b6bcb;stroke-width:1.6}
.t{fill:#1f2328;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.mk{fill:#0b6bcb;font:600 12px Consolas,monospace}.o{fill:#0b6bcb;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.l{stroke:#9aa4b2;stroke-width:1.5;fill:none}.lk{stroke:#0b6bcb;stroke-width:2;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b{fill:#1b2029;stroke:#39414f}.k{fill:#16283d;stroke:#58a6ff}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.mk,.o{fill:#58a6ff}.l{stroke:#5a6472}.lk{stroke:#58a6ff}}
</style>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#0b6bcb"/></marker>
</defs>
<rect class="bg" width="900" height="344"/>
<text class="s" x="30" y="34">入口 PE：算一次</text>
<rect class="b" x="30" y="46" width="190" height="86" rx="4"/>
<text class="t" x="44" y="70">客户报文 5 元组</text>
<text class="s" x="44" y="92">源 IP · 目的 IP</text>
<text class="s" x="44" y="110">协议号 · 源端口 · 目的端口</text>
<text class="s" x="44" y="128">（移动网再加 GTP-U TEID）</text>

<path class="l" d="M224 89 L282 89" marker-end="url(#a)"/>
<rect class="b" x="288" y="60" width="120" height="58" rx="4"/>
<text class="m" x="348" y="88" text-anchor="middle">hash()</text>
<text class="s" x="348" y="106" text-anchor="middle">对 ASIC 友好</text>
<path class="l" d="M412 89 L466 89" marker-end="url(#a)"/>
<rect class="k" x="472" y="60" width="176" height="58" rx="4"/>
<text class="mk" x="560" y="86" text-anchor="middle">Flow Label = 0x3a7f1</text>
<text class="s" x="560" y="106" text-anchor="middle">同一条流恒为同一值</text>

<rect class="k" x="30" y="168" width="618" height="112" rx="6"/>
<text class="t" x="48" y="194">核心 Transit：每跳只读浅层的三元组，不做 DPI</text>
<text class="m" x="48" y="222">hash(SA, DA, FlowLabel, router-id, in-if) → 选链路</text>
<text class="s" x="48" y="246">加 router-id / 入接口是为了防极化：不同节点对同一 FL 选不同链路</text>
<text class="s" x="48" y="268">DA 常是同一个 SID，SA 也可能相同，真正带熵的只有 Flow Label</text>

<path class="lk" d="M648 200 L690 200" marker-end="url(#ab)"/>
<rect class="b" x="696" y="160" width="174" height="44" rx="4"/>
<text class="t" x="783" y="187" text-anchor="middle">链路 A</text>
<rect class="k" x="696" y="212" width="174" height="44" rx="4"/>
<text class="mk" x="783" y="239" text-anchor="middle">链路 B ← 选中</text>

<text class="s" x="30" y="306">全程无需解封装、无需解析内层任何字段：可线速转发，这是 SRv6 相比 MPLS 熵标签的主要简化</text>
<text class="s" x="30" y="330">Flow Label 位于 IPv6 基本头的固定偏移（第 1 个 32 位字），硬件取值不需要走指针链</text>
</svg>
