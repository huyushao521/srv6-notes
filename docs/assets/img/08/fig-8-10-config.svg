<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-label="双侧配置：发起侧汇聚 PE 在 IS-IS 地址族下开启 upa 并设阈值，汇总侧 ABR 也要开启 upa 并具备 BGP additional-paths 安装能力，能力必须双向协商，只配一侧等于没配">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="436"/>
<text class="h" x="20" y="26">8.5 配置：能力是双向的，只配一侧等于没配</text>

<rect class="b2" x="20" y="44" width="410" height="212" rx="10"/>
<text class="t" x="36" y="68">① 发起侧：地市汇聚 PE3（说的一方）</text>
<rect class="b1" x="36" y="80" width="378" height="128" rx="6"/>
<text class="m" x="48" y="102">router isis 1</text>
<text class="m" x="48" y="122"> address-family ipv6 unicast</text>
<text class="m" x="48" y="142">　metric-style wide</text>
<text class="m" x="48" y="162">　upa</text>
<text class="m" x="48" y="182">　　enable</text>
<text class="m" x="48" y="200">　　max-prefix-per-update 50</text>
<text class="s" x="36" y="228">关键：只有它知道「分量没了」这件事</text>
<text class="g" x="36" y="248">它必须能发，否则后面所有环节都没戏</text>

<rect class="b3" x="470" y="44" width="410" height="212" rx="10"/>
<text class="t" x="486" y="68">② 汇总侧：核心 ABR（听的一方）</text>
<rect class="b1" x="486" y="80" width="378" height="110" rx="6"/>
<text class="m" x="498" y="102">router isis 1</text>
<text class="m" x="498" y="122"> address-family ipv6 unicast</text>
<text class="m" x="498" y="142">　upa</text>
<text class="s" x="498" y="166">router bgp 65000 / address-family ipv4</text>
<text class="m" x="498" y="184">　additional-paths receive + install</text>
<text class="s" x="486" y="214">关键：不配 upa 会把 UPA 当普通前缀忽略</text>
<text class="r" x="486" y="234">没有备份路径时，PIC 也无从切起</text>

<path class="ar" d="M250 262 L250 288 M640 262 L640 288" marker-end="url(#a)"/>
<text class="s" x="262" y="282">能力协商（Router Capability 双向）</text>

<rect class="b1" x="20" y="292" width="410" height="60" rx="8"/>
<text class="t" x="36" y="316">UPA 通告方向</text>
<text class="m" x="36" y="338">PE3 ──unreachable──► ABR　　单向，但能力要双向</text>

<rect class="b4" x="470" y="292" width="410" height="60" rx="8"/>
<text class="t" x="486" y="316">只配一侧的典型后果</text>
<text class="r" x="486" y="338">通告确实发了，ABR 不认，FIB 不动，仍是 60 多秒</text>

<rect class="b" x="20" y="362" width="860" height="66" rx="8"/>
<text class="t" x="36" y="386">检查清单（案例 C 的教训）</text>
<text class="s" x="36" y="408">发起侧 + 汇总侧 + 中间所有 ABR，三处都要配；漏掉任何一台 ABR，那段路径就退回无 UPA 的行为</text>
</svg>
