<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" role="img" aria-label="小结对照：无 UPA 时故障仅数据面可见、恢复要七十秒级、没有任何告警；有 UPA 时 IGP 显式可见、恢复不到五十毫秒、可被监控，而规模收益依旧保留">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<rect class="bg" width="900" height="428"/>
<text class="h" x="20" y="26">8.7 小结：同一个网络，加一条通告前后的六个维度</text>

<text class="s" x="36" y="58">维度</text>
<text class="s" x="330" y="58">无 UPA</text>
<text class="s" x="650" y="58">有 UPA</text>
<path class="ar" d="M20 68 L880 68" opacity="0.5"/>

<rect class="b4" x="20" y="76" width="860" height="46" rx="6"/>
<text class="t" x="36" y="104">故障可见性</text>
<text class="r" x="330" y="104">仅数据面丢包</text>
<text class="g" x="650" y="104">IGP 里显式可见</text>

<rect class="b4" x="20" y="130" width="860" height="46" rx="6"/>
<text class="t" x="36" y="158">恢复时间</text>
<text class="r" x="330" y="158">70 秒级（等 IGP/BGP）</text>
<text class="g" x="650" y="158">&lt; 50 ms</text>

<rect class="b4" x="20" y="184" width="860" height="46" rx="6"/>
<text class="t" x="36" y="212">告警</text>
<text class="r" x="330" y="212">没有，只能靠业务投诉</text>
<text class="g" x="650" y="212">有，通告本身可被监控</text>

<rect class="b2" x="20" y="238" width="860" height="46" rx="6"/>
<text class="t" x="36" y="266">规模收益</text>
<text class="g" x="330" y="266">保留</text>
<text class="g" x="650" y="266">同样保留（核心仍只装汇总）</text>

<rect class="b3" x="20" y="292" width="860" height="46" rx="6"/>
<text class="t" x="36" y="320">配置复杂度</text>
<text class="g" x="330" y="320">低</text>
<text class="o" x="650" y="320">中：两侧都要配 + 阈值</text>

<rect class="b3" x="20" y="346" width="860" height="46" rx="6"/>
<text class="t" x="36" y="374">适用网络</text>
<text class="s" x="330" y="374">不汇总的小网</text>
<text class="g" x="650" y="374">任何激进汇总的大网</text>

<rect class="b2" x="20" y="398" width="860" height="28" rx="6"/>
<text class="s" x="36" y="417">一句话：汇总不是错，PIC 也不是错，错在两者之间没有信使 —— UPA 就是那个信使</text>
</svg>
