<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="案例 A：地市双 PE 双归核心，PE3 主用、核心只收 10.1.0.0/16 汇总；明细不可达时核心 BGP 无变化，报文进 Null0 约七十秒后才因 IGP 重收敛恢复，启用 UPA 后切换降到亚秒级">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="440"/>
<text class="h" x="20" y="26">案例 A：一分钟的静默丢包，从 70 秒到亚秒</text>

<rect class="b1" x="20" y="42" width="200" height="60" rx="8"/>
<text class="t" x="36" y="66">核心 ABR</text>
<text class="m" x="36" y="88">只收 10.1.0.0/16</text>
<rect class="b3" x="300" y="42" width="200" height="60" rx="8"/>
<text class="t" x="316" y="66">PE3（主用）</text>
<text class="m" x="316" y="88">汇总 → Null0</text>
<rect class="b2" x="580" y="42" width="200" height="60" rx="8"/>
<text class="t" x="596" y="66">PE4（备用）</text>
<text class="m" x="596" y="88">明细仍可达</text>
<path class="ar" d="M220 72 L298 72" marker-end="url(#a)"/>
<path class="ar" d="M500 72 L578 72" marker-end="url(#a)"/>
<text class="s" x="336" y="118">明细不进核心：核心只有一条汇总，因此看不出分量死活</text>

<rect class="b4" x="20" y="130" width="860" height="86" rx="8"/>
<text class="t" x="36" y="154">故障期（无 UPA）：约 70 秒</text>
<path class="ar" d="M60 190 L860 190" marker-end="url(#a)"/>
<rect x="70" y="182" width="760" height="16" fill="#c0392b" opacity="0.25"/>
<text class="m" x="60" y="176">t=0</text>
<text class="m" x="820" y="176">t≈70 s</text>
<text class="r" x="330" y="212">报文持续进 Null0，监控无告警，业务侧只看到卡顿</text>

<rect class="b2" x="20" y="228" width="860" height="86" rx="8"/>
<text class="t" x="36" y="252">启用 UPA 后：亚秒级</text>
<path class="ar" d="M60 288 L860 288" marker-end="url(#a)"/>
<rect x="70" y="280" width="24" height="16" fill="#2f855a" opacity="0.5"/>
<text class="m" x="60" y="274">t=0</text>
<text class="m" x="100" y="274">&lt; 1 s</text>
<text class="g" x="200" y="310">ping 1000 包 0 丢：切换发生在首个报文被丢之前或紧随其后</text>

<rect class="b" x="20" y="326" width="860" height="60" rx="8"/>
<text class="t" x="36" y="350">复盘的五个动作</text>
<text class="s" x="36" y="372">① 定位拓扑与汇总边界 → ② 确认明细失效但汇总未变 → ③ 承认这是组合缺陷而非单点故障</text>
<text class="s" x="36" y="392">④ PE3/PE4 与 ABR 启用 UPA → ⑤ 用 ping 大包长跑复测切换时间</text>
<rect class="b2" x="20" y="400" width="860" height="30" rx="6"/>
<text class="s" x="36" y="420">上线检查：IGP 支持 UPA、只对汇总分量发、ABR 侧 additional-paths install 生效、汇总边界内保留明细状态</text>
</svg>
