<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" width="900" height="446" role="img" aria-label="UPA 拓扑：核心 ABR 使用 BGP PIC edge，只收到地市发来的 10.1.0.0/16 汇总；地市 PE3 把汇总指向 Null0，其下 10.1.1.0/24 明细已失效，因此核心的 BGP 表没有任何变化">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5" fill="#c0392b"/></marker></defs>
<rect class="bg" width="900" height="446"/>
<text class="h" x="20" y="26">8.0 三个角色的位置：藏信息的、要信息的、传信息的</text>

<rect class="b1" x="230" y="42" width="440" height="86" rx="10"/>
<text class="t" x="248" y="66">核心 ABR / PE-1　（BGP PIC edge，要信息的一方）</text>
<text class="m" x="248" y="88">BGP：10.1.0.0/16 → PE3（主）</text>
<text class="m" x="248" y="108">　　　　　　　　　→ PE4（备，预装）</text>
<text class="s" x="248" y="122">只收到一条汇总，看不到汇总里的任何分量</text>

<path class="ar" d="M330 128 L330 176" marker-end="url(#a)"/>
<path class="ar" d="M570 128 L570 176" marker-end="url(#a)"/>
<text class="o" x="336" y="152">主路径（实际转发）</text>
<text class="g" x="576" y="152">备份（PIC 预装，不放流量）</text>

<rect class="b3" x="150" y="178" width="330" height="92" rx="10"/>
<text class="t" x="166" y="202">地市汇聚 PE3（汇总发起者，藏信息的一方）</text>
<text class="m" x="166" y="224">BGP：10.1.0.0/16 → Null0</text>
<text class="m" x="166" y="244">明细：10.1.1.0/24 → 已不可达</text>
<text class="o" x="166" y="262">汇总照旧，BGP 没有理由发 update</text>

<rect class="b2" x="560" y="178" width="320" height="92" rx="10"/>
<text class="t" x="576" y="202">地市汇聚 PE4（备份）</text>
<text class="m" x="576" y="224">同一段 10.1.0.0/16 的另一出口</text>
<text class="m" x="576" y="244">明细仍可达</text>
<text class="g" x="576" y="262">只要流量切过来就能通</text>

<path class="ar" d="M315 270 L315 306" marker-end="url(#ar)"/>
<text class="r" x="325" y="292">报文进 Null0</text>

<rect class="b4" x="150" y="308" width="330" height="52" rx="8"/>
<text class="m" x="166" y="330">10.1.1.0/24 的接入侧</text>
<text class="r" x="166" y="350">下一跳消失，业务中断 ✘</text>

<rect class="b1" x="20" y="382" width="860" height="50" rx="8"/>
<text class="t" x="36" y="404">黑缝在哪</text>
<text class="s" x="36" y="424">PE3 上丢的是"分量"，核心信的是"汇总" —— 中间没有任何机制负责把前者翻译成后者，于是 PIC 一直不知道要切</text>
</svg>
