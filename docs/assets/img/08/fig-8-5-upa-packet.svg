<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 414" width="900" height="414" role="img" aria-label="UPA 是 IGP 的一个扩展通告，五个字段分别是失效的具体前缀、UPA 标志位、可选原因码、最大值度量与限定在汇总边界内的作用域">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<rect class="bg" width="900" height="414"/>
<text class="h" x="20" y="26">8.2.1 报文里到底装了什么：一个 IGP 扩展，五个字段</text>

<text class="s" x="36" y="58">字段</text>
<text class="s" x="250" y="58">内容</text>
<text class="s" x="660" y="58">作用</text>
<path class="ar" d="M20 68 L880 68" opacity="0.5"/>

<rect class="b1" x="20" y="78" width="860" height="48" rx="8"/>
<text class="t" x="36" y="108">前缀</text>
<text class="m" x="250" y="108">10.1.1.0/24（失效的那个具体前缀）</text>
<text class="s" x="660" y="108">精确指出坏的是哪一个</text>

<rect class="b1" x="20" y="134" width="860" height="48" rx="8"/>
<text class="t" x="36" y="164">UPA 标志</text>
<text class="m" x="250" y="164">置位（unreachable）</text>
<text class="s" x="660" y="164">告诉接收方这是负向信号</text>

<rect class="b" x="20" y="190" width="860" height="48" rx="8"/>
<text class="t" x="36" y="220">原因码（可选）</text>
<text class="m" x="250" y="220">链路失效 / 分量丢失 / 管理性关闭</text>
<text class="s" x="660" y="220">便于排障归因</text>

<rect class="b3" x="20" y="246" width="860" height="48" rx="8"/>
<text class="t" x="36" y="276">度量</text>
<text class="m" x="250" y="276">通常置最大值</text>
<text class="s" x="660" y="276">确保不被当成可用路径</text>

<rect class="b3" x="20" y="302" width="860" height="48" rx="8"/>
<text class="t" x="36" y="332">作用域</text>
<text class="m" x="250" y="332">限定在汇总边界内泛洪</text>
<text class="s" x="660" y="332">防止全网泛洪（见 8.4）</text>

<rect class="b2" x="20" y="360" width="860" height="44" rx="8"/>
<text class="s" x="36" y="386">它不是"路由撤销"：这个前缀本来就不在 IGP 里，没有东西可撤销；它只是临时的、显式的不可达声明，恢复后即撤销</text>
</svg>
