<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" role="img" aria-label="UPA 没生效的五步排查：能力是否协商、发起侧与汇总侧是否都配、分量失效时是否真的发出、收到后 FIB 是否变化、是否存在可切的备份路径">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="476"/>
<text class="h" x="20" y="26">8.6 排障：UPA 没生效，按信息流的方向查</text>

<rect class="b1" x="20" y="44" width="250" height="38" rx="8"/>
<text class="t" x="36" y="69">业务中断几十秒后自愈</text>

<path class="ar" d="M130 82 L130 96 M130 96 L130 386 M130 96 L660 96"/>
<path class="ar" d="M130 122 L152 122"/>
<path class="ar" d="M130 186 L152 186"/>
<path class="ar" d="M130 250 L152 250"/>
<path class="ar" d="M130 314 L152 314"/>
<path class="ar" d="M130 378 L152 378"/>

<rect class="b4" x="154" y="100" width="726" height="48" rx="8"/>
<text class="t" x="170" y="122">① IGP 能力协商了吗</text>
<text class="s" x="170" y="140">两台都必须支持，未知 TLV 会被直接忽略 → 行为静默退化为无 UPA</text>

<rect class="b4" x="154" y="164" width="726" height="48" rx="8"/>
<text class="t" x="170" y="186">② 两侧都配了吗</text>
<text class="s" x="170" y="204">发起侧配了、汇总侧漏配，等于没配（案例 C）；中间每台 ABR 都要配</text>

<rect class="b3" x="154" y="228" width="726" height="48" rx="8"/>
<text class="t" x="170" y="250">③ 分量失效时真的发了吗</text>
<text class="s" x="170" y="268">没有 → 该明细未被认定为「被汇总覆盖」，回到汇总配置检查</text>

<rect class="b3" x="154" y="292" width="726" height="48" rx="8"/>
<text class="t" x="170" y="314">④ 收到 UPA 后 FIB 变了吗</text>
<text class="s" x="170" y="332">没变 → 通常是没有备份路径可切，问题已经不在 UPA</text>

<rect class="b2" x="154" y="356" width="726" height="48" rx="8"/>
<text class="t" x="170" y="378">⑤ 有备份路径吗</text>
<text class="s" x="170" y="396">show bgp &lt;prefix&gt; 无 Backup → PIC 无从切起，回到 BGP 拓扑本身</text>

<rect class="b" x="20" y="416" width="860" height="50" rx="8"/>
<text class="t" x="36" y="440">排查顺序不能反</text>
<text class="s" x="36" y="460">信息流是「配 → 发 → 收 → 改表 → 切路径」，上游任何一环断了，下游看到的都是同一个现象：几十秒后自愈</text>
</svg>
