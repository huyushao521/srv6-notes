<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 434" width="900" height="434" role="img" aria-label="UPA 的作用域：只在产生汇总的汇聚层发起，通告限定在汇总边界内，核心只接收不发起，其他区域完全看不到这条负向信号">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="434"/>
<text class="h" x="20" y="26">8.4 作用域：只在汇聚层发起，只到汇总边界为止</text>

<rect class="b2" x="20" y="46" width="240" height="120" rx="10"/>
<text class="t" x="36" y="70">地市汇聚（发起侧）</text>
<text class="m" x="36" y="94">PE3 / PE4</text>
<text class="s" x="36" y="118">分量失效 → 发 UPA</text>
<text class="g" x="36" y="140">这里必须配 upa</text>
<text class="s" x="36" y="158">它是唯一知道真相的地方</text>

<path class="ar" d="M260 106 L318 106" marker-end="url(#a)"/>
<text class="s" x="258" y="96">泛洪</text>

<path d="M320 52 L320 160" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="6 4" fill="none"/>
<text class="r" x="300" y="176">汇总边界</text>

<rect class="b1" x="330" y="46" width="240" height="120" rx="10"/>
<text class="t" x="346" y="70">核心 ABR（接收侧）</text>
<text class="m" x="346" y="94">只接收、只利用</text>
<text class="s" x="346" y="118">收到 UPA → 立即改 FIB</text>
<text class="g" x="346" y="140">这里必须配 upa</text>
<text class="r" x="346" y="158">但绝不发起 UPA</text>

<path class="ar" d="M570 106 L628 106" marker-end="url(#a)"/>

<rect class="b" x="630" y="46" width="250" height="120" rx="10"/>
<text class="t" x="646" y="70">其他区域 / 其他地市</text>
<text class="m" x="646" y="94">看不到这条 UPA</text>
<text class="s" x="646" y="118">也不需要看到</text>
<text class="s" x="646" y="140">它们的汇总与本故障无关</text>
<text class="s" x="646" y="158">保持完全无感</text>

<rect class="b2" x="20" y="196" width="420" height="120" rx="8"/>
<text class="t" x="36" y="220">✔ 正确做法</text>
<text class="s" x="36" y="244">UPA 限定在汇总产生的汇聚层使用</text>
<text class="s" x="36" y="264">作用域限定在汇总边界内</text>
<text class="s" x="36" y="284">核心层只配「接收」能力</text>
<text class="g" x="36" y="304">IGP 规模几乎不受影响</text>

<rect class="b4" x="460" y="196" width="420" height="120" rx="8"/>
<text class="t" x="476" y="220">✘ 错误做法</text>
<text class="s" x="476" y="244">核心层也开「发起」</text>
<text class="s" x="476" y="264">UPA 不分边界全网泛洪</text>
<text class="r" x="476" y="284">LSP 膨胀 + SPF 反复计算</text>
<text class="r" x="476" y="304">一次业务故障升级成控制面故障（案例 B）</text>

<rect class="b1" x="20" y="332" width="860" height="52" rx="8"/>
<text class="t" x="36" y="356">为什么作用域能收住：UPA 描述的故障天然是「局部的」</text>
<text class="s" x="36" y="376">某个地市某条明细掉了，只有该地市的汇聚与它的汇总路由器需要知道；把这条信息送到全网纯属浪费</text>

<rect class="b3" x="20" y="392" width="860" height="32" rx="8"/>
<text class="s" x="36" y="414">推论：越靠近核心，越只「听」不「说」；越靠近业务，越只「说」不「听」</text>
</svg>
