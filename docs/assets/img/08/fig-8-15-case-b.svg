<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" role="img" aria-label="案例 B：整机重启导致八千条明细同时失效，逐条 UPA 泛洪使 LSP 从 1.2 KB 涨到 3.8 MB、SPF 反复计算、核心 CPU 打满四十秒；配置五百条阈值后改为撤销汇总，IGP 平稳，业务三百毫秒恢复">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="428"/>
<text class="h" x="20" y="26">案例 B：一次电源故障，8000 条 UPA 差点把 IGP 打穿</text>

<text class="s" x="20" y="56">没配阈值时</text>
<rect class="b4" x="20" y="66" width="420" height="150" rx="10"/>
<text class="s" x="36" y="90">一台汇聚 PE 整机重启</text>
<text class="s" x="36" y="110">→ 它下面 8,000 条明细同时失效</text>
<text class="s" x="36" y="130">→ 逐条发 UPA，逐个泛洪</text>
<text class="s" x="36" y="158">LSP 大小</text>
<rect class="b" x="36" y="168" width="60" height="16"/>
<text class="m" x="104" y="181">1.2 KB（平时）</text>
<rect class="b4" x="36" y="190" width="330" height="16"/>
<text class="r" x="374" y="203">3.8 MB</text>
<text class="s" x="36" y="214">LSP 分片激增 → SPF 反复计算 → 核心 CPU 打满 40 秒</text>

<text class="s" x="470" y="56">配置阈值后</text>
<rect class="b2" x="470" y="66" width="410" height="150" rx="10"/>
<text class="s" x="486" y="90">同一场景，suppress-above 500 生效</text>
<text class="s" x="486" y="110">→ 失效数 &gt; 500，直接撤销汇总通告</text>
<text class="s" x="486" y="130">→ 一条撤销，不是 8,000 条 UPA</text>
<text class="g" x="486" y="158">IGP 全程平稳，无分片风暴</text>
<text class="g" x="486" y="180">业务切换 300 ms（BGP 重新收敛）</text>
<text class="s" x="486" y="204">代价可控，因为整机故障本就是 BGP 该看见的</text>

<rect class="b3" x="20" y="230" width="860" height="72" rx="8"/>
<text class="t" x="36" y="254">为什么"更精准"反而更糟</text>
<text class="s" x="36" y="276">UPA 的收益来自"只有少数分量坏了才发"；一旦失效数量级上去了，它就退化成一次大规模路由更新，</text>
<text class="s" x="36" y="296">而此时 BGP 早就能通过撤销汇总看到故障 —— 用 UPA 等于绕过更合适的机制</text>

<rect class="b1" x="20" y="314" width="860" height="66" rx="8"/>
<text class="t" x="36" y="338">教训：UPA 是精准通知机制，不是批量通知机制</text>
<text class="s" x="36" y="360">整机级故障交给 BGP，分量级故障交给 UPA；混用会把一个业务故障放大成一次控制面故障</text>

<rect class="b" x="20" y="388" width="860" height="32" rx="6"/>
<text class="s" x="36" y="409">巡检项：所有汇聚层设备都要有 max-prefix-per-update 与 suppress-above，且阈值随明细规模调整</text>
</svg>
