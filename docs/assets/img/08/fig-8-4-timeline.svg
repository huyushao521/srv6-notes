<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-label="时序对照：有 UPA 时从下一跳失效到业务恢复不到 50 毫秒，无 UPA 时要等到约 70 秒 IGP 重收敛与 BGP 重算完成才恢复">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="452"/>
<text class="h" x="20" y="26">8.2 时序：同样一次失效，差别只在"有没有人送信"</text>

<rect class="b2" x="20" y="40" width="860" height="176" rx="10"/>
<text class="t" x="36" y="64">有 UPA：毫秒级</text>
<path class="ar" d="M70 130 L860 130" marker-end="url(#a)"/>
<circle cx="90" cy="130" r="4" fill="#2f855a"/>
<circle cx="240" cy="130" r="4" fill="#2f855a"/>
<circle cx="400" cy="130" r="4" fill="#2f855a"/>
<circle cx="580" cy="130" r="4" fill="#2f855a"/>
<text class="m" x="70" y="118">t=0</text>
<text class="m" x="204" y="118">t≈1 ms</text>
<text class="m" x="356" y="118">t≈5 ms</text>
<text class="m" x="524" y="118">t≈20 ms</text>
<text class="s" x="60" y="152">明细下一跳失效</text>
<text class="s" x="196" y="152">PE3 检测到</text>
<text class="s" x="348" y="152">发出 IGP UPA</text>
<text class="s" x="500" y="152">ABR 收到，FIB 立即改</text>
<text class="g" x="60" y="176">→ PIC 切到 PE4 的备份路径，业务恢复 &lt; 50 ms（与 TI-LFA 同量级）</text>
<text class="s" x="60" y="200">关键：不等 BGP，BGP 那条汇总从头到尾没有变化</text>

<rect class="b4" x="20" y="228" width="860" height="150" rx="10"/>
<text class="t" x="36" y="252">无 UPA：等 70 秒</text>
<path class="ar" d="M70 318 L860 318" marker-end="url(#a)"/>
<circle cx="90" cy="318" r="4" fill="#c0392b"/>
<circle cx="820" cy="318" r="4" fill="#c0392b"/>
<text class="m" x="70" y="306">t=0</text>
<text class="m" x="790" y="306">t≈70 s</text>
<text class="s" x="60" y="340">同样失效</text>
<text class="r" x="330" y="340">黑洞期：报文持续进 Null0，无任何告警</text>
<text class="s" x="742" y="340">才恢复</text>
<text class="s" x="60" y="364">恢复原因：IGP 重收敛 + BGP 最优路径重算完成，或会话超时/扫描周期到点</text>

<rect class="b1" x="20" y="390" width="860" height="50" rx="8"/>
<text class="t" x="36" y="412">两者相差 1400 倍，差的不是设备能力</text>
<text class="s" x="36" y="432">同样的 PE3、同样的失效检测，唯一区别是有没有一条 IGP 通告把"分量没了"这件事送到 ABR 手里</text>
</svg>
