<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-label="TI-LFA：主路径 1-2-3 故障时，节点 1 立即按修复列表经节点 4 转发，不等 IGP 收敛">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.r{fill:#c0392b;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.ln{stroke:#9aa4b2;stroke-width:1.8;fill:none}.bad{stroke:#c0392b;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}.b3{fill:#2a2113;stroke:#ecc94b}
.b{fill:#1b2029;stroke:#39414f}.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.o{fill:#ecc94b}.r{fill:#f87171}.ln{stroke:#5a6472}.bad{stroke:#f87171}}
</style>
<rect class="bg" width="900" height="384"/>
<text class="h" x="24" y="26">TI-LFA：用邻接段钉死修复路径（原书 Figure 3.33 / 3.34 / 3.35 重绘）</text>

<rect class="b1" x="60" y="72" width="90" height="44" rx="8"/>
<text class="t" x="88" y="99">1 源</text>
<rect class="b1" x="300" y="40" width="90" height="44" rx="8"/>
<text class="t" x="328" y="67">2</text>
<rect class="b1" x="560" y="40" width="90" height="44" rx="8"/>
<text class="t" x="588" y="67">3</text>
<rect class="b2" x="300" y="168" width="90" height="44" rx="8"/>
<text class="t" x="328" y="195">4</text>
<rect class="b3" x="740" y="40" width="120" height="44" rx="8"/>
<text class="s" x="756" y="67">业务 SID 终点</text>

<path class="ln" d="M150 86 L300 62"/>
<path class="bad" d="M390 62 L560 62"/>
<text class="r" x="452" y="52">✕ 链路故障</text>
<path class="ln" d="M150 102 L300 190"/>
<path class="ln" d="M390 190 L560 86"/>
<path class="ln" d="M650 62 L740 62"/>
<text class="s" x="186" y="118">主路径 1 → 2 → 3</text>
<text class="o" x="150" y="160">修复路径 1 → 4 → 3</text>

<rect class="b" x="24" y="232" width="852" height="72" rx="8"/>
<text class="t" x="40" y="256">节点 1 预装的修复列表（IGP 收敛完成前立即使用）：</text>
<text class="m" x="40" y="282">[ fc00:0:1:e004::  (Adj 1→4) ,  fc00:0:4:e003::  (Adj 4→3) ,  fc00:0:3:eeee:: ]</text>

<rect class="b" x="24" y="316" width="852" height="56" rx="8"/>
<text class="s" x="40" y="340">P 空间 = 故障链路之前仍可达的节点；Q 空间 = 收敛后仍能到达目的的节点；修复路径取两者最近交点</text>
<text class="s" x="40" y="362">链路保护只需 1 条 Adj-SID；节点保护要把故障节点整段绕开。修复列表 ≤6 条即可塞进 uSID 容器，免 SRH</text>
</svg>
