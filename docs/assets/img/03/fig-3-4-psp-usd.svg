<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900" height="356" role="img" aria-label="PSP 与 USD flavor：倒数第二跳剥离 SRH，终点解封装外层 IPv6，Next Header 指向内层协议">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}.b3{fill:#2a2113;stroke:#ecc94b}
.b{fill:#1b2029;stroke:#39414f}.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.o{fill:#ecc94b}}
</style>
<rect class="bg" width="900" height="356"/>
<text class="h" x="24" y="26">PSP 与 USD：把 SRH 在最合适的地方摘掉（原书 Figure 3.10 / 3.13 / 3.15 重绘）</text>

<rect class="b1" x="24" y="42" width="272" height="150" rx="8"/>
<text class="t" x="40" y="66">PSP（倒数第二跳）</text>
<text class="s" x="40" y="92">DA = 最后一段之前的 SID</text>
<text class="s" x="40" y="114">SL 已归零 → 转发前剥离 SRH</text>
<text class="s" x="40" y="136">末端收到：NH=4，无 SRH</text>
<text class="o" x="40" y="162">省 8 B + 一次内存写</text>
<text class="s" x="40" y="182">末端 ASIC 少解析一层</text>

<rect class="b2" x="312" y="42" width="276" height="150" rx="8"/>
<text class="t" x="328" y="66">USD（终点解封装）</text>
<text class="s" x="328" y="92">末节点命中 End.DT4</text>
<text class="s" x="328" y="114">剥掉外层 IPv6，查 VRF</text>
<text class="s" x="328" y="136">NH = 4 → 内层 IPv4</text>
<text class="o" x="328" y="162">NH = 41 → 内层 IPv6</text>
<text class="s" x="328" y="182">NH = 143 → 以太网帧</text>

<rect class="b3" x="604" y="42" width="272" height="150" rx="8"/>
<text class="t" x="620" y="66">两者全开</text>
<text class="s" x="620" y="92">PSP 剥 SRH，USD 剥外层</text>
<text class="s" x="620" y="114">域内只剩基本头 + 载荷</text>
<text class="s" x="620" y="136">末端收到的就是客户报文</text>
<text class="o" x="620" y="162">与 MPLS PHP 同思路</text>
<text class="s" x="620" y="182">但由 SID flavor 静态决定</text>

<rect class="b" x="24" y="208" width="852" height="60" rx="8"/>
<text class="t" x="40" y="232">Next Header 的链条决定“内层是什么”：</text>
<text class="m" x="40" y="254">IPv6 基本头 NH=43 → SRH NH=4（IPv4）/ 41（IPv6）/ 143（Ethernet）</text>

<rect class="b" x="24" y="280" width="852" height="60" rx="8"/>
<text class="s" x="40" y="304">flavor 是“SID 的属性”，部署时统一规划：域内全开 PSP + 业务 SID 开 USD；</text>
<text class="s" x="40" y="326">只有“末端需要看到完整列表”或“需要携带 TLV / 标志位”时才把 SRH 留到终点</text>
</svg>
