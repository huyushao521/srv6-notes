<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" width="900" height="352" role="img" aria-label="End.X 邻接行为：DA 命中本地邻接段后从指定接口发出；与 uN 组合时一次查表完成两条指令">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}.b3{fill:#2a2113;stroke:#ecc94b}
.b{fill:#1b2029;stroke:#39414f}.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.o{fill:#ecc94b}.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="352"/>
<text class="h" x="24" y="26">End.X 与 uN + uA 组合（原书 Figure 3.23 / 3.25 重绘）</text>

<rect class="b1" x="24" y="44" width="414" height="150" rx="8"/>
<text class="t" x="40" y="68">End.X：命中本地邻接段</text>
<text class="m" x="40" y="96">DA = fc00:0:2:e002::</text>
<text class="s" x="40" y="120">SID 类型：Adj-SID（不可路由）</text>
<text class="s" x="70" y="138">动作：直接从 Eth3 发出，不查 SPF</text>
<text class="s" x="40" y="164">→ 报文被“钉”在这条链路上</text>
<text class="o" x="40" y="186">用于 TI-LFA、强制绕行、跨域拼接</text>

<rect class="b2" x="462" y="44" width="414" height="150" rx="8"/>
<text class="t" x="478" y="68">uN + uA：一次查表两件事</text>
<text class="m" x="478" y="96">DA = fc00:0000:0002:e002:0000 …</text>
<text class="s" x="478" y="120">FIB 命中 fc00:0000:0002:e002::/64</text>
<text class="s" x="478" y="144">动作：出 Eth3 + 左移 32 bit</text>
<text class="s" x="478" y="168">→ 走完 uN 与 uA 各一条指令</text>
<text class="o" x="478" y="190">一个前缀长度吃掉两条微指令</text>

<rect class="b" x="24" y="212" width="852" height="120" rx="8"/>
<text class="t" x="40" y="236">邻接段的两种形态：</text>
<text class="s" x="40" y="260">● 不可路由 Adj-SID：只在本节点有效，出节点即失效，适合一次性绕行</text>
<text class="s" x="40" y="282">● 可路由 Adj-SID：把 locator 之外的地址也通告出去，可在多跳外指定出口（用于跨域）</text>
<text class="s" x="40" y="304">● LAN End.X：SID 绑定到多接入 LAN 上的某个邻居，而不是本节点的接口</text>
<text class="s" x="40" y="326">flavor 同样适用：End.X 也可带 uN / PSP / USD，含义与 End 一致</text>
</svg>
