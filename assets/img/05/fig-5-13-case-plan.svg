<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-label="案例 A：19,000 节点网络的地址分块、三个方向的泄露策略与规模账本">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 11.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}}
</style>
<rect class="bg" width="900" height="436"/>
<text class="h" x="24" y="26">案例 A：19,000 节点 —— 先分块，再决定泄露三个方向（案例 A）</text>

<rect class="b1" x="24" y="42" width="852" height="150" rx="8"/>
<text class="t" x="42" y="66">地址规划：两个 /32 按算法分开，/32 内再按区域切 /40</text>
<rect class="b" x="44" y="78" width="150" height="44" rx="6"/>
<text class="m" x="56" y="96">fdbb:bb00::/32</text><text class="s" x="56" y="114">Algo 0</text>
<rect class="b" x="210" y="78" width="150" height="44" rx="6"/>
<text class="m" x="222" y="96">fdbb:bb01::/32</text><text class="s" x="222" y="114">Flex-Algo 128</text>
<text class="s" x="378" y="96">两个块绝不合并汇总 —— 跨块汇总等于算法属性丢失（铁律二）</text>
<text class="s" x="378" y="116">每个块内：一个区域一条 /40（256 个 /48）</text>
<rect class="b2" x="44" y="132" width="100" height="34" rx="6"/><text class="s" x="56" y="154">区域 1 /40</text>
<rect class="b2" x="152" y="132" width="100" height="34" rx="6"/><text class="s" x="164" y="154">区域 2 /40</text>
<rect class="b2" x="260" y="132" width="100" height="34" rx="6"/><text class="s" x="272" y="154">区域 3 /40</text>
<rect class="b2" x="368" y="132" width="100" height="34" rx="6"/><text class="s" x="380" y="154">区域 4 /40</text>
<rect class="b3" x="476" y="132" width="180" height="34" rx="6"/><text class="s" x="488" y="154">地市 METRO 各一段 /40 ×60</text>
<text class="s" x="42" y="182">规模前提：核心 4 区 × 200 台 + 地市 60 个实例；每台 2 个 locator（Algo 0 + FA128）</text>

<rect class="b" x="24" y="204" width="264" height="86" rx="8"/>
<text class="t" x="40" y="228">① L2 → L1（区内）</text>
<text class="m" x="40" y="250">le 48 · 两个 /32 都放</text>
<text class="s" x="40" y="272">区内能选最优 ABR、能走算法路径</text>

<rect class="b" x="318" y="204" width="264" height="86" rx="8"/>
<text class="t" x="334" y="228">② L1 → L2（出区）</text>
<text class="m" x="334" y="250">只放本区两条 /40</text>
<text class="s" x="334" y="272">骨干只看到聚合，看不到本区明细</text>

<rect class="b" x="612" y="204" width="264" height="86" rx="8"/>
<text class="t" x="628" y="228">③ 实例间（CORE ↔ METRO）</text>
<text class="m" x="628" y="250">只放对端实例的 /40 聚合</text>
<text class="s" x="628" y="272">星型拓扑，两个方向同一个 prefix-set</text>

<rect class="b2" x="24" y="302" width="420" height="88" rx="8"/>
<text class="t" x="42" y="326">规模账本：汇总之后</text>
<text class="s" x="42" y="348">核心 L2 路由表：4 条区域 /40 + 60 条地市 /40 = 64 条</text>
<text class="s" x="42" y="368">区内 L1 路由表：64 条聚合，且都是最优出口（不再靠默认路由）</text>
<text class="g" x="42" y="386">SPF 计算量：本区拓扑 + 聚合前缀，收敛影响面收缩到本区</text>

<rect class="b4" x="456" y="302" width="420" height="88" rx="8"/>
<text class="t" x="474" y="326">不汇总会怎样</text>
<text class="s" x="474" y="348">核心 L2 路由表：19,000 条（每节点一条 /48）</text>
<text class="s" x="474" y="368">区内：要么 1 条默认路由（次优），要么 19,000 条明细</text>
<text class="r" x="474" y="386">单台节点增删 → 全区 SPF；收敛影响面 = 全网</text>

<rect class="b3" x="24" y="400" width="852" height="36" rx="8"/>
<text class="s" x="42" y="423">上线核对六步：策略只命中 locator → 区内有聚合且 X:1 → 骨干只有聚合 → Null0 与明细并存 → 算法路由独立 → 重分发计数不增长。</text>
</svg>
