<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 408" width="900" height="408" role="img" aria-label="汇总的压缩比：256 个 /48 装进一个 /40，65,536 个装进一个 /32，MPLS 线性增长而 SRv6 保持平坦">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.pg{fill:#eaf7ee;stroke:#2f855a;stroke-width:0.8}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.lr{stroke:#c0392b;stroke-width:2.2;fill:none}.lg{stroke:#2f855a;stroke-width:2.2;fill:none}
.ax{stroke:#9aa4b2;stroke-width:1.2;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.pg{fill:#14291d;stroke:#68d391}.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}
.r{fill:#f87171}.g{fill:#68d391}.lr{stroke:#f87171}.lg{stroke:#68d391}.ax{stroke:#5a6472}}
</style>
<defs><pattern id="g" width="24" height="22" patternUnits="userSpaceOnUse"><rect class="pg" x="1" y="1" width="21" height="19"/></pattern></defs>
<rect class="bg" width="900" height="408"/>
<text class="h" x="24" y="26">汇总：SRv6 相对 MPLS 的结构性红利 —— /40 装 256 个 /48（5.4 节）</text>

<rect class="b2" x="24" y="44" width="430" height="196" rx="8"/>
<text class="t" x="40" y="68">一个 /40 = 256 个 /48（示意 8×4 格，实际 8×32）</text>
<rect x="40" y="82" width="384" height="86" fill="url(#g)" stroke="#2f855a" stroke-width="1.4"/>
<text class="s" x="40" y="188">每个小格 = 一台节点的一个 locator（/48）</text>
<text class="s" x="40" y="208">256 : 1 —— 核心只看到 1 条，不看到 256 条</text>
<text class="m" x="40" y="230">再上一层：256 个 /40 = 1 个 /32（65,536 : 1）</text>

<rect class="b" x="470" y="44" width="406" height="196" rx="8"/>
<text class="t" x="486" y="68">核心路由表随规模的变化</text>
<path class="ax" d="M500 226 L860 226"/>
<path class="ax" d="M500 226 L500 84"/>
<text class="s" x="486" y="240">节点数 →</text>
<path class="lr" d="M505 220 L845 92"/>
<text class="r" x="628" y="130">MPLS：线性增长</text>
<path class="lg" d="M505 216 L845 206"/>
<text class="g" x="640" y="200">SRv6：几条聚合，平坦</text>
<text class="s" x="506" y="270">标签空间不可汇总（标签本地有效、无层级），</text>
<text class="s" x="506" y="290">所以 MPLS 网的表是“节点数”的函数；</text>
<text class="s" x="506" y="310">locator 是 IPv6 前缀，可汇总，所以 SRv6 的表是“区域数”的函数。</text>

<rect class="b3" x="24" y="256" width="430" height="128" rx="8"/>
<text class="t" x="40" y="280">三组实数（原书表格）</text>
<text class="m" x="40" y="304">1,000 台节点   → 1,000 条  /  4 条 /40　　250:1</text>
<text class="m" x="40" y="328">19,000 台节点 → 19,000 条 /  75 条 /40　253:1</text>
<text class="m" x="40" y="352">65,536 台节点 → 65,536 条 /  1 条 /32　65,536:1</text>
<text class="s" x="40" y="374">Bell 的 19,000 节点实网：核心 75 条 /40 代替 19,000 条 /48</text>

<rect class="b4" x="470" y="256" width="406" height="128" rx="8"/>
<text class="t" x="486" y="280">但汇总不是免费的</text>
<text class="s" x="486" y="304">① 每条汇总都伴随一条 Null0 丢弃路由</text>
<text class="s" x="486" y="326">② 明细消失时，汇总仍在吸引流量 → 静默黑洞</text>
<text class="s" x="486" y="348">③ 算法属性不能跨块汇总，必须一个算法一个块</text>
<text class="r" x="486" y="372">→ 第 8 章 UPA 就是为了填这个坑</text>
</svg>
