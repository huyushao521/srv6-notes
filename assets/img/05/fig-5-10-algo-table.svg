<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" width="900" height="466" role="img" aria-label="算法 locator 的路由只存在于该算法的路由表里，未参与算法的中间节点直接丢弃报文">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.7;fill:none}.ar2{stroke:#c0392b;stroke-width:1.9;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}.ar2{stroke:#f87171}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#c0392b"/></marker></defs>
<rect class="bg" width="900" height="466"/>
<text class="h" x="24" y="26">外层 DA 是算法 locator：没参与的节点连路由都没有，直接丢（5.5.1 节）</text>

<rect class="b" x="24" y="46" width="140" height="56" rx="8"/>
<text class="t" x="38" y="68">PE-1</text><text class="m" x="38" y="88">DA fc00:1:7::</text>
<rect class="b2" x="192" y="46" width="140" height="56" rx="8"/>
<text class="t" x="206" y="68">P-11</text><text class="g" x="206" y="88">Participating: Yes</text>
<rect class="b4" x="360" y="46" width="140" height="56" rx="8"/>
<text class="t" x="374" y="68">P-12</text><text class="r" x="374" y="88">Participating: No</text>
<rect class="b" x="528" y="46" width="140" height="56" rx="8"/>
<text class="t" x="542" y="68">ABR-6</text><text class="s" x="542" y="88">按 128 转发</text>
<rect class="b" x="696" y="46" width="140" height="56" rx="8"/>
<text class="t" x="710" y="68">PE-7</text><text class="m" x="710" y="88">fc00:1:7::</text>
<path class="ar" d="M164 74 L192 74" marker-end="url(#a)"/>
<path class="ar" d="M332 74 L360 74" marker-end="url(#a)"/>
<path class="ar2" d="M500 74 L528 74" marker-end="url(#ar)"/>
<path class="ar" d="M668 74 L696 74" marker-end="url(#a)"/>
<text class="s" x="196" y="124">有 128 的路由</text>
<text class="r" x="356" y="124">✗ 无该前缀 → 丢弃</text>
<text class="s" x="356" y="142">同一节点的 Algo(0) locator 却可达</text>

<rect class="b1" x="24" y="164" width="420" height="150" rx="8"/>
<text class="t" x="40" y="188">Algo(0) 路由表（P-12 上，未参与 128）</text>
<text class="m" x="40" y="214">fc00:0:7::/48　　40　Gi0/0/0/1　L1</text>
<text class="g" x="40" y="236">→ 有：普通业务照常通</text>
<text class="m" x="40" y="264">fc00:1:7::/48　　—　无条目</text>
<text class="r" x="40" y="286">→ 无：外层 DA 是它 → 直接丢</text>
<text class="s" x="40" y="306">不是环路、不是次优，是“查表即失败”</text>

<rect class="b2" x="456" y="164" width="420" height="150" rx="8"/>
<text class="t" x="472" y="188">Flex-Algo(128) 路由表（P-11 上，已参与）</text>
<text class="m" x="472" y="214">fc00:1:7::/48　　40　Gi0/0/0/1　FA128</text>
<text class="g" x="472" y="236">→ 有：低时延业务可转发</text>
<text class="m" x="472" y="264">fc00:0:7::/48　　40　Gi0/0/0/0　L1</text>
<text class="s" x="472" y="286">两张表并存，各算各的 SPF 树</text>
<text class="s" x="472" y="306">Participating + 有远端 locator，两条同时成立才算能转发</text>

<rect class="b3" x="24" y="334" width="852" height="116" rx="8"/>
<text class="t" x="42" y="358">经典现象：跨区低时延业务不通，普通业务全通；traceroute 断在某台 P 节点，ping 它的 Algo(0) locator 一切正常。</text>
<text class="s" x="42" y="382">三种部署结果：全参与（一行 flex-algo 128，全程一致）／不参与（不通，静默丢弃）／边界换 SID（要头端编程或 BSID，规模不友好）。</text>
<text class="r" x="42" y="406">工程结论：Flex-Algo 要跨区，就整个转发域一起参与 —— 转发路径上每一跳都要有该算法的路由。</text>
<text class="s" x="42" y="430">算法属性跨实例重分发、跨 AS 由 BGP 承载时同样会丢，退化为 Algo(0) 路径（5.3 节）。</text>
</svg>
