<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img" aria-label="泄露验证的三条命令与判据闭环：路由条目、down 位、是否被回灌">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:2;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="372"/>
<text class="h" x="24" y="26">泄露“配上了没有”：三条命令构成一个闭环判据（5.2.3 节）</text>

<rect class="b1" x="24" y="50" width="264" height="186" rx="8"/>
<text class="t" x="40" y="74">① 有路由吗</text>
<text class="m" x="40" y="98">show isis route</text>
<text class="m" x="40" y="116">　　fc00:0:7::/48</text>
<text class="s" x="40" y="144">有条目 · Source = L1</text>
<text class="s" x="40" y="162">Metric 30，Nexthop 指向 ABR-2</text>
<rect class="b4" x="40" y="178" width="232" height="44" rx="6"/>
<text class="r" x="52" y="196">无条目 → 泄露没配，</text>
<text class="r" x="52" y="213">或策略把这条 drop 了</text>

<rect class="b1" x="318" y="50" width="264" height="186" rx="8"/>
<text class="t" x="334" y="74">② 是不是泄露来的</text>
<text class="m" x="334" y="98">show isis database</text>
<text class="m" x="334" y="116">　　verbose level-1</text>
<text class="s" x="334" y="144">Extended Reachability 段里看</text>
<text class="s" x="334" y="162">Prefix Attribute Flags: X:1</text>
<rect class="b4" x="334" y="178" width="232" height="44" rx="6"/>
<text class="r" x="346" y="196">X:0 而链路确实跨区</text>
<text class="r" x="346" y="213">→ 本地产生，不是泄露</text>

<rect class="b1" x="612" y="50" width="264" height="186" rx="8"/>
<text class="t" x="628" y="74">③ 有没有被回灌</text>
<text class="m" x="628" y="98">show isis route level-2</text>
<text class="m" x="628" y="116">（在骨干侧看同一前缀）</text>
<text class="s" x="628" y="144">L2 侧应看不到带 X 的前缀</text>
<text class="s" x="628" y="162">被 L1 塞回来的一律忽略</text>
<rect class="b4" x="628" y="178" width="232" height="44" rx="6"/>
<text class="r" x="640" y="196">学到了且生效 → 违反</text>
<text class="r" x="640" y="213">up/down 规则，查实现与策略</text>

<path class="ar" d="M288 143 L318 143" marker-end="url(#a)"/>
<path class="ar" d="M582 143 L612 143" marker-end="url(#a)"/>

<rect class="b3" x="24" y="254" width="852" height="100" rx="8"/>
<text class="t" x="42" y="278">闭环逻辑：前缀在 → 带 X → 未回灌。三步都成立，泄露才算“配对了”；任何一步不成立，问题就能定位到具体一层。</text>
<text class="s" x="42" y="302">常见误判：只查第 ① 步看到有路由就收工 —— 但若这条路由是本地产生的（X:0），它既不会跟随远端变化，也不会带算法属性。</text>
<text class="s" x="42" y="326">第 ③ 步最容易被跳过，也最危险：回灌一旦生效，同一前缀在同一区域里出现两个来源，撤销/重装会反复触发 SPF。</text>
</svg>
