<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="案例 B：三向无策略重分发形成反馈环，前缀在实例间往返导致 SPF 反复重算">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 11.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.7;fill:none}.ar2{stroke:#c0392b;stroke-width:2;fill:none;stroke-dasharray:7 4}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}
.ar{stroke:#5a6472}.ar2{stroke:#f87171}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#c0392b"/></marker></defs>
<rect class="bg" width="900" height="420"/>
<text class="h" x="24" y="26">案例 B：三向重分发 = 一个没有 down 位保护的环</text>

<rect class="b1" x="360" y="46" width="180" height="56" rx="8"/>
<text class="t" x="378" y="70">IS-IS CORE</text><text class="s" x="378" y="90">L2，跨骨干</text>
<rect class="b" x="80" y="196" width="180" height="56" rx="8"/>
<text class="t" x="98" y="220">METRO-1</text><text class="s" x="98" y="240">le 64（写宽了）</text>
<rect class="b" x="640" y="196" width="180" height="56" rx="8"/>
<text class="t" x="658" y="220">METRO-2</text><text class="s" x="658" y="240">le 48</text>

<path class="ar" d="M400 102 L200 156 L200 196" marker-end="url(#a)"/>
<path class="ar" d="M250 196 L250 156 L430 102" marker-end="url(#a)"/>
<path class="ar" d="M520 102 L700 156 L700 196" marker-end="url(#a)"/>
<path class="ar" d="M670 196 L670 156 L490 102" marker-end="url(#a)"/>
<path class="ar2" d="M260 220 L640 220" marker-end="url(#ar)"/>
<path class="ar2" d="M640 236 L260 236" marker-end="url(#ar)"/>
<text class="r" x="380" y="212">设计里没有这条</text>

<text class="r" x="360" y="150">前缀往返：metric 每变一次 → 一次 SPF</text>
<text class="s" x="360" y="170">3–5 分钟一次全网抖动，BGP 邻居不掉，业务亚秒丢包</text>

<rect class="b4" x="24" y="272" width="264" height="76" rx="8"/>
<text class="t" x="40" y="294">问题一</text>
<text class="s" x="40" y="316">le 64 把客户前缀也放进来了</text>
<text class="s" x="40" y="336">规模爆炸，IGP 被 BGP 规模拖垮</text>

<rect class="b4" x="318" y="272" width="264" height="76" rx="8"/>
<text class="t" x="334" y="294">问题二</text>
<text class="s" x="334" y="316">三向重分发，M1 ↔ M2 直连也在重分发</text>
<text class="s" x="334" y="336">形成环，且没有 down 位兜底</text>

<rect class="b4" x="612" y="272" width="264" height="76" rx="8"/>
<text class="t" x="628" y="294">问题三</text>
<text class="s" x="628" y="316">两侧策略不一致：一侧 le 64，一侧 le 48</text>
<text class="s" x="628" y="336">单向宽窄差 = 单向回路</text>

<rect class="b2" x="24" y="358" width="852" height="52" rx="8"/>
<text class="t" x="42" y="380">修复：删掉 METRO 之间的重分发（只留星型 CORE ↔ METRO），两个方向共用同一个 prefix-set（le 48）。</text>
<text class="s" x="42" y="400">把 show isis statistics 的 redistributed 计数做成告警指标 —— 它是这类问题唯一稳定的早期信号。</text>
</svg>
