<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="实例间重分发：CORE 与 METRO 只交换 locator 前缀，算法属性丢失，且没有 down 位保护">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.7;fill:none}.ad{stroke:#0b6bcb;stroke-width:2;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}.ad{stroke:#58a6ff}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#0b6bcb"/></marker></defs>
<rect class="bg" width="900" height="470"/>
<text class="h" x="24" y="26">实例之间只交换 locator 前缀：没有链路状态、没有标签、也没有 down 位（5.3 节）</text>

<rect class="b1" x="24" y="44" width="400" height="196" rx="8"/>
<text class="t" x="42" y="68">IS-IS CORE（跨骨干，独立泛洪域）</text>
<text class="s" x="42" y="88">拓扑对 METRO 完全不可见</text>
<rect class="b" x="48" y="104" width="150" height="46" rx="7"/><text class="t" x="60" y="124">P-1</text><text class="m" x="60" y="141">fc00:0:1::/48</text>
<rect class="b" x="48" y="168" width="150" height="46" rx="7"/><text class="t" x="60" y="188">PE-3</text><text class="m" x="60" y="205">fc00:0:3::/48</text>
<rect class="b3" x="244" y="104" width="164" height="110" rx="7"/>
<text class="t" x="258" y="126">BR-2</text>
<text class="s" x="258" y="146">两个实例的边界</text>
<text class="s" x="258" y="166">配两行 redistribute</text>
<text class="r" x="258" y="190">无 up/down 保护</text>

<rect class="b2" x="476" y="44" width="400" height="196" rx="8"/>
<text class="t" x="494" y="68">IS-IS METRO（每地市一个实例）</text>
<text class="s" x="494" y="88">独立进程、独立 SPF、独立 LSP 库</text>
<rect class="b" x="494" y="104" width="150" height="46" rx="7"/><text class="t" x="506" y="124">PE-1</text><text class="m" x="506" y="141">fc00:0:1::/48</text>
<rect class="b" x="494" y="168" width="150" height="46" rx="7"/><text class="t" x="506" y="188">PE-9</text><text class="m" x="506" y="205">fc00:0:9::/48</text>
<rect class="b" x="676" y="104" width="184" height="110" rx="7"/>
<text class="t" x="690" y="126">来源标记</text>
<text class="m" x="690" y="148">Source: redist</text>
<text class="s" x="690" y="170">出现客户前缀即策略写错</text>

<path class="ad" d="M408 130 L476 130" marker-end="url(#ab)"/>
<text class="m" x="332" y="272">redistribute isis CORE level-2 into level-2</text>
<path class="ad" d="M476 214 L408 214" marker-end="url(#ab)"/>
<text class="m" x="332" y="300">redistribute isis METRO level-2 into level-2</text>
<text class="s" x="332" y="326">两个方向都要配，且共用同一个 prefix-set</text>

<rect class="b" x="24" y="256" width="292" height="196" rx="8"/>
<text class="t" x="40" y="280">SR-MPLS 时代要带什么</text>
<text class="s" x="40" y="304">前缀 + 标签绑定</text>
<text class="s" x="40" y="326">SRGB 必须全局规划一致</text>
<text class="s" x="40" y="348">标签冲突：实例间易撞</text>
<text class="s" x="40" y="370">漏配标签：不通，且难定位</text>
<text class="r" x="40" y="400">跨实例保护：需额外设计</text>
<text class="s" x="40" y="428">本质：标识是本地有效的，必须翻译</text>

<rect class="b" x="332" y="336" width="0" height="0"/>
<rect class="b2" x="336" y="336" width="250" height="116" rx="8"/>
<text class="t" x="352" y="360">SRv6：只带前缀</text>
<text class="s" x="352" y="384">locator 本身就是可达性信息</text>
<text class="s" x="352" y="406">SID 就是 IPv6 地址，天然唯一</text>
<text class="s" x="352" y="428">前缀可达即可转发，无绑定要分发</text>

<rect class="b4" x="606" y="336" width="270" height="116" rx="8"/>
<text class="t" x="622" y="360">跨实例丢的是算法属性</text>
<text class="s" x="622" y="384">Flex-Algo(128) 的 locator 变成普通前缀</text>
<text class="s" x="622" y="406">接收方按 Algo(0) 算最短路</text>
<text class="r" x="622" y="428">可达，但不再遵守低时延约束</text>
</svg>
