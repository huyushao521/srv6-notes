<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 408" width="900" height="408" role="img" aria-label="案例 C：发起侧配了 upa 但汇总侧 ABR 漏配，ABR 把 UPA 标志位当成普通前缀忽略，FIB 不动，恢复仍需六十多秒；补齐配置并重新协商后切换降到二十毫秒">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="408"/>
<text class="h" x="20" y="26">案例 C：配了一半的 UPA，比不配更难查</text>

<rect class="b2" x="20" y="46" width="250" height="76" rx="10"/>
<text class="t" x="36" y="70">① 发起侧 PE3</text>
<text class="m" x="36" y="92">router isis upa</text>
<text class="g" x="36" y="112">✔ 配了，通告确实发出</text>

<path class="ar" d="M270 84 L318 84" marker-end="url(#a)"/>
<text class="s" x="272" y="74">UPA</text>

<rect class="b4" x="320" y="46" width="250" height="76" rx="10"/>
<text class="t" x="336" y="70">② 汇总侧 ABR</text>
<text class="m" x="336" y="92">漏配 upa</text>
<text class="r" x="336" y="112">✘ 不认识 UPA 标志位</text>

<path class="ar" d="M570 84 L618 84" marker-end="url(#a)"/>

<rect class="b" x="620" y="46" width="260" height="76" rx="10"/>
<text class="t" x="636" y="70">③ 按普通前缀处理</text>
<text class="s" x="636" y="92">前缀照收，标志位忽略</text>
<text class="r" x="636" y="112">FIB 完全不动</text>

<rect class="b4" x="20" y="140" width="860" height="52" rx="8"/>
<text class="t" x="36" y="164">④ 现象与"完全没配 UPA"一模一样：仍要 60 多秒才恢复</text>
<text class="s" x="36" y="184">所以第一反应往往是"UPA 没用"，而不是"UPA 没配全"</text>

<rect class="b" x="20" y="204" width="420" height="96" rx="8"/>
<text class="t" x="36" y="228">怎么定位到这一步</text>
<text class="m" x="36" y="250">show isis database detail | include UPA</text>
<text class="s" x="36" y="270">→ 有通告（说明 ① 没问题）</text>
<text class="m" x="36" y="290">show cef 10.1.1.0/24 → 仍指 PE3</text>

<rect class="b2" x="460" y="204" width="420" height="96" rx="8"/>
<text class="t" x="476" y="228">修复</text>
<text class="m" x="476" y="250">ABR 补配 upa → 重启 ISIS 进程</text>
<text class="s" x="476" y="270">（或等 Router Capability 重新协商）</text>
<text class="g" x="476" y="290">复测：FIB 20 ms 内切换完成</text>

<rect class="b3" x="20" y="312" width="860" height="60" rx="8"/>
<text class="t" x="36" y="336">教训：UPA 是双向能力协商，不是单向开关</text>
<text class="s" x="36" y="358">配置清单必须写"发起侧 + 汇总侧 + 中间每一台 ABR"，这三处任一缺失，效果都等于零</text>

<rect class="b1" x="20" y="380" width="860" height="30" rx="6"/>
<text class="s" x="36" y="400">推论：能力类特性上线后，第一个要查的不是"生效时间"，而是"两端能力是否都亮"</text>
</svg>
