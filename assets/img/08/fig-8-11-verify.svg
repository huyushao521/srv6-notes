<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="四步验证 UPA 是否真的生效：先确认能力已协商，再人为制造分量失效看到 UPA 通告，然后确认 FIB 立即改指备份，最后用 ping 验证业务切换时间">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="430"/>
<text class="h" x="20" y="26">8.5 验证四步：从能力到业务，一路查下去</text>

<text class="s" x="36" y="60">步骤</text>
<text class="s" x="196" y="60">命令</text>
<text class="s" x="640" y="60">期望</text>
<path class="ar" d="M20 70 L880 70" opacity="0.5"/>

<rect class="b1" x="20" y="80" width="860" height="60" rx="8"/>
<text class="t" x="36" y="104">① 能力协商</text>
<text class="s" x="36" y="124">两台都要</text>
<text class="m" x="196" y="110">show isis database detail | include Router Capability</text>
<text class="g" x="640" y="110">UPA supported</text>

<rect class="b3" x="20" y="148" width="860" height="60" rx="8"/>
<text class="t" x="36" y="172">② 通告真的发了</text>
<text class="s" x="36" y="192">人为制造一次失效</text>
<text class="m" x="196" y="178">show isis database detail | include UPA</text>
<text class="o" x="640" y="178">Prefix ... UPA: set</text>

<rect class="b2" x="20" y="216" width="860" height="60" rx="8"/>
<text class="t" x="36" y="240">③ FIB 立刻改</text>
<text class="s" x="36" y="260">最直接的证据</text>
<text class="m" x="196" y="246">show cef 10.1.1.0/24</text>
<text class="g" x="640" y="246">via 备份 PE4</text>

<rect class="b1" x="20" y="284" width="860" height="60" rx="8"/>
<text class="t" x="36" y="308">④ 业务侧测量</text>
<text class="s" x="36" y="328">切换时间多少</text>
<text class="m" x="196" y="314">ping 10.1.1.1 count 1000 interval 10</text>
<text class="g" x="640" y="314">100%，max RTT 6 ms</text>

<rect class="b2" x="20" y="356" width="860" height="30" rx="8"/>
<text class="s" x="36" y="376">第 ③ 步是最硬的证据：不用等 BGP 的 70 秒，FIB 已经指向备份 —— 说明整条信息链通了</text>

<rect class="b3" x="20" y="392" width="860" height="32" rx="8"/>
<text class="s" x="36" y="413">若 ③ 不动：先看 ②，再看 ①；若 ② 没有：说明该明细未被认定为「被汇总覆盖」，回到汇总配置</text>
</svg>
