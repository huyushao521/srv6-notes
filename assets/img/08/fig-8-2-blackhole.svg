<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="故障形态：BGP 会话正常、下一跳可达、汇总路由在表中，四项协议状态全部为绿，但报文沿核心到 PE3 后命中 Null0 被静默丢弃，持续几十秒到几分钟且没有任何告警">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5" fill="#c0392b"/></marker></defs>
<rect class="bg" width="900" height="400"/>
<text class="h" x="20" y="26">8.1 故障长什么样：四项协议状态全绿，业务却是断的</text>

<text class="s" x="20" y="56">监控面板上看到的</text>
<rect class="b2" x="20" y="66" width="410" height="38" rx="6"/>
<text class="g" x="36" y="90">✔ BGP 会话 up（Established，无 flap）</text>
<rect class="b2" x="20" y="112" width="410" height="38" rx="6"/>
<text class="g" x="36" y="136">✔ 下一跳可达（IGP 里前缀在）</text>
<rect class="b2" x="20" y="158" width="410" height="38" rx="6"/>
<text class="g" x="36" y="182">✔ 汇总路由在表中（10.1.0.0/16）</text>
<rect class="b2" x="20" y="204" width="410" height="38" rx="6"/>
<text class="g" x="36" y="228">✔ 路由条目数没有减少</text>
<text class="r" x="20" y="266">四项全绿 → 告警系统什么都不报</text>

<rect class="b" x="470" y="66" width="410" height="176" rx="10"/>
<text class="t" x="486" y="90">数据面实际发生的事</text>
<rect class="b1" x="486" y="102" width="120" height="34" rx="6"/>
<text class="m" x="500" y="124">ABR</text>
<rect class="b3" x="486" y="152" width="120" height="34" rx="6"/>
<text class="m" x="500" y="174">PE3</text>
<rect class="b4" x="486" y="202" width="120" height="34" rx="6"/>
<text class="m" x="500" y="224">Null0</text>
<path class="ar" d="M606 119 L680 119 L680 169" marker-end="url(#a)"/>
<path class="ar" d="M606 169 L680 169 L680 219" marker-end="url(#ar)"/>
<text class="r" x="692" y="176">丢</text>
<text class="s" x="692" y="196">无回执</text>
<text class="s" x="692" y="120">照常转发</text>
<text class="s" x="486" y="254">报文走了三跳、每一步都"合规"，最后一步被静默丢弃</text>

<rect class="b1" x="20" y="288" width="860" height="46" rx="8"/>
<text class="t" x="36" y="310">这就是本章最贵的一种故障</text>
<text class="s" x="36" y="330">只有数据面知道，而它的表达方式就是丢包 —— 持续几分钟、无告警，业务侧只能看到"卡住/video 花屏"</text>

<rect class="b3" x="20" y="340" width="860" height="46" rx="8"/>
<text class="s" x="36" y="362">注意：这个故障不是"配错了"，而是"配对了两个功能，它们的组合有洞"</text>
<text class="s" x="36" y="382">两个协议各自都工作正常，坏的是它们之间那条没有定义的信息通路</text>
</svg>
