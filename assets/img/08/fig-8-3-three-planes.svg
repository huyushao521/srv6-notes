<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 458" width="900" height="458" role="img" aria-label="三个平面各说各话：数据面看到明细下一跳消失只能丢包，PE3 的 BGP 认为汇总未变不发更新，ABR 的 BGP 只有汇总因此不切备份，IGP 完全沉默，四条信息拼起来就是那道黑缝">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<rect class="bg" width="900" height="458"/>
<text class="h" x="20" y="26">8.1.1 三方各说各话：把四个"认知"并排，黑缝就露出来了</text>

<text class="s" x="36" y="60">平面</text>
<text class="s" x="250" y="60">它看到的事实</text>
<text class="s" x="660" y="60">它的结论</text>
<path class="ar" d="M20 70 L880 70" opacity="0.5"/>

<rect class="b4" x="20" y="80" width="860" height="62" rx="8"/>
<text class="t" x="36" y="104">数据面（PE3 转发）</text>
<text class="s" x="36" y="124">唯一知道真相的一方</text>
<text class="m" x="250" y="112">10.1.1.0/24 的下一跳没了</text>
<text class="r" x="660" y="112">命中汇总的 Null0 → 丢包</text>

<rect class="b3" x="20" y="150" width="860" height="62" rx="8"/>
<text class="t" x="36" y="174">BGP（PE3 的 RIB）</text>
<text class="s" x="36" y="194">故障的发生地</text>
<text class="m" x="250" y="182">汇总 10.1.0.0/16 仍由我发起</text>
<text class="o" x="660" y="182">没有变化 → 不发 update</text>

<rect class="b3" x="20" y="220" width="860" height="62" rx="8"/>
<text class="t" x="36" y="244">BGP（ABR 的 RIB）</text>
<text class="s" x="36" y="264">被蒙在鼓里的一方</text>
<text class="m" x="250" y="252">只有汇总，明细根本不在表里</text>
<text class="o" x="660" y="252">主路径仍有效 → 不切备份</text>

<rect class="b" x="20" y="290" width="860" height="62" rx="8"/>
<text class="t" x="36" y="314">IGP</text>
<text class="s" x="36" y="334">本该送信的一方</text>
<text class="m" x="250" y="322">明细是 BGP 前缀，不在我这儿</text>
<text class="s" x="660" y="322">完全沉默</text>

<rect class="b1" x="20" y="364" width="860" height="50" rx="8"/>
<text class="t" x="36" y="386">链条断在"信息本该传递的那一点"</text>
<text class="s" x="36" y="406">失效的是 BGP 前缀 → IGP 看不见；掩盖它的是 BGP 汇总 → 汇总不受影响。两个协议都没错，组合错了</text>

<rect class="b3" x="20" y="422" width="860" height="30" rx="8"/>
<text class="s" x="36" y="442">自愈只是因为"等到了"：BGP 超时 / 扫描周期 / IGP 重收敛，约 70 秒 —— 不是保护机制在起作用</text>
</svg>
