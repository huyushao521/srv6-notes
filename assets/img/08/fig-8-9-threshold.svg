<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 408" width="900" height="408" role="img" aria-label="分量失效数与动作的对应关系：少量失效发单条 UPA，中等规模分批发送每次不超过五十条，超过五百条改为撤销汇总通告交给 BGP 重新算路">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="408"/>
<text class="h" x="20" y="26">8.4 阈值：把「精准通知」和「批量通知」分开</text>

<path class="ar" d="M60 130 L870 130" marker-end="url(#a)"/>
<text class="s" x="60" y="118">同时失效的分量数 N</text>
<text class="m" x="56" y="152">0</text>
<text class="m" x="292" y="152">50</text>
<text class="m" x="590" y="152">500</text>
<text class="m" x="838" y="152">∞</text>

<rect class="b2" x="60" y="160" width="236" height="112" rx="8"/>
<text class="t" x="76" y="184">N ≤ 50</text>
<text class="s" x="76" y="206">逐条发 UPA</text>
<text class="m" x="76" y="228">max-prefix-per-update 50</text>
<text class="g" x="76" y="254">毫秒级精准切换，IGP 无感</text>

<rect class="b3" x="300" y="160" width="292" height="112" rx="8"/>
<text class="t" x="316" y="184">50 &lt; N ≤ 500</text>
<text class="s" x="316" y="206">分批发送，每批不超过 50 条</text>
<text class="s" x="316" y="228">LSP 分片可控</text>
<text class="o" x="316" y="254">仍有开销，但不会压垮 SPF</text>

<rect class="b4" x="596" y="160" width="264" height="112" rx="8"/>
<text class="t" x="612" y="184">N &gt; 500</text>
<text class="s" x="612" y="206">不再发 UPA，改为撤销汇总</text>
<text class="m" x="612" y="228">suppress-above 500</text>
<text class="r" x="612" y="254">交给 BGP 重算 —— 整机故障就该 BGP 看见</text>

<rect class="b" x="20" y="290" width="420" height="76" rx="8"/>
<text class="t" x="36" y="314">阈值的设计逻辑</text>
<text class="s" x="36" y="336">少量失效：UPA 精准通知，业务毫秒级切</text>
<text class="s" x="36" y="356">大面积失效：撤汇总让 BGP 重新算，别让 IGP 背锅</text>

<rect class="b4" x="460" y="290" width="420" height="76" rx="8"/>
<text class="t" x="476" y="314">两者混用的后果（案例 B）</text>
<text class="s" x="476" y="336">8000 条 UPA 一起泛洪 → LSP 1.2 KB 涨到 3.8 MB</text>
<text class="r" x="476" y="356">核心 CPU 打满 40 秒，比原故障更严重</text>

<rect class="b1" x="20" y="376" width="860" height="30" rx="8"/>
<text class="s" x="36" y="396">一句话：UPA 是精准通知机制，不是批量通知机制；整机级故障必须交给 BGP</text>
</svg>
