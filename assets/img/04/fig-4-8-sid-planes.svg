<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-label="同一节点上的三套 SID 平面：Algo(0)、Flex-Algo(128)、Flex-Algo(129) 各有一个 uN 与一组 uA">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b{fill:#1b2029;stroke:#39414f}.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.o{fill:#ecc94b}}
</style>
<rect class="bg" width="900" height="424"/>
<text class="h" x="24" y="26">一台节点的三套 SID 平面：三个算法并行，各有一套 uN 与 uA</text>

<rect class="b1" x="24" y="44" width="852" height="74" rx="8"/>
<text class="t" x="40" y="70">Algo(0) 平面　fc00:0:3::/48　代价最优　alg 0</text>
<text class="m" x="40" y="98">uN  fc00:0:3::          uA  fc00:0:3:e000:: / e001 / e002   Context 尾标 :0</text>

<rect class="b2" x="24" y="126" width="852" height="74" rx="8"/>
<text class="t" x="40" y="152">Flex-Algo(128) 平面　fc00:1:3::/48　时延最优　alg 128</text>
<text class="m" x="40" y="180">uN  fc00:1:3::          uA  fc00:1:3:e000:: / e001 / e002   Context 尾标 :128</text>

<rect class="b3" x="24" y="208" width="852" height="74" rx="8"/>
<text class="t" x="40" y="234">Flex-Algo(129) 平面　fc00:2:3::/48　排除 RED　alg 129</text>
<text class="m" x="40" y="262">uN  fc00:2:3::          uA  fc00:2:3:e000:: / e001 / e002   Context 尾标 :129</text>

<rect class="b" x="24" y="294" width="420" height="114" rx="8"/>
<text class="t" x="40" y="318">两个进程、两次触发</text>
<text class="s" x="40" y="342">sidmgr：配 locator + algorithm → 生成 uN</text>
<text class="s" x="40" y="364">isis-1：配 locator + 参与算法 → 生成 uA</text>
<text class="o" x="40" y="388">只做第一步：有 uN 没 uA（例 4.3）</text>

<rect class="b" x="456" y="294" width="420" height="114" rx="8"/>
<text class="t" x="472" y="318">规模账（4 接口 × 3 算法）</text>
<text class="m" x="472" y="342">3 uN + 12 uA = 15 个段</text>
<text class="m" x="472" y="366">却只占 3 条 IGP 路由（3 个 /48）</text>
<text class="s" x="472" y="390">段数 ×3，转发表项 ×3，前缀只 ×3 条</text>
</svg>
