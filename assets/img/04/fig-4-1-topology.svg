<text class="t" x="666" y="146">怎么读这张图</text>
<text class="s" x="666" y="172">每条链路：IGP 度量 / 时延</text>
<text class="s" x="666" y="196">1-2：度量 40，时延仅 6ms</text>
<text class="s" x="666" y="220">→ 代价最优与时延最优分道</text>
<text class="s" x="666" y="246">5-3：RED 亲和链路</text>
<text class="s" x="666" y="270">→ 129 / 130 两个算法都排除它</text>
<text class="s" x="666" y="296">所有链路度量 10 或 20，唯 1-2 是 40</text>

<rect class="b" x="24" y="424" width="852" height="96" rx="8"/>
<text class="t" x="40" y="448">三条关键路径（后面所有图与算例都基于它）</text>
<text class="m" x="40" y="476">Algo(0)         1→6→5→3        代价 30，时延 15 ms</text>
<text class="m" x="40" y="498">Flex-Algo(128)  1→2→3          时延 10 ms（度量 50）</text>
<text class="m" x="40" y="520">Flex-Algo(129)  1→6→5→4→3      代价 40（避开 RED）</text>
