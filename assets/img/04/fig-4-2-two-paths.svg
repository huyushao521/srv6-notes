<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" width="900" height="468" role="img" aria-label="同一拓扑上 Algo(0) 走低代价路径 1-6-5-3，Flex-Algo(128) 走低时延路径 1-2-3，靠两个 locator 区分">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b{fill:#1b2029;stroke:#39414f}.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.o{fill:#ecc94b}}
</style>
<rect class="bg" width="900" height="468"/>
<text class="h" x="24" y="26">两条最短路径：Algo(0) 省度量，Flex-Algo(128) 省时延</text>

<rect class="b1" x="24" y="44" width="852" height="122" rx="8"/>
<text class="t" x="40" y="70">① Algo(0)：最小化 IGP 度量 → 1 → 6 → 5 → 3，累计代价 30</text>
<text class="m" x="56" y="106">R1 ──10── R6 ──10── R5 ──10── R3</text>
<text class="s" x="56" y="134">5-3 这段时延 12ms，整条路 1 + 2 + 12 = 15ms：度量最优，时延最差</text>

<rect class="b2" x="24" y="180" width="852" height="114" rx="8"/>
<text class="t" x="40" y="206">② Flex-Algo(128)：最小化链路时延 → 1 → 2 → 3，累计时延 10ms</text>
<text class="m" x="56" y="240">R1 ──6ms── R2 ──4ms── R3</text>
<text class="s" x="56" y="268">IGP 度量 40 + 10 = 50，度量上更贵；时延上无可替代</text>

<rect class="b" x="24" y="308" width="852" height="140" rx="8"/>
<text class="t" x="40" y="334">同一个节点 3，两个 locator，两条路径同时存在：</text>
<text class="m" x="40" y="364">fc00:0:3::/48    Algorithm 0      → 走 ①，代价 30</text>
<text class="m" x="40" y="390">fc00:1:3::/48    Flex-Algo 128    → 走 ②，时延 10ms</text>
<text class="s" x="40" y="420">目的 SID 一变，路径就变：全程一个 SID，不需要段列表，不需要控制器</text>
<text class="o" x="40" y="440">算法绑在 locator 上，不绑在段上 —— 同一 locator 下所有段共用这条路径</text>
</svg>
