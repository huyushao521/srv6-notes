<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" width="900" height="442" role="img" aria-label="uSID 下的 L3VPN 封装：只压一个 IPv6 头，DA 内嵌 locator 与 uDT46，不压 SRH">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 11.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.pay{fill:#dbe7f6;stroke:#5b7fa6;stroke-width:1}.ov{fill:#f6c9a8;stroke:#b7791f;stroke-width:1}
.ar{stroke:#9aa4b2;stroke-width:1.8;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.pay{fill:#1e3350;stroke:#4a7ab0}.ov{fill:#4a3417;stroke:#ecc94b}.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="442"/>
<text class="h" x="20" y="26">6.5：整个 L3VPN 业务只要一条指令 —— 不压 SRH、不前置 uN（原书 Figure 6.3 重绘）</text>

<text class="s" x="20" y="52">① PE-1 收到的客户报文</text>
<rect class="b" x="20" y="58" width="240" height="120" rx="8"/>
<rect class="pay" x="32" y="80" width="216" height="36" rx="4"/>
<text class="s" x="42" y="96">IPv4 头</text><text class="m" x="42" y="110">10.1.1.1 → 10.1.2.1</text>
<rect class="pay" x="32" y="124" width="216" height="36" rx="4"/>
<text class="s" x="42" y="148">客户载荷</text>

<path class="ar" d="M262 118 L278 118" marker-end="url(#a)"/>

<text class="s" x="282" y="52">② PE-1 压入外层：恰好一个 IPv6 头</text>
<rect class="b1" x="280" y="58" width="360" height="170" rx="8"/>
<rect class="ov" x="292" y="74" width="336" height="80" rx="4"/>
<text class="m" x="302" y="92">SA  = fdbb:bb00:0001:e000::</text>
<text class="s" x="302" y="108">（PE-1 的 uN，仅本机有效）</text>
<text class="m" x="302" y="128">DA  = fdbb:bb00:0002:e001::</text>
<text class="s" x="302" y="144">locator → PE-2　function uDT46 → VRF-100</text>
<text class="s" x="302" y="166">Next Header = 4（直接指向内层 IPv4）</text>
<rect class="pay" x="292" y="176" width="336" height="32" rx="4"/>
<text class="s" x="302" y="197">内层 IPv4 头 + 客户载荷</text>
<text class="r" x="298" y="222">无 SRH · 无段列表 · 表项只多一个 DA</text>

<path class="ar" d="M642 118 L658 118" marker-end="url(#a)"/>

<text class="s" x="662" y="52">③ PE-2 解封装</text>
<rect class="b2" x="660" y="58" width="220" height="120" rx="8"/>
<rect class="pay" x="672" y="80" width="196" height="36" rx="4"/>
<text class="s" x="682" y="96">IPv4 头（原样恢复）</text><text class="m" x="682" y="110">10.1.1.1 → 10.1.2.1</text>
<rect class="pay" x="672" y="124" width="196" height="36" rx="4"/>
<text class="s" x="682" y="148">客户载荷</text>
<text class="g" x="672" y="172">→ 查 VRF-100，出 CE-2</text>

<rect class="b1" x="20" y="248" width="420" height="96" rx="8"/>
<text class="t" x="36" y="272">中间两跳看到的东西</text>
<text class="s" x="36" y="294">对 DA 做最长前缀匹配，命中的是 fdbb:bb00:0002::/48</text>
<text class="s" x="36" y="314">没有 VPN 路由、没有 VRF、没有标签、没有 SRH 可处理</text>
<text class="m" x="36" y="334">show cef vrf → 应为空</text>

<rect class="b2" x="460" y="248" width="420" height="96" rx="8"/>
<text class="t" x="476" y="272">出口的数据面成本</text>
<text class="s" x="476" y="294">一次 SID 查表（命中本地 uDT46）→ 剥外层</text>
<text class="s" x="476" y="314">一次 VRF 查表（内层 IPv4 → CE-2 方向）</text>
<text class="g" x="476" y="334">两次查表，与 MPLS 的"弹栈 + 查 VRF"等价</text>

<rect class="b3" x="20" y="356" width="860" height="74" rx="8"/>
<text class="t" x="36" y="380">三个"没有"是本节的结论：不压 SRH、不前置 uN、封装恰好一个头。它们成立的唯一前提是 locator 后 16 bit 足够装下 uDT46。</text>
<text class="s" x="36" y="402">一旦需要串多条微指令（例如叠加 TE 与业务），就要引入 SRH，封装回到 180 B 以上，本节的所有"省"都不再成立。</text>
<text class="s" x="36" y="422">对照 MPLS：那边是"弹两层栈 + 查 VRF"，这边是"删一个头 + 查两次表"，成本同量级，差别在状态与协议。</text>
</svg>
