<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="两层标签塌缩成一个地址：MPLS 用 transport 与 VPN 两个标签，SRv6 用同一个 SID 同时承担可路由与标识 VRF 的职责">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 11.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#0b6bcb;stroke-width:2.4;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#58a6ff}}
</style>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="#0b6bcb"/></marker></defs>
<rect class="bg" width="900" height="430"/>
<text class="h" x="20" y="26">6.1 的核心对比：两个标签 vs 一个地址 —— 塌缩掉的是分发与状态，不是字节</text>

<text class="t" x="40" y="58">MPLS L3VPN：两个标签各管一件事</text>
<rect class="b3" x="40" y="70" width="330" height="46" rx="6"/>
<text class="m" x="54" y="90">外层 transport 标签</text><text class="s" x="54" y="108">把报文送到 PE-2（标签栈顶）</text>
<rect class="b4" x="40" y="120" width="330" height="46" rx="6"/>
<text class="m" x="54" y="140">内层 VPN 标签</text><text class="s" x="54" y="158">PE-2 上唯一标识 VRF-100（本地有效）</text>
<rect class="b" x="40" y="170" width="330" height="38" rx="6"/>
<text class="s" x="54" y="194">内层 IPv4 报文（10.1.1.1 → 10.1.2.1）</text>
<text class="m" x="40" y="228">8 B 开销 · 需 LDP/3107 分发 · 需 SRGB 规划</text>

<path class="ar" d="M392 132 L470 132" marker-end="url(#ar)"/>
<text class="o" x="384" y="112">塌缩</text>
<text class="s" x="372" y="162">两个职责</text>
<text class="s" x="372" y="180">合为一体</text>

<text class="t" x="500" y="58">SRv6：一个 SID 同时做这两件事</text>
<rect class="b2" x="500" y="70" width="380" height="76" rx="6"/>
<text class="m" x="514" y="90">外层 IPv6 头（40 B）</text>
<text class="m" x="514" y="110">DA = fdbb:bb00:0002:e001::</text>
<text class="s" x="514" y="130">locator 部分可路由 → 送到 PE-2；function = uDT46 → VRF-100</text>
<rect class="b" x="500" y="150" width="380" height="38" rx="6"/>
<text class="s" x="514" y="174">内层 IPv4 报文（10.1.1.1 → 10.1.2.1）</text>
<text class="m" x="500" y="210">40 B 开销 · 无标签分发 · 无 SRGB</text>
<text class="g" x="500" y="230">→ 核心只剩 locator 路由</text>

<rect class="b1" x="20" y="250" width="420" height="82" rx="8"/>
<text class="t" x="36" y="274">因此少掉的三样东西</text>
<text class="s" x="36" y="296">标签分发协议（LDP / BGP 3107 在 VPN 段）</text>
<text class="s" x="36" y="316">标签绑定表与标签冲突排查</text>
<text class="r" x="36" y="334">注意：只减协议与状态，字节反而多了 32 B</text>

<rect class="b3" x="460" y="250" width="420" height="82" rx="8"/>
<text class="t" x="476" y="274">没有塌缩掉的两样东西</text>
<text class="s" x="476" y="296">RD / RT / RR 全保留 —— 控制面一行代码都不用改</text>
<text class="s" x="476" y="316">出口仍要做一次"按 VRF 查表"，只是查表键从标签换成 DA</text>
<text class="o" x="476" y="334">→ 迁移成本低，但 MTU 与下一跳是新账</text>

<rect class="b" x="20" y="348" width="860" height="62" rx="8"/>
<text class="t" x="36" y="372">一句话：MPLS 用两个标签分工（外层"送到哪台 PE"、内层"进哪个 VRF"）；SRv6 把这个分工取消，改由一个可路由地址顺序完成。</text>
<text class="s" x="36" y="394">这也解释了为什么第 6.4.1 节那个坑如此致命 —— 地址必须可路由，而"可路由"的前提是外层是 IPv6、下一跳也是 IPv6。</text>
</svg>
