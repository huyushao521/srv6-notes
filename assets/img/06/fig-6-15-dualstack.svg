<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 414" width="900" height="414" role="img" aria-label="双栈 VRF 的两种做法：一个 DT46 按内层版本选表，或 DT4 与 DT6 两个 SID 分别控制">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 11.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="414"/>
<text class="h" x="20" y="26">6.7 双栈 VRF：一个 SID 按内层版本选表，还是两个 SID 各自控制</text>

<rect class="b2" x="20" y="44" width="420" height="150" rx="8"/>
<text class="t" x="36" y="68">做法一：一个 uDT46</text>
<rect class="b" x="36" y="80" width="180" height="44" rx="6"/>
<text class="m" x="48" y="98">…:e001::</text><text class="s" x="48" y="116">uDT46（一个 SID）</text>
<text class="s" x="240" y="98">内层 v4 → 查 v4 表</text>
<text class="s" x="240" y="118">内层 v6 → 查 v6 表</text>
<text class="g" x="36" y="150">SID 消耗 1 · 运维最简 · 双栈透明</text>
<text class="s" x="36" y="172">BGP 只通告一条 Prefix-SID</text>

<rect class="b3" x="460" y="44" width="420" height="150" rx="8"/>
<text class="t" x="476" y="68">做法二：DT4 与 DT6 两个 SID</text>
<rect class="b" x="476" y="80" width="170" height="32" rx="6"/>
<text class="m" x="486" y="101">…:e001::  uDT4</text>
<rect class="b" x="476" y="118" width="170" height="32" rx="6"/>
<text class="m" x="486" y="139">…:e002::  uDT6</text>
<text class="s" x="660" y="101">v4 走自己的 SID</text>
<text class="s" x="660" y="139">v6 走自己的 SID</text>
<text class="o" x="476" y="170">SID 消耗 2 · 可分别做策略与统计</text>
<text class="s" x="476" y="190">适合两类流量要分开治理的场景</text>

<rect class="b" x="20" y="206" width="420" height="94" rx="8"/>
<text class="t" x="36" y="230">什么时候必须拆成两个</text>
<text class="s" x="36" y="252">v4 与 v6 走不同出口（v6 走独立承载网）</text>
<text class="s" x="36" y="272">需要分别统计、分别限速、分别做安全策略</text>
<text class="r" x="36" y="292">拆分后入口必须按内层版本选 SID，配错一侧就单栈不通</text>

<rect class="b" x="460" y="206" width="420" height="94" rx="8"/>
<text class="t" x="476" y="230">拆成两个之后要守的规则</text>
<text class="s" x="476" y="252">每个 VPN 前缀只通告它自己那个版本的 Prefix-SID</text>
<text class="s" x="476" y="272">入口按内层 AFI 查对应的 SID，不能"就近挑一个"</text>
<text class="g" x="476" y="292">→ 判据：show bgp 里 v4 与 v6 前缀的 SID 必须不同</text>

<rect class="b3" x="20" y="312" width="860" height="82" rx="8"/>
<text class="t" x="36" y="336">默认建议：先上 uDT46（一个 SID 解决双栈），只有当"两类流量必须分开治理"才拆成 DT4 + DT6。</text>
<text class="s" x="36" y="358">注意 DT46 的"按内层版本选表"是数据面行为，不改变控制面：一条 Prefix-SID 同时服务两种前缀，BGP 侧看不到任何区别。</text>
<text class="s" x="36" y="380">反过来说，一旦拆成两个 SID，双栈就变成了两份独立配置，漏一条就是"半边不通"，排障时容易误判为 VRF 缺路由。</text>
</svg>
