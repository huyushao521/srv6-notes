<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="L3VPN 六步定位法：路由、下一跳、Prefix-SID、locator 可达、SID 命中计数、MTU">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 11.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.n{fill:#fff;font:700 13px 'Microsoft YaHei',system-ui,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}}
</style>
<rect class="bg" width="900" height="480"/>
<text class="h" x="20" y="26">6.9 六步定位法：每一步一个判据，右侧写清"跳到哪"与"归哪一节"</text>

<rect class="b1" x="20" y="40" width="860" height="64" rx="8"/>
<circle cx="46" cy="72" r="13" fill="#0b6bcb"/><text class="n" x="42" y="77">1</text>
<text class="t" x="72" y="62">BGP 里有这条 VPN 路由吗？</text>
<text class="m" x="72" y="86">show bgp vpnv4 unicast rd &lt;RD&gt; &lt;prefix&gt;</text>
<text class="r" x="470" y="62">无 → RT 导入导出 / RR / 会话，与 SRv6 无关，先修 BGP</text>
<text class="g" x="470" y="86">有 → 第 2 步</text>

<rect class="b" x="20" y="110" width="860" height="64" rx="8"/>
<circle cx="46" cy="142" r="13" fill="#57606a"/><text class="n" x="42" y="147">2</text>
<text class="t" x="72" y="132">下一跳是 IPv6 吗？</text>
<text class="m" x="72" y="156">show bgp vpnv4 unicast rd &lt;RD&gt; &lt;prefix&gt;</text>
<text class="r" x="470" y="132">IPv4 → RFC 8950 未启用，封装出不来（6.4.1）</text>
<text class="g" x="470" y="156">IPv6 → 第 3 步</text>

<rect class="b1" x="20" y="180" width="860" height="64" rx="8"/>
<circle cx="46" cy="212" r="13" fill="#0b6bcb"/><text class="n" x="42" y="217">3</text>
<text class="t" x="72" y="202">Prefix-SID 属性在吗？</text>
<text class="m" x="72" y="226">… detail | include Prefix-SID</text>
<text class="r" x="470" y="202">无 → 出口 PE 没分配 SID（6.3 的 alloc mode / VRF 未配）</text>
<text class="g" x="470" y="226">有 → 第 4 步</text>

<rect class="b" x="20" y="250" width="860" height="64" rx="8"/>
<circle cx="46" cy="282" r="13" fill="#57606a"/><text class="n" x="42" y="287">4</text>
<text class="t" x="72" y="272">locator 在入口的 IGP 表里吗？</text>
<text class="m" x="72" y="296">show isis route &lt;远端 locator&gt;</text>
<text class="r" x="470" y="272">无 → 第 5 章的事：泄露 / 重分发 / 汇总</text>
<text class="g" x="470" y="296">有 → 第 5 步</text>

<rect class="b1" x="20" y="320" width="860" height="64" rx="8"/>
<circle cx="46" cy="352" r="13" fill="#0b6bcb"/><text class="n" x="42" y="357">5</text>
<text class="t" x="72" y="342">报文到了出口 PE 吗？SID 命中了吗？</text>
<text class="m" x="72" y="366">show segment-routing srv6 sid &lt;SID&gt; detail（看 Packets）</text>
<text class="r" x="470" y="342">计数不涨 → 报文没到（IGP 转发，回第 4 步）</text>
<text class="r" x="470" y="366">涨但不通 → 命中后查表失败（VRF 缺路由 / 缺 CE 明细）</text>

<rect class="b" x="20" y="390" width="860" height="64" rx="8"/>
<circle cx="46" cy="422" r="13" fill="#57606a"/><text class="n" x="42" y="427">6</text>
<text class="t" x="72" y="412">大包通不通？</text>
<text class="m" x="72" y="436">ping vrf &lt;vrf&gt; &lt;CE 地址&gt; size 1472</text>
<text class="r" x="470" y="412">大包丢 → MTU（6.8）</text>
<text class="g" x="470" y="436">通 → 客户侧策略（ACL / NAT / QoS）</text>

</svg>
