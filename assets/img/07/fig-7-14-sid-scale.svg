<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-label="规模对比：E-Line 按每条接入电路消耗 SID，规模可达数十万，远高于按 VRF 或 EVI 分配的三层业务，因此用 32 位 Wide uSID 直接编码接入电路编号">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<rect class="bg" width="900" height="424"/>
<text class="h" x="20" y="26">7.5 二层为什么更吃 SID：业务实例的粒度比 VRF 细一个数量级</text>

<text class="s" x="20" y="60">实例数（对数示意）</text>
<rect class="b1" x="20" y="72" width="120" height="34" rx="6"/>
<text class="s" x="32" y="94">L3VPN / VRF</text>
<rect class="b1" x="140" y="72" width="150" height="34" rx="0"/>
<text class="m" x="148" y="94">数千</text>

<rect class="b1" x="20" y="118" width="120" height="34" rx="6"/>
<text class="s" x="32" y="140">E-LAN / EVI</text>
<rect class="b1" x="140" y="118" width="190" height="34" rx="0"/>
<text class="m" x="148" y="140">数百 – 数千</text>

<rect class="b3" x="20" y="164" width="120" height="34" rx="6"/>
<text class="s" x="32" y="186">E-Line / AC</text>
<rect class="b3" x="140" y="164" width="380" height="34" rx="0"/>
<text class="r" x="148" y="186">数万 – 数十万（每条电路一个 SID）</text>

<rect class="b2" x="20" y="210" width="120" height="34" rx="6"/>
<text class="s" x="32" y="232">多归 / ES</text>
<rect class="b2" x="140" y="210" width="160" height="34" rx="0"/>
<text class="m" x="148" y="232">数百（anycast 复用）</text>

<rect class="b" x="20" y="262" width="460" height="86" rx="8"/>
<text class="t" x="36" y="286">结论</text>
<text class="s" x="36" y="308">三层是"一台 PE 上几十个 VRF"，二层是"一台 PE 上几千条 AC"</text>
<text class="s" x="36" y="330">所以二层必须回答"每个业务实例怎么省 SID"，而不是"怎么多分 locator"</text>

<rect class="b3" x="500" y="72" width="380" height="196" rx="10"/>
<text class="t" x="516" y="96">32 bit Wide uSID 的取舍</text>
<rect class="b1" x="516" y="110" width="130" height="34" rx="4"/>
<text class="s" x="530" y="132">Locator 48</text>
<rect class="b3" x="646" y="110" width="130" height="34" rx="4"/>
<text class="s" x="656" y="132">Argument 32</text>
<rect class="b" x="776" y="110" width="88" height="34" rx="4"/>
<text class="s" x="788" y="132">Function</text>
<text class="s" x="516" y="166">Arg 32 bit ≈ 40 亿个值 → 可直接编 AC 号</text>
<text class="g" x="516" y="190">换来的：一条通告 SID 覆盖全部 E-Line</text>
<text class="r" x="516" y="214">代价：一个 128 bit 地址能装的微指令变少</text>
<text class="s" x="516" y="238">但 L2VPN 不需要段列表 → 这个代价不痛</text>
<text class="m" x="516" y="258">牺牲段列表深度，换业务实例空间</text>

<rect class="b1" x="20" y="360" width="860" height="52" rx="8"/>
<text class="t" x="36" y="384">尺度对照</text>
<text class="s" x="36" y="404">同一条 /48 下，16 bit 容器只有 65,536 个 function；E-Line 动辄十万条 AC，必须用 Arg 或 Wide uSID 兜住</text>
</svg>
