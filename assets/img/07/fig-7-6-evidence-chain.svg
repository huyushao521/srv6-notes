<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" width="900" height="406" role="img" aria-label="EVPN 排障证据链：先有 Type 3 才能泛洪，再有 Type 2 才能学 MAC，最后有 Type 1 才有多归别名与备份">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="406"/>
<text class="h" x="20" y="26">7.2 证据链：三类路由按顺序成立，缺一环的现象各不相同</text>

<rect class="b1" x="20" y="44" width="250" height="96" rx="10"/>
<text class="t" x="36" y="70">① Type 3（IMET）</text>
<text class="s" x="36" y="92">带来 uDT2M SID</text>
<text class="s" x="36" y="112">建立泛洪复制列表</text>
<text class="g" x="36" y="132">作用：广播 / 未知单播能出去</text>

<path class="ar" d="M272 92 L312 92" marker-end="url(#a)"/>

<rect class="b1" x="314" y="44" width="250" height="96" rx="10"/>
<text class="t" x="330" y="70">② Type 2（MAC/IP）</text>
<text class="s" x="330" y="92">带来目的 PE 的 L2 SID</text>
<text class="s" x="330" y="112">MAC 才学进本地 BD</text>
<text class="g" x="330" y="132">作用：已知单播走定向路径</text>

<path class="ar" d="M566 92 L606 92" marker-end="url(#a)"/>

<rect class="b1" x="608" y="44" width="272" height="96" rx="10"/>
<text class="t" x="624" y="70">③ Type 1（A-D）</text>
<text class="s" x="624" y="92">带来 per-EVI / per-ES SID</text>
<text class="s" x="624" y="112">别名 + 备份路径</text>
<text class="g" x="624" y="132">作用：PE 故障不断业务</text>

<text class="s" x="36" y="172">缺 ① 的现象</text>
<text class="r" x="36" y="192">广播与未知单播全不通，</text>
<text class="r" x="36" y="212">且 MAC 永远学不到（单播也废）</text>
<text class="m" x="36" y="234">查：EVPN 邻居 up？EVI 下配了 srv6？</text>

<text class="s" x="330" y="172">缺 ② 的现象</text>
<text class="r" x="330" y="192">全部流量绕行泛洪，时通时不通，</text>
<text class="r" x="330" y="212">BD 里只有本地 MAC</text>
<text class="m" x="330" y="234">查：SID 是否分配、下一跳是否 IPv6</text>

<text class="s" x="624" y="172">缺 ③ 的现象</text>
<text class="r" x="624" y="192">平时正常，一台 PE 挂掉即断，</text>
<text class="r" x="624" y="212">切换慢或无备份</text>
<text class="m" x="624" y="234">查：ESI 一致？ES to BGP 是否 Ready</text>

<rect class="b" x="20" y="252" width="860" height="60" rx="8"/>
<text class="t" x="36" y="276">排障顺序：自下而上（先 ① 后 ② 再 ③）</text>
<text class="s" x="36" y="298">因为 ② 的 MAC 学习依赖 ① 的泛洪路径；① 不通时去查 ② 的 MAC 表永远没有结论</text>

<rect class="b3" x="20" y="326" width="860" height="60" rx="8"/>
<text class="t" x="36" y="350">一条命令看全三类</text>
<text class="m" x="36" y="372">show evpn evi 100 detail　→　Remote Peers 下应同时出现 Route Type 1 / 2 / 3，且各带 SID 与 Behavior</text>
</svg>
