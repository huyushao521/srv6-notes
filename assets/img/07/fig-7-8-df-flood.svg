<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 434" width="900" height="434" role="img" aria-label="广播与组播必须只发一份：DF 选举让唯一一台 PE 转发到 ES，若把泛洪发到 anycast SID 则每台多归 PE 各转一份造成重复">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="434"/>
<text class="h" x="20" y="26">7.3 泛洪：anycast 解决了单播，却会毁掉广播 —— 所以要 DF</text>

<rect class="b2" x="20" y="44" width="418" height="230" rx="10"/>
<text class="t" x="36" y="68">正确：按 EVPN 复制列表发，只发给 DF</text>
<rect class="b" x="36" y="82" width="90" height="36" rx="6"/>
<text class="t" x="52" y="106">PE-2</text>
<rect class="b2" x="180" y="70" width="120" height="40" rx="6"/>
<text class="m" x="192" y="96">PE-1（DF）</text>
<rect class="b4" x="180" y="130" width="120" height="40" rx="6"/>
<text class="m" x="186" y="156">PE-3（非 DF）</text>
<rect class="b" x="336" y="86" width="90" height="40" rx="6"/>
<text class="s" x="346" y="112">ES / CE</text>
<path class="ar" d="M128 100 L176 92" marker-end="url(#a)"/>
<path class="ar" d="M302 90 L334 104" marker-end="url(#a)"/>
<path class="ar" d="M128 108 L176 148" marker-end="url(#a)"/>
<text class="g" x="310" y="132">✔ 转发</text>
<text class="r" x="306" y="170">✘ 丢弃</text>
<text class="s" x="36" y="204">DF 是"每个 ES 每个 VLAN 选一台"：非 DF 的 PE</text>
<text class="s" x="36" y="224">即使收到了泛洪副本，也不会送上本地 AC。</text>
<text class="g" x="36" y="252">结果：CE 侧只收到一份广播帧</text>

<rect class="b4" x="460" y="44" width="420" height="230" rx="10"/>
<text class="t" x="476" y="68">错误：把泛洪目的地址写成 anycast SID</text>
<rect class="b" x="476" y="82" width="90" height="36" rx="6"/>
<text class="t" x="492" y="106">PE-2</text>
<rect class="b4" x="620" y="70" width="120" height="40" rx="6"/>
<text class="m" x="632" y="96">PE-1</text>
<rect class="b4" x="620" y="130" width="120" height="40" rx="6"/>
<text class="m" x="632" y="156">PE-3</text>
<rect class="b4" x="778" y="86" width="88" height="40" rx="6"/>
<text class="s" x="788" y="112">CE-SW1</text>
<path class="ar" d="M568 100 L616 92" marker-end="url(#a)"/>
<path class="ar" d="M568 108 L616 148" marker-end="url(#a)"/>
<path class="ar" d="M742 90 L776 102" marker-end="url(#a)"/>
<path class="ar" d="M742 150 L776 118" marker-end="url(#a)"/>
<text class="r" x="700" y="132">两份</text>
<text class="r" x="760" y="132">都转发</text>
<text class="s" x="476" y="204">两台 PE 都认为"自己该发出去"，同一个广播帧</text>
<text class="s" x="476" y="224">在 ES 上出现两次 → 交换机 CPU 飙升（案例 B）。</text>
<text class="r" x="476" y="252">结果：帧被复制，且监控上看不出"丢包"</text>

<rect class="b1" x="20" y="290" width="860" height="60" rx="8"/>
<text class="t" x="36" y="314">一句话分工</text>
<text class="m" x="36" y="336">单播 → anycast SID（ECMP 自动分担）　　泛洪 → 各 PE 自己的 uDT2M（DF 保证只一份）</text>

<rect class="b3" x="20" y="362" width="860" height="56" rx="8"/>
<text class="s" x="36" y="384">所以泛洪用的 SID 一定不是 anycast：Type 3（IMET）里带的是每台 PE 各自唯一的 uDT2M</text>
<text class="s" x="36" y="406">如果某天发现"泛洪走了 anycast"，那不是配置技巧，是配置错误</text>
</svg>
