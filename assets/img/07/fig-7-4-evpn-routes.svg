<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" role="img" aria-label="EVPN 五类路由原样复用，只有标签字段被 SRv6 L2 Service TLV 取代，Type 4 完全不携带 SID">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<rect class="bg" width="900" height="428"/>
<text class="h" x="20" y="26">7.2 五类路由原样复用：换的只是"标签字段"</text>
<text class="s" x="20" y="46">列头：路由类型 ／ 用途 ／ 携带的 SRv6 信息 ／ 编码是否有变化</text>

<rect class="b1" x="20" y="58" width="140" height="52" rx="8"/>
<text class="m" x="32" y="80">Type 1</text>
<text class="s" x="32" y="98">Ethernet A-D</text>
<text class="s" x="180" y="80">别名 / 备份、分割 Horizon</text>
<text class="m" x="480" y="80">per-EVI / per-ES 的 uDX2</text>
<text class="m" x="480" y="98">或 uDT2U SID</text>
<rect class="b3" x="740" y="70" width="140" height="30" rx="15"/>
<text class="o" x="776" y="90">标签 → TLV</text>

<rect class="b1" x="20" y="124" width="140" height="52" rx="8"/>
<text class="m" x="32" y="146">Type 2</text>
<text class="s" x="32" y="164">MAC / IP</text>
<text class="s" x="180" y="146">MAC 学习、ARP / ND 代答</text>
<text class="m" x="480" y="146">目的 PE 的 L2 SID</text>
<text class="m" x="480" y="164">（承载 MAC 可达性）</text>
<rect class="b3" x="740" y="136" width="140" height="30" rx="15"/>
<text class="o" x="776" y="156">标签 → TLV</text>

<rect class="b1" x="20" y="190" width="140" height="52" rx="8"/>
<text class="m" x="32" y="212">Type 3</text>
<text class="s" x="32" y="230">IMET</text>
<text class="s" x="180" y="212">泛洪复制列表（未知单播 / 广播 / 组播）</text>
<text class="m" x="480" y="212">uDT2M SID</text>
<text class="m" x="480" y="230">（Arg 携带 BD）</text>
<rect class="b3" x="740" y="202" width="140" height="30" rx="15"/>
<text class="o" x="776" y="222">标签 → TLV</text>

<rect class="b2" x="20" y="256" width="140" height="52" rx="8"/>
<text class="m" x="32" y="278">Type 4</text>
<text class="s" x="32" y="296">ES Route</text>
<text class="s" x="180" y="278">多归发现、DF 选举</text>
<text class="m" x="480" y="278">无 SID</text>
<text class="m" x="480" y="296">（只与 ESI 相关）</text>
<rect class="b2" x="740" y="268" width="140" height="30" rx="15"/>
<text class="g" x="782" y="288">完全不变</text>

<rect class="b" x="20" y="322" width="140" height="52" rx="8"/>
<text class="m" x="32" y="344">Type 5</text>
<text class="s" x="32" y="362">IP Prefix</text>
<text class="s" x="180" y="344">可选：EVPN 承载三层业务</text>
<text class="m" x="480" y="344">同第 6 章的 L3 Service TLV</text>
<text class="s" x="480" y="362">（类型 5 才走这条路）</text>
<rect class="b3" x="740" y="334" width="140" height="30" rx="15"/>
<text class="o" x="776" y="354">标签 → TLV</text>

<rect class="b1" x="20" y="386" width="860" height="34" rx="8"/>
<text class="s" x="36" y="408">结论：控制面零改动 → EVPN 可以先在 MPLS/VXLAN 上跑稳，再单独把封装换成 SRv6（迁移期两套共存）</text>
</svg>
