<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" role="img" aria-label="三层与二层的转发语义对比：三层只有查表投递一种动作，二层有点对点送出、按 VLAN 查、未知泛洪、组播复制四种动作">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<rect class="bg" width="900" height="396"/>
<text class="h" x="20" y="26">7.1 为什么二层要多出一倍行为：动作种类不同，不是协议不同</text>

<rect class="b1" x="20" y="44" width="420" height="196" rx="10"/>
<text class="t" x="36" y="68">三层（第 6 章）：一种动作</text>
<rect class="b2" x="36" y="80" width="388" height="48" rx="8"/>
<text class="t" x="52" y="109">剥外层 → 按内层目的地址查 VRF 路由表 → 转发</text>
<text class="s" x="36" y="150">行为码虽然 5 个，语义只有一条：</text>
<text class="m" x="36" y="172">DT4 / DT6 / DT46（查 VRF）　DX4 / DX6（出指定口）</text>
<text class="s" x="36" y="196">→ 全都是"一对一投递"，不会复制，不会泛洪</text>
<text class="g" x="36" y="222">所以选型只看"要不要定向出接口"</text>

<rect class="b3" x="460" y="44" width="420" height="196" rx="10"/>
<text class="t" x="476" y="68">二层（本章）：四种动作</text>
<rect class="b" x="476" y="80" width="186" height="40" rx="8"/>
<text class="s" x="492" y="105">① 点对点送出（DX2）</text>
<rect class="b" x="674" y="80" width="190" height="40" rx="8"/>
<text class="s" x="690" y="105">② 按 VLAN 查（DX2V）</text>
<rect class="b" x="476" y="128" width="186" height="40" rx="8"/>
<text class="s" x="492" y="153">③ 未知泛洪（DT2U）</text>
<rect class="b" x="674" y="128" width="190" height="40" rx="8"/>
<text class="s" x="690" y="153">④ 组播复制（DT2M）</text>
<text class="s" x="476" y="192">③④ 都带"一发多"语义 → 必须防重复</text>
<text class="r" x="476" y="216">→ 所以二层多出一个 DF 选举，三层没有对应物</text>

<rect class="b" x="20" y="258" width="860" height="60" rx="8"/>
<text class="t" x="36" y="282">换掉的东西完全对应</text>
<text class="m" x="36" y="304">三层：换掉的是 VRF 标签　　二层：换掉的是 VLAN / BD 标签　　核心都不再有业务状态</text>

<rect class="b1" x="20" y="330" width="860" height="56" rx="8"/>
<text class="s" x="36" y="352">推论一：二层的行为数 ×2，但控制面不变 —— EVPN 原样复用（7.2）</text>
<text class="s" x="36" y="374">推论二：凡是带复制语义的行为，都必须和"多归去重"一起设计 —— anycast 只解决单播（7.3）</text>
</svg>
