<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" width="900" height="412" role="img" aria-label="案例 C：两端 PE 都是 9000 字节 MTU，但核心一台 P 的互联口仍是 1500，导致 9000 字节帧被静默丢弃，TCP 靠重传维持，吞吐从 3.2 Gbps 掉到 1.8 Gbps">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5" fill="#c0392b"/></marker></defs>
<rect class="bg" width="900" height="412"/>
<text class="h" x="20" y="26">案例 C：一条 1500 的互联口，让整条存储复制降速</text>

<rect class="b1" x="20" y="52" width="150" height="56" rx="8"/>
<text class="t" x="40" y="78">PE-1</text>
<text class="m" x="36" y="98">MTU 9000</text>
<rect class="b1" x="375" y="52" width="150" height="56" rx="8"/>
<text class="t" x="395" y="78">P-1</text>
<text class="r" x="391" y="98">MTU 1500</text>
<rect class="b1" x="730" y="52" width="150" height="56" rx="8"/>
<text class="t" x="750" y="78">PE-2</text>
<text class="m" x="746" y="98">MTU 9000</text>

<path class="ar" d="M170 80 L373 80" marker-end="url(#a)"/>
<path class="ar" d="M525 80 L728 80" marker-end="url(#a)"/>

<rect class="b4" x="300" y="118" width="300" height="40" rx="8"/>
<text class="r" x="316" y="143">9000 B 帧在此被静默丢弃（无 ICMP 回执）</text>
<path class="ar" d="M450 108 L450 116" marker-end="url(#ar)"/>

<rect class="b" x="20" y="176" width="420" height="112" rx="8"/>
<text class="t" x="36" y="200">定位过程</text>
<text class="s" x="36" y="222">① 小包 ping 正常；ping size 8000 → 全丢</text>
<text class="s" x="36" y="242">② 两端 PE 侧 MTU 都显示 9000（看起来没问题）</text>
<text class="s" x="36" y="262">③ 逐跳查核心互联口 → 某台 P 仍是 1500</text>
<text class="s" x="36" y="282">④ 定论：大帧被丢，TCP 重传维持，故"变慢不断"</text>

<rect class="b1" x="460" y="176" width="420" height="112" rx="8"/>
<text class="t" x="476" y="200">业务侧表现（为什么难发现）</text>
<text class="s" x="476" y="222">吞吐 3.2 Gbps → 1.8 Gbps，无丢包告警</text>
<text class="s" x="476" y="242">监控上只有"变慢"，没有 link down / error</text>
<text class="r" x="476" y="262">控制面与小探针全部正常，掩盖了问题</text>
<text class="g" x="476" y="282">修复：核心互联口统一 MTU 9100（含 40 B + 余量）</text>

<rect class="b3" x="20" y="300" width="860" height="60" rx="8"/>
<text class="t" x="36" y="324">教训：jumbo 必须"全域一致"，不能"关键链路一致"</text>
<text class="s" x="36" y="346">一条 1500 的链路就足以让整条复制降速；割接前用业务最大帧长做端到端探测，比看接口 MTU 可靠</text>

<rect class="b2" x="20" y="370" width="860" height="34" rx="8"/>
<text class="s" x="36" y="392">复测：吞吐回到 3.2 Gbps，重传率归零 —— 说明此前的"性能问题"从头到尾都是 MTU 配置问题</text>
</svg>
