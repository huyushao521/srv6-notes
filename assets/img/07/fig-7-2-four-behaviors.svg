<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-label="四个二层行为的处理路径：DX2 零查表直出、DX2V 按 VLAN 查、DT2U 查 MAC 表并可泛洪、DT2M 取 Argument 中的 BD 做复制">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="452"/>
<text class="h" x="20" y="26">7.1 四个行为：差别只在"剥掉外层之后查哪张表"</text>

<rect class="b1" x="270" y="40" width="360" height="40" rx="8"/>
<text class="t" x="286" y="65">收到 IPv6 外层，DA = 本地某个 SID</text>
<path class="ar" d="M450 80 L450 92"/>
<path class="ar" d="M60 92 L840 92"/>
<path class="ar" d="M110 92 L110 106" marker-end="url(#a)"/>
<path class="ar" d="M330 92 L330 106" marker-end="url(#a)"/>
<path class="ar" d="M550 92 L550 106" marker-end="url(#a)"/>
<path class="ar" d="M780 92 L780 106" marker-end="url(#a)"/>

<rect class="b2" x="20" y="108" width="180" height="56" rx="8"/>
<text class="m" x="36" y="130">End.DX2</text>
<text class="s" x="36" y="150">uDX2　0x0020</text>

<rect class="b2" x="240" y="108" width="180" height="56" rx="8"/>
<text class="m" x="256" y="130">End.DX2V</text>
<text class="s" x="256" y="150">uDX2V　0x0021</text>

<rect class="b3" x="460" y="108" width="180" height="56" rx="8"/>
<text class="m" x="476" y="130">End.DT2U</text>
<text class="s" x="476" y="150">uDT2U　0x0022</text>

<rect class="b3" x="700" y="108" width="180" height="56" rx="8"/>
<text class="m" x="716" y="130">End.DT2M</text>
<text class="s" x="716" y="150">uDT2M　0x0023（Arg=BD）</text>

<path class="ar" d="M110 164 L110 186" marker-end="url(#a)"/>
<path class="ar" d="M330 164 L330 186" marker-end="url(#a)"/>
<path class="ar" d="M550 164 L550 186" marker-end="url(#a)"/>
<path class="ar" d="M780 164 L780 186" marker-end="url(#a)"/>
<text class="s" x="16" y="182">剥外层</text>
<text class="s" x="286" y="182">剥外层</text>
<text class="s" x="494" y="182">剥外层</text>
<text class="s" x="724" y="182">剥外层</text>

<rect class="b" x="20" y="188" width="180" height="72" rx="8"/>
<text class="t" x="36" y="212">不查任何表</text>
<text class="s" x="36" y="232">SID 即 AC，直接出 AC-x</text>
<text class="g" x="36" y="252">零查表，最快</text>

<rect class="b" x="240" y="188" width="180" height="72" rx="8"/>
<text class="t" x="256" y="212">查 VLAN→AC 映射</text>
<text class="s" x="256" y="232">按帧内 VLAN Tag 选 AC</text>
<text class="o" x="256" y="252">一条 SID 服务多 VLAN</text>

<rect class="b" x="460" y="188" width="180" height="72" rx="8"/>
<text class="t" x="476" y="212">查 BD 的 MAC 表</text>
<text class="s" x="476" y="232">命中 → 出对应 AC</text>
<text class="r" x="476" y="252">未命中 → 泛洪（含远端）</text>

<rect class="b" x="700" y="188" width="180" height="72" rx="8"/>
<text class="t" x="716" y="212">取 Arg 里的 BD</text>
<text class="s" x="716" y="232">复制到该 BD 的所有 AC</text>
<text class="r" x="716" y="252">+ 所有 IMET 远端（按 DF）</text>

<rect class="b1" x="20" y="282" width="860" height="76" rx="8"/>
<text class="t" x="36" y="306">一句话记住查表的层次</text>
<text class="m" x="36" y="328">DX2 → 不查　　DX2V → 查 VLAN 表　　DT2U → 查 MAC 表　　DT2M → 查 BD + IMET 复制表</text>
<text class="s" x="36" y="348">前三者是"点对点/单播"语义，只有 DT2M 带复制语义，因此在多归场景必须由 DF 兜住去重</text>

<rect class="b3" x="20" y="374" width="860" height="64" rx="8"/>
<text class="t" x="36" y="398">为什么 DX2 是海量 E-Line 的最优解</text>
<text class="s" x="36" y="420">转发面上省掉了 MAC 学习、查表、老化三件事：SID 直接绑定 AC，行为像"标签直通"</text>
</svg>
