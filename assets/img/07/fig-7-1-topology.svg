<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="本章拓扑：DC-1 的 CE-SW1 全活多归到 PE-1 与 PE-3 共享一个 anycast SID，DC-2 的 CE-SW2 单归 PE-2，中间 P-1/P-2 只跑 IGP 与 locator">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b4{fill:#fdeaea;stroke:#c0392b;stroke-width:1.4}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.r{fill:#c0392b;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}.g{fill:#2f855a;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 11.5px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}
.b3{fill:#2a2113;stroke:#ecc94b}.b4{fill:#2a1618;stroke:#f87171}.b{fill:#1b2029;stroke:#39414f}
.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.r{fill:#f87171}.g{fill:#68d391}.o{fill:#ecc94b}
.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker>
<marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#2f855a"/></marker></defs>
<rect class="bg" width="900" height="470"/>
<text class="h" x="20" y="26">7.0 本章拓扑：一台 CE 全活多归，两台 PE 共享一个 anycast SID</text>

<rect class="b" x="20" y="44" width="390" height="176" rx="10"/>
<text class="t" x="36" y="68">DC-1（PE-1，多归 PE-3）</text>
<rect class="b2" x="44" y="82" width="112" height="44" rx="8"/>
<text class="t" x="62" y="109">CE-SW1</text>
<rect class="b1" x="250" y="82" width="132" height="44" rx="8"/>
<text class="t" x="286" y="109">PE-1</text>
<rect class="b1" x="250" y="150" width="132" height="44" rx="8"/>
<text class="t" x="286" y="177">PE-3</text>
<path class="ar" d="M156 104 L248 104" marker-end="url(#a)"/>
<text class="s" x="182" y="96">AC</text>
<path class="ar" d="M100 126 L100 172 L248 172" marker-end="url(#a)"/>
<text class="s" x="112" y="190">AC（同一 ES）</text>
<text class="o" x="36" y="212">全活多归：CE-SW1 两条 AC 同时可用，PE-1 与 PE-3 互为备份</text>

<rect class="b" x="490" y="44" width="390" height="176" rx="10"/>
<text class="t" x="506" y="68">DC-2（PE-2）</text>
<rect class="b2" x="514" y="82" width="112" height="44" rx="8"/>
<text class="t" x="532" y="109">CE-SW2</text>
<rect class="b1" x="700" y="82" width="132" height="44" rx="8"/>
<text class="t" x="736" y="109">PE-2</text>
<path class="ar" d="M626 104 L698 104" marker-end="url(#a)"/>
<text class="s" x="652" y="96">AC</text>
<text class="o" x="506" y="212">单归：只有一条 AC，无需 DF 竞争，但同样要配 EVI 与 SID</text>

<rect class="b1" x="190" y="262" width="140" height="42" rx="8"/>
<text class="t" x="238" y="289">P-1</text>
<rect class="b1" x="570" y="262" width="140" height="42" rx="8"/>
<text class="t" x="618" y="289">P-2</text>
<path class="ar" d="M215 220 L215 240 L260 240 L260 260" marker-end="url(#a)"/>
<path class="ar" d="M685 220 L685 240 L640 240 L640 260" marker-end="url(#a)"/>
<path class="ar" d="M330 283 L568 283" marker-end="url(#a)"/>
<path class="ar" d="M568 283 L330 283" marker-end="url(#a2)" opacity="0"/>
<text class="r" x="360" y="272">IGP + locator 路由（无 EVPN 状态）</text>

<rect class="b3" x="20" y="320" width="860" height="130" rx="10"/>
<text class="t" x="36" y="344">本章固定参数（后文所有例子都基于这套编址）</text>
<text class="m" x="36" y="368">业务：EVI 100 ／ BD 100 ／ VLAN 100　　　　　　　　ES anycast SID：fdbb:bb00:0100:e100::</text>
<text class="m" x="36" y="392">PE-1 locator fdbb:bb00:0001::/48　　PE-2 fdbb:bb00:0002::/48　　PE-3 fdbb:bb00:0003::/48</text>
<text class="s" x="36" y="414">注意 anycast SID 的 /48 前缀 fdbb:bb00:0100::/48 不属于任何一台 PE 的本机 locator</text>
<text class="o" x="36" y="436">它必须由 PE-1 与 PE-3 同时通告，IGP 里才出现两条等价路径 —— 这是 7.3 逐流分担的前提</text>

</svg>
