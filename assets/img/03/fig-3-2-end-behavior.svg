<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="End 端点行为：DA 命中本地 SID 后 SL 减一、DA 换成下一段并重新查表">
<style>
.bg{fill:#fff}.box{stroke-width:1.4}.b1{fill:#eef4fc;stroke:#0b6bcb}.b2{fill:#eaf7ee;stroke:#2f855a}.b3{fill:#fdf3e7;stroke:#b7791f}
.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}
.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}.m{fill:#1f2328;font:600 13px Consolas,monospace}
.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}.b3{fill:#2a2113;stroke:#ecc94b}
.b{fill:#1b2029;stroke:#39414f}.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.o{fill:#ecc94b}.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="340"/>
<text class="h" x="24" y="26">End：前缀段的默认行为（原书 Figure 3.5 / 3.6 重绘）</text>

<rect class="b1 box" x="24" y="42" width="252" height="152" rx="8"/>
<text class="t" x="40" y="66">① 节点 2 收到</text>
<text class="m" x="40" y="94">DA = fc00:0:2:X::</text>
<text class="s" x="40" y="118">SRH：SL = 1</text>
<text class="s" x="40" y="140">List[0] = fc00:0:5:eeee::</text>
<text class="s" x="40" y="162">Hop Limit = 64</text>

<rect class="b box" x="296" y="42" width="308" height="152" rx="8"/>
<text class="t" x="312" y="66">② 执行三步</text>
<text class="s" x="312" y="94">1. DA 属于本地 locator（/48）</text>
<text class="s" x="312" y="118">2. SL ← SL − 1，DA ← List[SL]</text>
<text class="s" x="312" y="142">3. 按新 DA 重新查 FIB</text>
<text class="o" x="312" y="168">不动载荷、不看内层任何字段</text>

<rect class="b2 box" x="624" y="42" width="252" height="152" rx="8"/>
<text class="t" x="640" y="66">③ 节点 2 发出</text>
<text class="m" x="640" y="94">DA = fc00:0:5:eeee::</text>
<text class="s" x="640" y="118">SRH：SL = 0</text>
<text class="s" x="640" y="140">Hop Limit = 63</text>
<text class="s" x="640" y="162">→ 下一跳通往节点 5</text>

<path class="ar" d="M276 118 L292 118" marker-end="url(#a)"/>
<path class="ar" d="M604 118 L620 118" marker-end="url(#a)"/>

<rect class="b" x="24" y="216" width="852" height="104" rx="8"/>
<text class="t" x="40" y="240">End 只做两件事：把 DA 换成下一段、再查一次表</text>
<text class="s" x="40" y="264">SID 的行为由 locator 之后那段位数决定；flavor（uN / PSP / USD）只改“何时结束、在哪剥离”</text>
<text class="s" x="40" y="286">报文没有 SRH、或 SL 已归零时，End 退化为按该 SID 终结（USD）或直接转发</text>
<text class="s" x="40" y="308">同一段代码处理所有非压缩 SID：差异只在本地 SID 表里查到的“行为 + flavor”</text>
</svg>
