<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 348" width="900" height="348" role="img" aria-label="End.uN flavor：每次左移 16 位，容器末尾停止左移，Block 全程不变">
<style>
.bg{fill:#fff}.b1{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.b2{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.b3{fill:#fdf3e7;stroke:#b7791f;stroke-width:1.4}.b{fill:#f7f9fc;stroke:#cbd3de;stroke-width:1.4}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.o{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}.ar{stroke:#9aa4b2;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.b1{fill:#16283d;stroke:#58a6ff}.b2{fill:#14291d;stroke:#68d391}.b3{fill:#2a2113;stroke:#ecc94b}
.b{fill:#1b2029;stroke:#39414f}.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.o{fill:#ecc94b}.ar{stroke:#5a6472}}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9aa4b2"/></marker></defs>
<rect class="bg" width="900" height="348"/>
<text class="h" x="24" y="26">End.uN flavor：16 位步长左移，容器末尾停止（原书 Figure 3.7 / 3.8 / 3.9 重绘）</text>

<text class="s" x="24" y="60">Block 恒为 fc00:0000（32 bit）</text>
<text class="s" x="300" y="60">uSID 容器：6 × 16 bit</text>

<text class="t" x="24" y="96">① 节点 2 收到</text>
<text class="m" x="196" y="96">fc00:0000 │ 0002 0003 0004 0000 0000 0000</text>
<text class="s" x="196" y="118">我的 uSID 在槽 1 → 执行 uN，整段左移 16 bit</text>

<path class="ar" d="M330 128 L330 148" marker-end="url(#a)"/>

<text class="t" x="24" y="176">② 节点 3 收到</text>
<text class="m" x="196" y="176">fc00:0000 │ 0003 0004 0000 0000 0000 0000</text>
<text class="s" x="196" y="198">同样动作：命中、左移 16 bit、按新 DA 查表</text>

<path class="ar" d="M330 208 L330 228" marker-end="url(#a)"/>

<rect class="b3" x="24" y="236" width="852" height="52" rx="8"/>
<text class="t" x="40" y="258">③ 节点 4 收到：0004 是容器里最后一个非零 uSID</text>
<text class="s" x="40" y="278">左移后全为 0000（EoC）→ 不再左移，按 flavor 决定：本地交付 / USD 解封装 / 剥 SRH</text>

<rect class="b" x="24" y="300" width="852" height="40" rx="8"/>
<text class="s" x="40" y="325">判据：DA 前 32 位 = 我的 block，且紧随的 16 位 = 我 → 一次最长匹配即可同时完成 uN 与 uA</text>
</svg>
