<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="3216 的含义：32 bit Block 加 6 条 16 bit uSID 以及可规划地址量">
<style>
.bg{fill:#fff}.loc{fill:#eef4fc;stroke:#0b6bcb;stroke-width:1.4}.fun{fill:#eaf7ee;stroke:#2f855a;stroke-width:1.4}
.pad{fill:#f5f6f8;stroke:#cbd3de;stroke-width:1.2;stroke-dasharray:4 3}
.t{fill:#1f2328;font:600 13px 'Microsoft YaHei',system-ui,sans-serif}.s{fill:#57606a;font:11.5px 'Microsoft YaHei',system-ui,sans-serif}
.m{fill:#1f2328;font:600 12.5px Consolas,monospace}.h{fill:#0b6bcb;font:600 12.5px 'Microsoft YaHei',system-ui,sans-serif}
.k{fill:#b7791f;font:600 12px 'Microsoft YaHei',system-ui,sans-serif}
@media (prefers-color-scheme:dark){.bg{fill:#161a21}.loc{fill:#16283d;stroke:#58a6ff}.fun{fill:#14291d;stroke:#68d391}
.pad{fill:#171c24;stroke:#39414f}.t,.m{fill:#e6e9ef}.s{fill:#9aa4b2}.h{fill:#58a6ff}.k{fill:#ecc94b}}
</style>
<rect class="bg" width="900" height="340"/>
<text class="h" x="24" y="28">"3216" 的含义：1 个 128 bit uSID 容器 = 32 bit Block + 6 条 16 bit uSID</text>

<rect class="loc" x="30" y="52" width="210" height="52"/>
<rect class="fun" x="240" y="52" width="105" height="52"/>
<rect class="fun" x="345" y="52" width="105" height="52"/>
<rect class="pad" x="450" y="52" width="105" height="52"/>
<rect class="pad" x="555" y="52" width="105" height="52"/>
<rect class="pad" x="660" y="52" width="105" height="52"/>
<rect class="pad" x="765" y="52" width="105" height="52"/>
<text class="m" x="135" y="83" text-anchor="middle">fdbb:bb00</text>
<text class="m" x="292" y="83" text-anchor="middle">0007</text>
<text class="m" x="397" y="83" text-anchor="middle">0100</text>
<text class="s" x="502" y="83" text-anchor="middle">0000</text>
<text class="s" x="607" y="83" text-anchor="middle">0000</text>
<text class="s" x="712" y="83" text-anchor="middle">0000</text>
<text class="s" x="817" y="83" text-anchor="middle">0000</text>
<text class="s" x="135" y="122" text-anchor="middle">Block 32 bit · 可路由</text>
<text class="s" x="292" y="122" text-anchor="middle">全局 uN</text>
<text class="s" x="397" y="122" text-anchor="middle">本地 uF / uA / uDT</text>
<text class="s" x="607" y="122" text-anchor="middle">0000 = End of Container</text>

<line x1="30" y1="146" x2="870" y2="146" stroke="#cbd3de" stroke-width="1"/>
<text class="t" x="30" y="172">地址账（按"节点数 × 每节点业务"约束，不按 2 的幂硬算）</text>
<text class="m" x="30" y="198">2^16</text><text class="s" x="66" y="198">= 65,536 个 uN / Block</text>
<text class="m" x="280" y="198">×</text>
<text class="m" x="300" y="198">≈ 0.87</text><text class="s" x="340" y="198">的有效业务填充率</text>
<text class="m" x="430" y="198">⇒</text>
<text class="m" x="456" y="198">1 Block ≈ 57,000</text><text class="s" x="590" y="198">个全局 uSID</text>

<text class="m" x="30" y="228">256 Block</text><text class="s" x="98" y="228">（= 256 个 /32 = 1 个 /24）</text>
<text class="m" x="320" y="228">≈ 15,000,000</text><text class="s" x="425" y="228">个全局 uSID</text>
<text class="m" x="520" y="228">占 FC00::/7 的</text><text class="m" x="600" y="228">0.00153%</text>

<text class="k" x="30" y="262">主流部署只用 2 个 Block（一个 min-cost、一个 min-delay），但规划上按 256 个 Block 预留 —— 空间不是瓶颈，规划才是。</text>
<text class="s" x="30" y="292">槽位从左到右消费：每跳吃掉一条 16 bit，剩余位补 0000；6 条以内不需要 SRH（1.8 节）。</text>
<text class="s" x="30" y="316">16 bit 与 32 bit uSID 可在同一程序里混用，靠"剩余位长度可变"实现（第 15 章 WLIB）。</text>
</svg>
